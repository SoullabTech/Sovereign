##
## strfry.conf — Soullab Nostr Relay
##
## Self-hosted, member-gated Nostr relay.
## Docs: https://github.com/hoytech/strfry
##

relay {
    ## The TCP port to bind to
    bind = "0.0.0.0:7777"

    ## Relay identity
    info {
        name = "Soullab Sovereign Relay"
        description = "Private Nostr relay for Soullab members. Practitioner-client messaging and community channels."
        contact = "admin@soullab.life"
        ## Set this to the MAIA root pubkey once generated (Phase 4)
        ## pubkey = ""
    }

    ## Max size of incoming websocket messages
    maxWebsocketPayloadSize = 131072

    ## Auto-ping connected clients to keep connections alive
    autoPingSeconds = 55

    ## How many events to return for an initial subscription request
    realtimeTimeout = 0

    ## Max number of subscriptions per connection
    maxNumSubsPerConnection = 20
}

db {
    ## Path to LMDB data directory (mounted as Docker volume)
    dir = "/app/strfry-db"
}

dbParams {
    ## Max size of LMDB memory map (adjust for expected event volume)
    maxMem = 10737418240  # 10 GiB
}

events {
    ## Maximum event content size (bytes)
    maxEventSize = 65536

    ## Oldest event allowed (seconds from now). 0 = no limit.
    rejectEventsOlderThanSeconds = 94608000  # ~3 years

    ## Newest event allowed (seconds in future)
    rejectEventsNewerThanSeconds = 900  # 15 minutes

    ## Limit ephemeral event rate per second per IP
    ephemeralEventsRateLimit = 100
}

relay {
    ## Write policy plugin: validate events via MAIA's member registry.
    ## The script calls /api/nostr/validate-pubkey on maia-sovereign.
    ## Only registered members can publish to this relay.
    writePolicy {
        plugin = "/app/scripts/nostr-write-policy.sh"
    }
}
