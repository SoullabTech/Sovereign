##
## strfry.conf — Soullab Nostr Relay
##
## Self-hosted, member-gated Nostr relay for Soullab.
## Config format: libconfig (NOT TOML — db is a string, not a block)
## Docs: https://github.com/hoytech/strfry
##

# Path to LMDB database directory (mounted as Docker volume)
db = "/app/strfry-db"

dbParams {
    maxreaders = 256
    # 10 GiB max DB size
    mapsize = 10737418240
}

relay {
    # TCP bind address and port (Docker-internal only; Caddy handles TLS)
    bind = "0.0.0.0"
    port = 7777

    # Relay identity (NIP-11 info endpoint)
    info {
        name = "Soullab Sovereign Relay"
        description = "Private Nostr relay for Soullab members. Practitioner-client messaging and community channels."
        contact = "admin@soullab.life"
        # Set to MAIA root pubkey once generated (Phase 4)
        pubkey = ""
        icon = ""
    }

    # Max websocket payload size (bytes)
    maxWebsocketPayloadSize = 131072

    # Keep-alive ping interval (seconds)
    autoPingSeconds = 55

    # Max subscriptions per connection
    maxSubsPerConnection = 20

    # Write policy plugin: validates event author via MAIA member registry.
    # Only registered Soullab members can publish events to this relay.
    writePolicy {
        plugin = "/app/scripts/nostr-write-policy.sh"
    }

    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
}
