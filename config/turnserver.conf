# Session Room TURN/STUN — self-hosted coturn. 1:1 P2P WebRTC relay for Encounters.
#
# Constitutional basis:
#   docs/specs/NATIVE_SESSION_ROOM_PHASE1_SPEC_2026-07-05.md §6 — no third party in the media path.
#   Refusal R-A5 — only self-hosted relay endpoints are ever handed to a peer connection.
#
# The shared secret is NOT in this file. It is passed at runtime via
#   --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
# from .env.production (see the coturn service in docker-compose.production.yml).

listening-port=3478
fingerprint

# Ephemeral REST credentials (coturn "TURN REST API"):
#   username   = "<unix-expiry>:<label>"
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
# Minted per session, short TTL, by /api/open/session-room/[roomId]/turn-credentials.
use-auth-secret
realm=soullab.life

# TURN relay UDP port range. MUST be router-forwarded to 192.168.0.104 alongside 3478.
# Kept small on purpose (1:1 rooms).
min-port=49160
max-port=49200

# Not an open relay (R-A5 posture): refuse multicast + private/loopback peer targets so
# the relay cannot be abused to reach internal services.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Modest quotas for 1:1 rooms.
user-quota=12
total-quota=200

# Behind NAT (minisforum), coturn must advertise its public address. Provide at deploy via:
#   --external-ip=<PUBLIC_IP>/192.168.0.104
# Omitted here because the public IP is environment-specific (see the compose deploy note).

# Logging to stdout for docker; credentials are never logged.
log-file=stdout
no-cli
listening-ip=192.168.0.104
# Same-server relay⇄relay: its own relay interface is a legitimate peer.
# Narrow exception — the RFC1918 denies below still block everything else.
allowed-peer-ip=192.168.0.104
