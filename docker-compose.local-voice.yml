# ═══════════════════════════════════════════════════════════════════════════════
# MAIA Sovereign - Local Voice Services (Overlay)
# ═══════════════════════════════════════════════════════════════════════════════
# Additive overlay for local TTS. Does NOT modify production services.
#
# Usage:
#   docker compose -f docker-compose.production.yml -f docker-compose.local-voice.yml up -d
#
# Or standalone for dev:
#   docker compose -f docker-compose.local-voice.yml up -d kokoro-tts
#
# SOVEREIGNTY: This removes the last cloud dependency from MAIA's voice.
# With this running, MAIA speaks without phoning home.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═════════════════════════════════════════════════════════════════════════════
  # Kokoro TTS - Local Text-to-Speech (OpenAI-compatible API)
  # ═════════════════════════════════════════════════════════════════════════════
  # 82M parameter model. Runs on CPU. Fast enough for real-time.
  # Exposes OpenAI-compatible /v1/audio/speech endpoint on port 8880.
  #
  # Test: curl -X POST http://localhost:8880/v1/audio/speech \
  #         -H "Content-Type: application/json" \
  #         -d '{"input": "Hello from MAIA", "voice": "af_heart", "model": "kokoro"}' \
  #         --output test.mp3
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    # No container_name — let compose auto-name to avoid ghost collisions
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "8880:8880"

    environment:
      # Default voice — validate available voices after first boot
      KOKORO_DEFAULT_VOICE: "af_heart"

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/v1/audio/speech -X POST -H 'Content-Type: application/json' -d '{\"input\":\"ok\",\"voice\":\"af_heart\",\"model\":\"kokoro\"}' -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

    networks:
      - maia-network

  # ═════════════════════════════════════════════════════════════════════════════
  # gTTS Cloud Placeholder — NON-SOVEREIGN (NOT Sesame CSM)
  # ═════════════════════════════════════════════════════════════════════════════
  # Build context: app/api/_backend/csm, Dockerfile.simple = Google Cloud TTS (gTTS).
  # This is NOT Sesame CSM and NOT a local sovereign voice. The /tts audio path
  # egresses text to Google, so it is DEFAULT OFF (ALLOW_CLOUD_TTS unset → 403);
  # only /ci/shape (local text-shaping) and /health run without opt-in.
  #
  # Per docs/specs/VOICE_FUNCTION_TAXONOMY_2026-07-07.md §B: a mislabeled provider
  # is worse than an absent one — Sesame stays OUT of the lab until the REAL CSM
  # backend (Dockerfile.real / start-sesame-real.sh, Coqui + torch + HF weights)
  # is stood up, which is gated on Meta Llama-3.2 license review.
  #
  # To swap in real Sesame CSM: change dockerfile to Dockerfile.real, rename this
  # service/container back to sesame, and re-qualify via the fidelity harness.
  gtts-placeholder:
    build:
      context: ./app/api/_backend/csm
      dockerfile: Dockerfile.simple
    container_name: maia-gtts-placeholder
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8881:8000"
    environment:
      # Cloud egress is opt-in only. Set ALLOW_CLOUD_TTS=1 to permit gTTS /tts.
      ALLOW_CLOUD_TTS: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - maia-network

networks:
  maia-network:
    external: true
    name: maia-sovereign_maia-internal
