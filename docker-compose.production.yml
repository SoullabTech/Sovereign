# ═══════════════════════════════════════════════════════════════════════════════
# MAIA Sovereign - Production Docker Compose with HTTPS
# ═══════════════════════════════════════════════════════════════════════════════
# Full production stack:
# - Caddy: Automatic HTTPS, reverse proxy
# - MAIA: Consciousness computing platform
# - PostgreSQL: Persistent data storage
# - Ollama (optional): Local LLM inference
#
# Usage:
#   1. Copy .env.production.template to .env.production
#   2. Fill in your domain and secrets
#   3. docker compose -f docker-compose.production.yml up -d
# ═══════════════════════════════════════════════════════════════════════════════

# Shared build config - single image for web + worker
x-maia-build: &maia_build
  context: .
  dockerfile: Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-unknown}
    NEXT_PUBLIC_SHOW_BETA_BADGE: ${NEXT_PUBLIC_SHOW_BETA_BADGE:-false}
    # Deploy-lane tripwire: deliberately NO default. Only the deploy lane
    # (scripts/deploy-lock.sh acquire_deploy_lock) exports this, so a raw
    # `docker compose ... up -d --build` FAILS LOUDLY in the Dockerfile
    # instead of quietly bypassing the lock / rollback tagging / pre-deploy
    # gate (2026-07-10 incident). See docs/ops/DEPLOY_LANE_TOKEN.md.
    DEPLOY_LANE_TOKEN: ${DEPLOY_LANE_TOKEN:-}

x-maia-image: &maia_image maia-sovereign:prod

# Prevent log files from filling disk
x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ═════════════════════════════════════════════════════════════════════════════
  # Caddy - Automatic HTTPS Reverse Proxy
  # ═════════════════════════════════════════════════════════════════════════════
  # Handles:
  # - Automatic Let's Encrypt SSL certificates
  # - HTTPS termination
  # - Reverse proxy to MAIA
  caddy:
    image: caddy:2-alpine
    container_name: maia-caddy
    restart: unless-stopped
    logging: *default_logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Beta tester APK serve — read-only bind mount.
      # Files in ./beta on the host are exposed at /srv/beta inside the
      # container, served by the @beta_apk handler in Caddyfile with the
      # correct application/vnd.android.package-archive MIME.
      # See Caddyfile for the rationale (Drive's preview path mangles MIME).
      - ./beta:/srv/beta:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env.production
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    security_opt:
      - no-new-privileges:true
    depends_on:
      maia:
        condition: service_healthy
      maia-api:
        condition: service_healthy
    networks:
      - maia-public
      - marc-studio_default
      - rudeboy-caddy-bridge  # Route rudeboy.soullab.life — no MAIA internals exposed

  # ═════════════════════════════════════════════════════════════════════════════
  # MAIA - Consciousness Computing Platform
  # ═════════════════════════════════════════════════════════════════════════════
  maia:
    build: *maia_build
    image: *maia_image
    container_name: maia-sovereign
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      # GIT_COMMIT is deliberately NOT set here. The image bakes it via the
      # build arg (Dockerfile ENV), pinning the self-report to the code the
      # image was actually built from. A runtime override here would re-stamp
      # the container at every `up` from whatever shell runs it — letting a
      # correctly-provenanced image report "unknown" or a stale SHA.
      # HOST MARKER: Identifies which physical machine is running this stack.
      # Change to "mac-studio" when running on the M4, "minisforum" on the Linux server.
      # Appears in every [voice] server log line and in SSE complete events for comparison.
      MAIA_HOST_ID: "minisforum"
      # STRICT 503: Claude-only mode - return 503 if Claude unavailable, never fall back to Ollama/DeepSeek
      MAIA_STRICT_503: "1"
      # Selflet Phase 2E: Disabled by default, enable via override file
      MAIA_SELFLET_WRITE_ENABLED: "0"
      MAIA_SELFLET_ALLOW_ANON: "0"
      # Trust Observation: Phase 3 behavioral signal capture
      TRUST_OBSERVATION: "true"
      # AIN Shape Telemetry: Enable quality monitoring in production
      AIN_SHAPE_TELEMETRY: "1"
      # AIN Phase 1: Knowledge Gate — awareness-modulated source well scoring
      AIN_KNOWLEDGE_GATE_ENABLED: "1"
      # Faster-Whisper for sovereign voice transcription (OpenAI-compatible API)
      WHISPER_LOCAL_URL: "http://whisper:8000"
      WHISPER_URL: "http://whisper:8000"
      # Mythic Atlas — symbolic classifier (deterministic keyword stub).
      # Client: lib/services/mythicAtlasService.ts (getMythicAtlasContext).
      # Reached on the internal compose network; the client fails safe with a
      # neutral fallback if this is ever unreachable (no hang, no surfaced error).
      MYTHIC_ATLAS_URL: "http://mythic-atlas:8088/api/mythic-atlas"
      # Session Room: enable chunked audio upload for live transcription
      ALLOW_AUDIO_UPLOADS: "true"
      # WebAuthn/Passkey configuration - must match the domain users access
      WEBAUTHN_RP_ID: "soullab.life"
      WEBAUTHN_ORIGIN: "https://soullab.life"
      # Embedding mode: queue jobs for async processing by embed-worker
      MAIA_EMBEDDINGS_MODE: queue
      # Admin cockpit password (set in .env.production)
      LABTOOLS_ADMIN_PASSWORD: ${LABTOOLS_ADMIN_PASSWORD:-}
      # Sovereign inference: qwen2.5:14b-instruct primary, Claude escalation for depth
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:7b"
      OLLAMA_MODEL_GENERAL: "qwen2.5:7b"
      OLLAMA_MODEL_FAST: "qwen2.5:7b"
      OLLAMA_MODEL_DEEP: "qwen2.5:14b-instruct"
      LOCAL_TIER_ENABLED: "true"
      # MAIA_TEXT_PROVIDER: "local"   # enable when route timeout raised; 7b@5.8tok/s = ~30s/turn
      # Voice notes storage directory
      VOICE_NOTES_DIR: "/app/storage/voice-notes"
      # Feature flag: Explainer Scripts for HeyGen (Phase 1)
      NEXT_PUBLIC_ENABLE_EXPLAINER_SCRIPTS: "true"
      # Sovereign TTS: Kokoro is the production voice provider (zero-OpenAI doctrine).
      # `sesame` is NOT a qualified production audio provider — the maia-sesame-tts
      # service does CI text-shaping only, not synthesis (see R15 in lib/tts/ttsRouter.ts;
      # docs/adr/012). It stays a Voice Lab candidate until a verified Sesame CSM
      # audio backend exists. OpenAI TTS remains a consented cloud fallback only.
      MAIA_LOCAL_VOICE_ENABLED: "1"
      MAIA_TTS_PROVIDER: "kokoro"       # Sovereign TTS — zero-OpenAI doctrine
      KOKORO_TTS_URL: "http://kokoro-tts:8880"  # Production voice provider (sovereign)
      SESAME_TTS_URL: "http://maia-sesame-tts:8000"  # CI shaping only — not audio synthesis

    # Schema gate: refuse to boot if required migrations are missing
    command: ["./scripts/entrypoint.sh"]

    volumes:
      # Large media files - mounted from host instead of bundled in image
      - ./public/audiobook:/app/public/audiobook:ro
      # Community Commons library content
      - ./Community-Commons:/app/Community-Commons:ro
      # Practitioner file vault - persistent storage for uploaded files
      - vault_data:/app/data/vault
      # Voice notes storage - persisted across container restarts
      - voice_notes_data:/app/storage/voice-notes
      # Media Studio storage - sovereign local media pipeline
      - media_data:/app/data/media
      # AIN Obsidian Vault — sovereign field-context knowledge base (read-only)
      # Host source: /home/soullab/AIN (synced from Mac Studio
      # /Users/soullab/Documents/AIN/ via rsync). Read by ObsidianVaultBridge
      # when OBSIDIAN_VAULT_PATH=/app/data/ain-vault is set in .env.production
      # and MAIA_FIELD_CONTEXT_ENABLED=true.
      - /home/soullab/AIN:/app/data/ain-vault:ro

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/consciousness/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - maia-internal
      - maia-public

  # ═════════════════════════════════════════════════════════════════════════════
  # MAIA API Service - Standalone Backend API
  # ═════════════════════════════════════════════════════════════════════════════
  # Handles all API requests for the MAIA platform.
  # Multi-tenant backbone for all Soullab products.
  # AIN is a dependency called by MAIA API, never the reverse.
  #
  # Deploy: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build maia-api
  # Logs:   docker compose --env-file .env.production -f docker-compose.production.yml logs -f maia-api
  maia-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Deploy-lane tripwire — see x-maia-build above.
        DEPLOY_LANE_TOKEN: ${DEPLOY_LANE_TOKEN:-}
    image: maia-api:prod
    container_name: maia-api
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: "3001"
      # CORS origins for API (comma-separated)
      CORS_ORIGINS: "https://soullab.life,https://www.soullab.life,https://loralee.soullab.life,https://chart.soullab.life"
      # Embedding mode: queue jobs for async processing by embed-worker
      MAIA_EMBEDDINGS_MODE: queue

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - maia-internal
      - maia-public

  # ═════════════════════════════════════════════════════════════════════════════
  # Embedding Worker - Async Queue Consumer
  # ═════════════════════════════════════════════════════════════════════════════
  # Processes embedding_jobs queue, generates vectors via Ollama
  # Same image as maia, different entrypoint
  #
  # Deploy: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build maia maia-embed-worker
  # Logs:   docker compose --env-file .env.production -f docker-compose.production.yml logs -f maia-embed-worker
  # ═══════════════════════════════════════════════════════════════════════════
  # Embedding Worker - LOCAL EMBEDDINGS VIA OLLAMA
  # ═══════════════════════════════════════════════════════════════════════════
  # DISABLED BY DEFAULT (Ollama removed for disk space - Jan 2026)
  # To enable: docker compose --profile embeddings -f docker-compose.production.yml up -d
  # Requires: Ollama running on host at port 11434
  maia-embed-worker:
    profiles: ["embeddings"]
    build: *maia_build
    image: *maia_image
    container_name: maia-embed-worker
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      postgres:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      MAIA_EMBEDDINGS_MODE: queue
      # DATABASE_URL comes from .env.production (set by setup script to use postgres:5432)
      # Ollama on host (EC2)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      # Tuning
      EMBEDDING_MAX_ATTEMPTS: "5"

    # Wait for Ollama before starting (prevents spam failures if Ollama is down)
    # Note: $$ escapes $ so the variable is evaluated at container runtime, not compose parse time
    command:
      - sh
      - -c
      - |
        until curl -sf $${OLLAMA_BASE_URL}/api/tags >/dev/null 2>&1; do
          echo "waiting for ollama at $${OLLAMA_BASE_URL}..."
          sleep 2
        done
        echo "ollama ready, starting worker..."
        npx tsx scripts/embedding_worker.ts

    # Healthcheck: verify DB + Ollama are reachable
    healthcheck:
      test: ["CMD-SHELL", "psql $${DATABASE_URL} -c 'SELECT 1' >/dev/null 2>&1 && curl -sf $${OLLAMA_BASE_URL}/api/tags >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Comms Analysis Worker - MAIA Message Intelligence
  # ═════════════════════════════════════════════════════════════════════════════
  # Processes comms_analysis_queue, runs MAIA analysis on client messages
  # Same image as maia, different entrypoint
  #
  # Deploy: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build maia maia-comms-worker
  # Logs:   docker compose --env-file .env.production -f docker-compose.production.yml logs -f maia-comms-worker
  maia-comms-worker:
    build: *maia_build
    image: *maia_image
    container_name: maia-comms-worker
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      # DATABASE_URL comes from .env.production

    command: ["npx", "tsx", "scripts/run-comms-analysis-worker.ts"]

    # Healthcheck: verify DB is reachable (worker has no HTTP endpoint)
    healthcheck:
      test: ["CMD-SHELL", "psql $${DATABASE_URL} -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Session Summary Worker - Background Remembrance Generation
  # ═════════════════════════════════════════════════════════════════════════════
  # Drains session_summary_queue, generates sovereign remembrances via Claude.
  # Sanctuary sessions are purged (turns deleted, no summary).
  # Continuity sessions get a lean remembrance written back to maia_sessions.
  #
  # Deploy: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build maia maia-summary-worker
  # Logs:   docker compose --env-file .env.production -f docker-compose.production.yml logs -f maia-summary-worker
  maia-summary-worker:
    build: *maia_build
    image: *maia_image
    container_name: maia-summary-worker
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      NODE_ENV: production

    command: ["npx", "tsx", "scripts/run-session-summary-worker.ts"]

    healthcheck:
      test: ["CMD-SHELL", "psql $${DATABASE_URL} -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Media Processing Worker - Sovereign Media Pipeline
  # ═════════════════════════════════════════════════════════════════════════════
  # Processes media_jobs queue: validate, inspect, thumbnail, waveform,
  # audio extraction, transcription (Whisper), classification, summarization.
  # Same image as maia, different entrypoint.
  #
  # Deploy: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build maia maia-media-worker
  # Logs:   docker compose --env-file .env.production -f docker-compose.production.yml logs -f maia-media-worker
  maia-media-worker:
    build: *maia_build
    image: *maia_image
    container_name: maia-media-worker
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      MEDIA_STORAGE_PATH: "/app/data/media"
      WHISPER_LOCAL_URL: "http://whisper:8000"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

    command: ["npx", "tsx", "scripts/run-media-worker.ts"]

    volumes:
      - media_data:/app/data/media

    healthcheck:
      test: ["CMD-SHELL", "psql $${DATABASE_URL} -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # PostgreSQL - Consciousness Data Persistence
  # ═════════════════════════════════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maia-postgres
    restart: unless-stopped
    # Tailscale-bound Postgres port for the Hetzner standby's streaming replication.
    # The bind IP comes from POSTGRES_BIND in .env.production (server-only); it defaults to
    # 127.0.0.1 so a missing value never exposes Postgres beyond localhost.
    # Set POSTGRES_BIND=100.119.226.84 (minisforum's Tailscale IP) on prod. (Reconciled 2026-06-14.)
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    logging: *default_logging

    env_file:
      - .env.production

    environment:
      POSTGRES_DB: maia_consciousness
      POSTGRES_USER: soullab

    # Performance tuning for pgvector workloads
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only extensions init - schema owned by Prisma + migrate service
      - ./database/init:/docker-entrypoint-initdb.d:ro

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soullab -d maia_consciousness"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Database Migrations - One-Off Service
  # ═════════════════════════════════════════════════════════════════════════════
  # Usage: docker compose -f docker-compose.production.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        # Deploy-lane tripwire — see x-maia-build above.
        DEPLOY_LANE_TOKEN: ${DEPLOY_LANE_TOKEN:-}

    env_file:
      - .env.production

    depends_on:
      postgres:
        condition: service_healthy

    command: ["sh", "/app/scripts/run-sql-migrations.sh"]

    volumes:
      - ./database/migrations:/app/database/migrations:ro
      - ./scripts/run-sql-migrations.sh:/app/scripts/run-sql-migrations.sh:ro

    profiles: ["migrate"]

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Whisper.cpp - Local Speech-to-Text
  # ═════════════════════════════════════════════════════════════════════════════
  # Sovereign voice transcription - no cloud APIs
  # Model: ggml-base.en (English, ~150MB)
  #
  # First run: docker compose -f docker-compose.production.yml run --rm whisper-init
  whisper-init:
    image: alpine:3.19
    container_name: maia-whisper-init
    volumes:
      - whisper_models:/models
    command: |
      sh -c '
        if [ -f /models/ggml-base.en.bin ]; then
          echo "Model already exists, skipping download"
        else
          echo "Downloading ggml-base.en model..."
          apk add --no-cache wget
          wget -O /models/ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          echo "Model downloaded successfully"
        fi
      '
    profiles: ["init"]
    networks:
      - maia-internal

  whisper:
    image: fedirz/faster-whisper-server@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    container_name: maia-whisper
    restart: unless-stopped
    logging: *default_logging

    environment:
      # Multilingual model (was base.en, English-only). Server auto-pulls
      # Systran/faster-whisper-base from HuggingFace; Whisper auto-detects language.
      # Hold escalation to 'small' until CPU/accuracy measured.
      WHISPER__MODEL: base
      WHISPER__INFERENCE_DEVICE: cpu

    volumes:
      # Persist the HuggingFace model cache so the multilingual CTranslate2 model
      # survives container recreate (otherwise re-downloaded from HF every rebuild).
      # See docs/specs/CONVERSATIONAL_MULTILINGUAL_UNLOCK_2026-06-14.md.
      - whisper-hf-cache:/root/.cache/huggingface

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Kokoro TTS — Local Text-to-Speech (sovereign, OpenAI-compatible API)
  # ═════════════════════════════════════════════════════════════════════════════
  # 82M-param model, CPU-only, real-time capable. MAIA's sovereign voice engine —
  # speaks without phoning home. Exposes OpenAI-compatible /v1/audio/speech on
  # :8880. Reached by maia at http://kokoro-tts:8880 (KOKORO_TTS_URL).
  # Internal-only: no published port, not proxied by Caddy.
  #
  # Voice identity (af_kore) is chosen by the router at request time, NOT here.
  # KOKORO_DEFAULT_VOICE + healthcheck use af_heart purely as a liveness probe.
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: maia-kokoro-tts
    restart: unless-stopped
    logging: *default_logging

    environment:
      KOKORO_DEFAULT_VOICE: "af_heart"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,json; d=json.dumps({'input':'ok','voice':'af_heart','model':'kokoro'}).encode(); urllib.request.urlopen(urllib.request.Request('http://localhost:8880/v1/audio/speech',data=d,headers={'Content-Type':'application/json'}),timeout=10)\" || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # RLM - Recursive Language Models Service
  # ═════════════════════════════════════════════════════════════════════════════
  # MIT OASYS paradigm: corpus-as-environment for scalable context handling.
  # Model navigates corpus via tool calls instead of context stuffing.
  #
  # Usage: docker compose -f docker-compose.production.yml up -d rlm
  rlm:
    build:
      context: ./services/rlm
      dockerfile: Dockerfile
    container_name: maia-rlm
    restart: unless-stopped
    logging: *default_logging

    env_file:
      - .env.production

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RLM_MODEL: ${RLM_MODEL:-claude-sonnet-4-20250514}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Mythic Atlas — Symbolic Classification Service (deterministic keyword stub)
  # ═════════════════════════════════════════════════════════════════════════════
  # Semantic-anchoring classifier the voice/oracle pipeline calls via
  # lib/services/mythicAtlasService.ts (getMythicAtlasContext): returns an
  # element/facet/archetype guess + confidence + deliberation flag, used to weight
  # memory recall. Runs scripts/mythic-atlas-stub.mjs — the DETERMINISTIC KEYWORD
  # STUB, not a learned model. It exists so the pipeline is reachable in prod
  # (stops the per-turn ECONNREFUSED noise); the client fails safe if it's down.
  #
  # Reached as http://mythic-atlas:8088 on maia-internal (wired via MYTHIC_ATLAS_URL
  # on the maia service). Port 8088 — NOT 8000 (whisper owns 8000).
  #
  # Deploy: docker compose -p maia-sovereign -f docker-compose.production.yml --env-file .env.production up -d mythic-atlas
  mythic-atlas:
    image: node:20-alpine
    container_name: maia-mythic-atlas
    restart: unless-stopped
    logging: *default_logging

    # No env_file: the stub needs no secrets, and .env.production sets PORT=3005,
    # which would otherwise hijack the listen port. Use a dedicated var instead.
    environment:
      MYTHIC_ATLAS_PORT: "8088"

    # Single-file stub, bind-mounted read-only — single source of truth in scripts/.
    volumes:
      - ./scripts/mythic-atlas-stub.mjs:/app/mythic-atlas-stub.mjs:ro

    command: ["node", "/app/mythic-atlas-stub.mjs"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Healthcheck hits GET /health — node-only (no curl), consistent with sovereign tooling.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8088/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Old Head Plaster - Astro SSR Site with Virtual Daragh
  # ═════════════════════════════════════════════════════════════════════════════
  # Decorative plaster website with AI chat assistant
  # Build: docker compose -f docker-compose.production.yml build oldhead
  # Deploy: docker compose -f docker-compose.production.yml up -d oldhead
  oldhead:
    build:
      context: ./services/oldhead
      dockerfile: Dockerfile
    image: oldhead-plaster:prod
    container_name: oldhead-plaster
    restart: unless-stopped
    logging: *default_logging

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4321"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - maia-public

  # ═════════════════════════════════════════════════════════════════════════════
  # Demo Plaster - White-Label Demo Site
  # ═════════════════════════════════════════════════════════════════════════════
  # Demo/model home version of Old Head Plaster for prospective clients
  # Uses same Dockerfile with different BRAND_PRESET
  # Deploy: docker compose -f docker-compose.production.yml up -d demo
  demo:
    build:
      context: ./services/oldhead
      dockerfile: Dockerfile
    image: demo-plaster:prod
    container_name: demo-plaster
    restart: unless-stopped
    logging: *default_logging

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4322"
      BRAND_PRESET: demo

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4322/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - maia-public

  # ═════════════════════════════════════════════════════════════════════════════
  # Palisades Master Handyman - Jeremy Larson's Business Site
  # ═════════════════════════════════════════════════════════════════════════════
  # Handyman business website with admin dashboard + invoicing.
  # Uses a pre-built image (source: separate repo /Users/soullab/PalisadesHandyman).
  # There is NO build context in this tree, so a profile-less `docker compose up -d`
  # would try to PULL palisades-handyman:prod from a registry and fail
  # ("pull access denied, repository does not exist"), aborting the entire deploy
  # under `set -e` (scripts/deploy-production.sh). Sibling sites oldhead/demo avoid
  # this only because they carry a build context (./services/oldhead).
  #
  # Gated behind the "palisades" profile so the canonical MAIA deploy
  # (deploy-production.sh → `docker compose up -d`, no profile) skips it entirely.
  # A profile-less `up -d` does NOT stop the already-running container (a profiled
  # service is not treated as an orphan). Build/load the image on the host first,
  # then deploy this site explicitly:
  #   docker compose -f docker-compose.production.yml --profile palisades up -d palisades
  palisades:
    profiles: ["palisades"]
    image: palisades-handyman:prod
    container_name: palisades-handyman
    restart: unless-stopped
    logging: *default_logging

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4321"
      BRAND_PRESET: palisades

    volumes:
      - palisades_data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - maia-public

  # ═════════════════════════════════════════════════════════════════════════════
  # Rude Boy Baking Co. — MOVED TO ISOLATED STACK
  # ═════════════════════════════════════════════════════════════════════════════
  # Rudeboy is a client build — it runs in its own isolated compose stack with
  # its own PostgreSQL instance, completely separate from the MAIA platform.
  #
  # Stack:   /Users/soullab/RudeBoyBaking/docker-compose.yml
  # Deploy:  docker compose -f /Users/soullab/RudeBoyBaking/docker-compose.yml up -d
  # Routing: maia-caddy reaches rudeboy-baking:4323 via rudeboy-caddy-bridge network
  # ═════════════════════════════════════════════════════════════════════════════

  # ═════════════════════════════════════════════════════════════════════════════
  # Ollama - Local LLM (Optional)
  # ═════════════════════════════════════════════════════════════════════════════
  # Uncomment to run Ollama in a container
  # For GPU support, add nvidia runtime configuration
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: maia-ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # For NVIDIA GPU:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]
  #   networks:
  #     - maia-network

  # ═════════════════════════════════════════════════════════════════════════════
  # maia-local-inference — Phase 1 Sovereign Inference Adapter
  # ═════════════════════════════════════════════════════════════════════════════
  # Thin FastAPI adapter: MAIA app → this service → Ollama.
  # Profile: sovereign — only starts when MAIA_INFERENCE_MODE is set.
  #
  # Enable: docker compose --profile sovereign -f docker-compose.production.yml up -d
  # Logs:   docker compose -f docker-compose.production.yml logs -f maia-local-inference
  #
  # Ollama may run on this host, the UM790, or any reachable machine.
  # Set OLLAMA_BASE_URL in .env.production accordingly:
  #   Same host:    http://host.docker.internal:11434
  #   UM790 on LAN: http://192.168.x.x:11434
  maia-local-inference:
    profiles: ["sovereign"]
    build:
      context: ./services/local-inference
      dockerfile: Dockerfile
    container_name: maia-local-inference
    restart: unless-stopped
    logging: *default_logging

    env_file:
      - .env.production

    environment:
      OLLAMA_BASE_URL:  ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      GENERATE_TIMEOUT_S: "30"
      PORT: "8080"   # Override .env.production PORT (Next.js default 3005) — server.py binds here

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - maia-internal

  # ═════════════════════════════════════════════════════════════════════════════
  # Nostr Relay — Sovereign member messaging backbone
  # ═════════════════════════════════════════════════════════════════════════════
  # Self-hosted strfry relay, member-gated via write policy plugin.
  # Accessible at wss://nostr.soullab.life (routed through Caddy).
  # Only registered Soullab members can publish events.
  maia-nostr-relay:
    build:
      context: .
      dockerfile: Dockerfile.strfry
    container_name: maia-nostr-relay
    restart: unless-stopped
    logging: *default_logging

    volumes:
      - nostr_relay_data:/app/strfry-db
      - ./config/strfry.conf:/app/strfry.conf:ro
      - ./scripts/nostr-write-policy.sh:/app/scripts/nostr-write-policy.sh:ro

    command: ["--config=/app/strfry.conf", "relay"]

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7777/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - maia-internal   # write policy calls maia-sovereign:3000
      - maia-public     # Caddy proxies wss://nostr.soullab.life → :7777

  # ═════════════════════════════════════════════════════════════════════════════
  # coturn — Session Room TURN/STUN (self-hosted)   [Phase A transport]
  # ═════════════════════════════════════════════════════════════════════════════
  # Sovereign NAT traversal for 1:1 P2P WebRTC Encounters. Decision (Kelly 2026-07-05): raw P2P +
  # self-hosted coturn — NO SFU in the 1:1 media path ("no unnecessary intermediary in the
  # Encounter field"). This service now owns the 3478 router-forward (was LiveKit's).
  # Constitutional basis: NATIVE_SESSION_ROOM_PHASE1_SPEC §6; refusal R-A5 (self-hosted-only ICE).
  # SECRET: --static-auth-secret comes from TURN_STATIC_AUTH_SECRET (.env.production), never a file.
  # Deploy notes: coturn is behind NAT — add `--external-ip=<PUBLIC_IP>/192.168.0.104` at deploy;
  # router-forward 3478 (TCP+UDP) AND the 49160-49200/udp relay range to 192.168.0.104.
  coturn:
    image: coturn/coturn:4.6   # TODO(deploy): pin to a @sha256 digest after the security-auditor pass
    container_name: maia-coturn
    restart: unless-stopped
    # Host networking: binds 3478 + 49160-49200/udp on the host directly. Docker-bridge
    # placement double-NATs relay traffic (peers surface as 172.x and trip the RFC1918
    # denied-peer rules — observed 2026-07-05). coturn's own docs recommend host mode.
    network_mode: host
    logging: *default_logging
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_STATIC_AUTH_SECRET}", "--external-ip=${TURN_EXTERNAL_IP}"]
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
    security_opt:
      - no-new-privileges:true
    # No `networks:` block — mutually exclusive with network_mode: host
    # (compose v5 rejects the pair at parse time and blocks ALL deploys).

  # ═════════════════════════════════════════════════════════════════════════════
  # LiveKit — media SFU (self-hosted)   [ARCHIVED 2026-07-05 · future group-room substrate]
  # ═════════════════════════════════════════════════════════════════════════════
  # ARCHIVED: superseded by coturn (raw P2P) for 1:1 Encounters — an SFU is architectural excess
  # for two parties (Decision, Kelly 2026-07-05). RETAINED, not deleted: this is the intended
  # substrate for FUTURE group rooms (N>2). Inert by default via `profiles` (starts only with
  # `--profile future-group-rooms`) and it no longer publishes 3478 — coturn owns that forward.
  # Original note (Decision #1, Kelly 2026-06-15): self-hosted SFU, media sovereign, TURN on 3478.
  # SECRETS via LIVEKIT_KEYS env (from .env.production), never in any file/log.
  livekit:
    image: livekit/livekit-server:v1.8@sha256:621fd87bd64a0c83e1f2418ee0323eb920d00acdd73e5f79b303c64f6cc532af   # pinned to the v1.8 manifest digest (immutable)
    container_name: maia-livekit
    profiles: ["future-group-rooms"]   # ARCHIVED: inert unless this profile is explicitly enabled
    restart: unless-stopped
    logging: *default_logging

    command: ["--config", "/etc/livekit.yaml"]

    # Non-secret config, read-only. Keys come from LIVEKIT_KEYS below, NOT from this file.
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro

    environment:
      # "<api_key>: <api_secret>" — provisioned in .env.production (server-only). Never logged.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    # Ports intentionally NOT published while ARCHIVED — coturn owns the 3478 forward now.
    # When group rooms (N>2) are built, restore a media-port strategy here (embedded TURN,
    # or reuse the coturn relay) and re-run the security-auditor pass before publishing.

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL   # the livekit-server Go binary needs no elevated caps (security review 2026-06-15)

    # No healthcheck declared: the livekit-server image's shell/tooling is unconfirmed — add a
    # verified healthcheck at deploy. Nothing depends_on livekit being healthy for v1.

    networks:
      - maia-internal   # maia app -> livekit:7880 (room-mgmt API; PR5 RemoveParticipant)
      - maia-public     # Caddy -> livekit:7880 (signaling WS only)

# ═══════════════════════════════════════════════════════════════════════════════
# Persistent Volumes
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  whisper_models:
    driver: local
  whisper-hf-cache:
    driver: local
  vault_data:
    driver: local
  voice_notes_data:
    driver: local
  media_data:
    driver: local
  palisades_data:
    driver: local
  nostr_relay_data:
    driver: local
  # ollama_data:
  #   driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# Network
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  maia-internal:
    driver: bridge   # DB + core services — no public exposure
  maia-public:
    driver: bridge   # Caddy + frontend containers
  marc-studio_default:
    external: true
  rudeboy-caddy-bridge:
    external: true   # Pre-create: docker network create rudeboy-caddy-bridge
    # Allows maia-caddy to route rudeboy.soullab.life → rudeboy-baking:4323
    # No MAIA internal services are on this network.
