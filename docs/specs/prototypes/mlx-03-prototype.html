<title>MLX-03 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap">
<style>
:root{
  --deep:#060D18; --canvas:#0A1628; --lift:#0F1D32; --surface:#121A2B;
  --hairline:#1B2A45; --edge:#2A3F63;
  --ink:#F5F7FB; --ink-2:#B7C0D1; --ink-3:#7F8AA3; 
  --gold:#B8860B; --gold-soft:#D4AF37; --practice:#5E7FA6;
  --serif:'Spectral',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--sans);font-weight:300;
     -webkit-font-smoothing:antialiased;line-height:1.55}
h1,h2{margin:0;font-weight:300;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--gold-soft);outline-offset:4px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.shell{display:grid;grid-template-columns:286px 1fr;min-height:100vh}
.rail{background:var(--deep);border-right:1px solid var(--hairline);padding:26px 22px 40px;
      position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.17em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--gold-soft)}
.rail-note{margin-top:9px;font-size:11.5px;color:var(--ink-3);line-height:1.65}
.jt{margin-top:28px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
    padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.steps{list-style:none;margin:10px 0 0;padding:0}
.steps button{display:flex;gap:11px;align-items:baseline;width:100%;padding:7px 9px;border-radius:7px;
              font-size:13px;color:var(--ink-2);transition:background .2s,color .2s}
.steps button:hover{background:var(--lift);color:var(--ink)}
.steps button[aria-current="true"]{background:var(--surface);color:var(--ink)}
.steps button[aria-current="true"] .n{color:var(--gold-soft)}
.n{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:14px}
.stage{padding:22px 30px 60px;display:flex;flex-direction:column;align-items:center;gap:15px}
.bar{width:100%;max-width:1060px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.crumb{font-size:11px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase}
.crumb b{color:var(--ink-2);font-weight:400}
.toggle{display:flex;border:1px solid var(--hairline);border-radius:999px;overflow:hidden}
.toggle button{padding:6px 15px;font-size:11.5px;color:var(--ink-3);letter-spacing:.05em}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.device{width:100%;max-width:1060px;border:1px solid var(--hairline);border-radius:14px;
        background:var(--canvas);overflow:hidden;position:relative;box-shadow:0 26px 74px -32px #000}
.device.phone{max-width:390px;border-radius:32px}
.viewport{position:relative;height:668px;overflow-y:auto;overflow-x:hidden;perspective:1400px}
.device.phone .viewport{height:724px}
canvas#field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:relative;min-height:100%;padding:56px 62px;display:none;flex-direction:column}
.device.phone .screen{padding:34px 24px}
.screen.on{display:flex}
/* motion: place has depth. inward opens deeper; outward returns to centre. */
.screen.in-deeper{animation:deeper .62s cubic-bezier(.22,.61,.36,1) both}
.screen.in-return{animation:ret .58s cubic-bezier(.22,.61,.36,1) both}
.screen.in-lateral{animation:lat .5s ease both}
@keyframes deeper{from{opacity:0;transform:scale(.965) translateZ(0)}to{opacity:1;transform:none}}
@keyframes ret{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
@keyframes lat{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
.voice{font-family:var(--serif);font-weight:200;line-height:1.28;letter-spacing:-.012em;color:var(--ink)}
.d1{font-size:46px}.d2{font-size:33px}.d3{font-size:22px}
.device.phone .d1{font-size:31px}.device.phone .d2{font-size:25px}
.lede{color:var(--ink-2);font-size:15px;max-width:58ch;font-weight:300}
.sub{color:var(--ink-3);font-size:12.5px;line-height:1.65}
.hr{height:1px;background:var(--hairline);border:0;margin:0}
.stack{display:flex;flex-direction:column;gap:30px}
.stack.tight{gap:20px}
.spacer{flex:1;min-height:18px}

/* doorways — possibilities arising around a question, not a survey */
.doorlist{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.device.phone .doorlist{grid-template-columns:1fr}
.door{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--ink-2);padding:11px 0;
      border-bottom:1px solid var(--hairline);transition:color .28s,padding-left .28s}
.door:hover{color:var(--ink);padding-left:7px}
.dunno{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--ink-3);
       padding:8px 0;transition:color .28s}
.dunno:hover{color:var(--gold-soft)}
.quiet .door{font-size:15px;color:var(--ink-3);border-bottom-color:transparent}
.quiet .door:hover{color:var(--ink-2)}

/* one dominant element per screen */
.primary{border:1px solid var(--edge);border-left:2px solid var(--gold);border-radius:12px;
         padding:20px 22px;background:linear-gradient(105deg,#12203ab3,#0d1a2e00);width:100%;
         transition:background .3s,border-color .3s}
.primary:hover{background:linear-gradient(105deg,#16274499,#0d1a2e00);border-color:#3a5079}
.primary.p{border-left-color:var(--practice)}
.signals{display:flex;gap:44px;flex-wrap:wrap}
.signal{min-width:180px}
.signal .v{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.signal .m{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* world — named spheres, places as language not tiles */
.world{display:flex;flex-direction:column;gap:17px}
.sph{display:flex;flex-direction:column;gap:5px}
.sph .nm{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.sph .nm b{color:var(--ink-2);font-weight:400}
.sph .line{font-family:var(--serif);font-size:16.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:0 3px}
.sph .line button{font-family:var(--serif);font-size:16.5px;color:var(--ink-2);transition:color .24s}
.sph .line button:hover{color:var(--gold-soft)}
.sph .line span{color:var(--ink-3);opacity:.55}
.sph.p .line button:hover{color:#9fc0e4}
.sph .ln{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-3);margin-top:1px}

/* maia */
.maia{display:flex;flex-direction:column;gap:22px;flex:1}
.utter{font-family:var(--serif);font-size:25px;font-weight:200;line-height:1.4;max-width:33ch;color:var(--ink)}
.device.phone .utter{font-size:20px}
.said{align-self:flex-end;max-width:31ch;color:var(--ink-3);font-size:14px;text-align:right;
      border-right:1px solid var(--hairline);padding-right:14px}
.composer{margin-top:auto;display:flex;align-items:center;gap:13px;border-top:1px solid var(--hairline);padding-top:16px}
.mic{width:36px;height:36px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;flex:none}
.mic i{width:8px;height:8px;border-radius:50%;background:var(--gold-soft);display:block;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:.95;transform:scale(1.12)}}
.cfield{flex:1;font-size:13.5px;color:var(--ink-3)}
.offer{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3)}

.spine{display:flex;flex-direction:column}
.sec{padding:11px 0;border-bottom:1px solid var(--hairline);display:flex;gap:18px;align-items:baseline}
.sec .ix{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:22px}
.sec .h{font-family:var(--serif);font-size:16px;color:var(--ink-2)}
.sec .q{font-size:12px;color:var(--ink-3)}
.cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{padding:11px 24px;border-radius:999px;background:var(--gold);color:#160e02;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--gold-soft)}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--ink)}
.home{font-size:12px;color:var(--ink-3);letter-spacing:.05em}
.home:hover{color:var(--gold-soft)}
.field-in{border:1px solid var(--edge);border-radius:9px;padding:12px 15px;background:#0b172899;
          font-size:14px;color:var(--ink-3);max-width:330px}
.entries{display:flex;flex-direction:column}
.entry{padding:15px 0;border-bottom:1px solid var(--hairline)}
.entry .m{font-size:10px;color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase}
.entry .x{font-family:var(--serif);font-size:16px;color:var(--ink-2);margin-top:6px;line-height:1.5;font-weight:300}
.mine{display:inline-block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);
      margin-top:8px;opacity:.8}
.note{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);line-height:1.65;max-width:52ch}
.util{font-size:11.5px;color:var(--ink-3)}
.util button{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.util button:hover{color:var(--ink-2)}

.anno{width:100%;max-width:1060px;border-left:2px solid var(--gold);background:#0b1626;
      padding:14px 18px;font-size:12.5px;color:var(--ink-2);line-height:1.7;border-radius:0 9px 9px 0}
.anno b{color:var(--ink);font-weight:500}
.anno code{font-family:var(--sans);font-size:11.5px;color:var(--gold-soft)}

/* ── ?bare=1 — test mode. The person meets Soullab cold: no rail, no
   annotations, no device controls. Screens and interactions unchanged;
   the viewport itself becomes the device, so responsiveness is real. ── */
body.bare .rail,body.bare .anno,body.bare .bar{display:none}
body.bare .shell{grid-template-columns:1fr}
body.bare .stage{padding:0;gap:0}
body.bare .device{max-width:none;border:0;border-radius:0;box-shadow:none}
body.bare .viewport{height:100vh;perspective:1600px}
@media(max-width:620px){
  body.bare .screen{padding:34px 24px}
  body.bare .doorlist{grid-template-columns:1fr}
  body.bare .d1{font-size:31px}
  body.bare .d2{font-size:25px}
  body.bare .utter{font-size:20px}
  body.bare .signals{gap:22px}
  body.bare .sph .line,body.bare .sph .line button{font-size:16px}
}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline)}}
</style>

<div class="shell">
<nav class="rail">
  <div class="brand">SOUL<em>LAB</em></div>
  <p class="rail-note">MLX-03A · founder design gate. Clickable prototype of the frozen architecture, isolated from production routing and data. Nothing here writes.</p>
  <div class="jt">Journey A — first arrival</div>
  <ul class="steps" id="jA"></ul>
  <div class="jt">Journey B — returning member</div>
  <ul class="steps" id="jB"></ul>
</nav>
<main class="stage">
  <div class="bar">
    <div class="crumb" id="crumb"></div>
    <div class="toggle"><button id="tD" aria-pressed="true">Desktop</button><button id="tP" aria-pressed="false">Mobile</button></div>
  </div>
  <div class="device" id="device"><div class="viewport" id="viewport">
    <canvas id="field"></canvas><div id="screens"></div>
  </div></div>
  <div class="anno" id="anno"></div>
</main>
</div>

<script>
/* depth: 0 = threshold/centre · 1 = a place · 2 = inside a place. drives transition direction. */
const S = {
landing:{j:'A',n:'Public landing',d:0,air:{lum:.34,cool:.30,drift:.55},crumb:'Surface A · <b>Public landing</b>',
anno:'The hero is one question and one proposition — <b>gravity before inventory</b>. The spine sits below it, in layers of increasing depth. Studio material has moved to <code>/about</code>.',
h:`<div class="stack">
 <div class="eyebrow">Soullab</div>
 <div><h1 class="voice d1">What is asking for your&nbsp;attention?</h1>
  <p class="lede" style="margin-top:22px">MAIA is a relational intelligence for understanding your life, relationships, choices, patterns and creative work.</p></div>
 <div class="cta"><button class="btn" data-go="join">Meet MAIA</button><button class="btn ghost" id="how">See how it works</button></div>
 <div class="spacer"></div>
 <div id="overview"><div class="eyebrow">The page, in order</div>
  <div class="spine" style="margin-top:10px">
  ${[['01','Invitation','What is asking for your attention?'],['02','Doorways','What can I bring?'],['03','Arrival','What happens when I enter?'],['04','Conversation','What does MAIA feel like?'],['05','The House','What exists beyond conversation?'],['05b','For your life','Living Field · Journal · Relationships'],['05c','For those who accompany others','Encounters · Preparation · Notes'],['06','Continuity','Kept · Recent · Continue'],['10','Elements','What is the deeper map?'],['12','Consent','Remembered with consent. Never by stealth.'],['14','After signup','Show me exactly where I am going.'],['15','Begin','Enter Soullab.']]
  .map(([i,h,q])=>`<div class="sec"><span class="ix">${i}</span><div><div class="h">${h}</div><div class="q">${q}</div></div></div>`).join('')}
  </div></div>
</div>`},

join:{j:'A',n:'Create your Soullab',d:0,air:{lum:.32,cool:.34,drift:.5},crumb:'Surface A → <b>Join</b>',
anno:'Signup was already clean and is left alone: email → code → name. <b>R1 removed everything after it.</b>',
h:`<div class="stack"><div class="eyebrow">Create your Soullab</div>
 <h2 class="voice d2">Your space is waiting.</h2>
 <div class="field-in">you@example.com</div>
 <div class="cta"><button class="btn" data-go="name">Continue</button></div>
 <p class="sub">We'll email a six-digit code. No password to invent.</p></div>`},

name:{j:'A',n:'Name',d:0,air:{lum:.32,cool:.34,drift:.5},crumb:'Surface A → <b>Name</b>',
anno:'The last thing asked before value. <b>Nothing else is collected</b> — birth data now lives in Soul Portrait / Astrology, with its consent model intact.',
h:`<div class="stack"><div class="eyebrow">One thing</div>
 <h2 class="voice d2">What should MAIA call you?</h2>
 <div class="field-in">Kelly</div>
 <div class="cta"><button class="btn" data-go="doorway">Enter Soullab</button></div></div>`},

doorway:{j:'A',n:'Doorway',d:0,air:{lum:.28,cool:.26,drift:.32},crumb:'Surface B · <b>Guided arrival</b>',
anno:'<b>This screen replaces three.</b> The question holds the centre and the possibilities arise around it — no cards, no survey. One tap and MAIA starts. Session-scoped (R3): no durable fact, never <code>member_spiral_state</code>. <b>“I don\'t know where to begin” is a door</b>, not a fallback.',
h:`<div class="stack">
 <div class="eyebrow">Welcome to Soullab</div>
 <div style="margin-top:26px"><h2 class="voice d2">What is asking for your&nbsp;attention?</h2>
  <p class="sub" style="margin-top:12px;max-width:42ch">You don't need to know what to ask, or how to use AI.</p></div>
 <div class="spacer"></div>
 <div class="doorlist">
  ${[['Something is on my mind','mind'],["I'm going through a change",'change'],['I want to understand myself','self'],['I need clarity about a decision','decision'],['Something in a relationship','relation'],["I'm making something",'making']].map(([t,k])=>`<button class="door" data-go="maiaOpen" data-door="${k}">${t}</button>`).join('')}
 </div>
 <button class="dunno" data-go="maiaOpen" data-door="dunno">I don't know where to begin</button>
</div>`},

maiaOpen:{j:'A',n:'MAIA opens',d:1,air:{lum:.30,cool:.42,drift:.22},crumb:'Surface D · <b>MAIA</b> — opened by the door',
anno:'The door sets <b>how MAIA opens, not what the member is dealing with</b>. Nothing characterizes them — they have said nothing yet. MAIA is a presence in the environment: no bot bubble, no avatar, no prompt chips.',
h:`<div class="maia">
 <div class="eyebrow">Something keeps repeating</div>
 <p class="utter">We can start with whatever keeps returning. It doesn't have to make sense yet — what have you been noticing?</p>
 <div class="said">The same argument with my brother, three times this month.</div>
 <p class="utter" style="font-size:21px">Three times. What's the moment it turns?</p>
 <div class="composer"><span class="mic"><i></i></span><span class="cfield">Speak, or type instead</span>
  <button class="home" data-go="houseNew">The House ⌂</button></div></div>`},

houseNew:{j:'A',n:'House — new member',d:0,air:{lum:.31,cool:.30,drift:.4},crumb:'Surface C · <b>MAIA House</b> — S1, nothing kept yet',
anno:'<b>Arrival, not a menu.</b> The greeting and the question hold the screen; the doorways arise beneath. A new member meets them first <i>because nothing sits above them</i> — not because the system judged they need help. <b>The whole eligible world is already perceptible beneath</b>, quietly: landing and House are two versions of the same world, so the ecosystem cannot appear to collapse to My Life after entry.',
h:`<div class="stack">
 <div class="eyebrow">Good afternoon, Kelly</div>
 <h2 class="voice d2">What is asking for your&nbsp;attention?</h2>
 <div class="doorlist" style="margin-top:6px">
  ${[['Talk it through','mind'],['Find my next step','next'],['Understand a pattern','pattern'],['Something in a relationship','relation'],['Make something','making'],['Know myself','self']].map(([t,k])=>`<button class="door" data-go="maiaOpen" data-door="${k}">${t}</button>`).join('')}
 </div>
 <button class="dunno" data-go="maiaOpen" data-door="dunno">I don't know where to begin</button>
 <div class="spacer"></div>
 <div class="world">
  <div class="eyebrow">Your Soullab</div>
  <div class="sph"><div class="nm"><b>My Life</b></div>
   <div class="line"><button data-go="livingField">Living Field</button><span>·</span><button data-go="relationships">Relationships</button><span>·</span><button>Journal</button><span>·</span><button>Anchor</button></div></div>
  <div class="sph"><div class="nm"><b>My Contribution</b></div>
   <div class="line"><button data-go="contribution">Ideas</button><span>·</span><button>Wisdom</button><span>·</span><button>Studios</button></div></div>
  <div class="sph p"><div class="nm"><b>My Practice</b></div>
   <div class="line"><button data-go="practice">People</button><span>·</span><button data-go="practice">Encounters</button><span>·</span><button data-go="practice">Preparation</button></div></div>
 </div>
</div>`},

livingField:{j:'A',n:'A place — Living Field',d:1,air:{lum:.26,cool:.36,drift:.18},crumb:'My Life → <b>Living Field</b>',
anno:'The empty state is a real place, not a broken panel. <b>Living Field\'s line survives Invariant 16 unchanged</b> — it names the place and the activity, never who the member is becoming. MAIA offers from the edge without taking the foreground.',
h:`<div class="stack">
 <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
  <div><div class="eyebrow">My Life</div><h2 class="voice d2" style="margin-top:9px">Living Field</h2></div>
  <button class="home" data-go="houseNew">⌂</button></div>
 <p class="sub" style="margin-top:-16px">A place to gather and reflect on lived experience.</p>
 <div class="spacer"></div>
 <p class="voice d3" style="color:var(--ink-3);max-width:34ch">Nothing gathered here yet. What you bring will stay in your words.</p>
 <div class="spacer"></div>
 <div class="offer">Something you said earlier this week may belong here.</div>
</div>`},

houseBack:{j:'B',n:'House — returning',d:0,air:{lum:.30,cool:.32,drift:.36},crumb:'Surface C · <b>MAIA House</b> — S5, the world leads',
anno:'<b>The density fix: richness without simultaneity.</b> Everything exists; nothing speaks at the same volume. One live thread is dominant, Kept and Recent are small signals, the world is named in language rather than tiled, and the doorways sit quiet at the bottom — still present, because expertise does not eliminate uncertainty (R4). Subtitles are gone: the scaffolding receded, the destinations did not move.',
h:`<div class="stack tight">
 <div class="eyebrow">Good morning, Kelly</div>
 <button class="primary" data-go="continueThread">
  <div class="eyebrow">Continue</div>
  <div class="voice" style="font-size:26px;margin-top:8px">The argument with your brother</div>
  <div class="sub" style="margin-top:6px">Tuesday · 24 exchanges</div></button>
 <div class="signals">
  <div class="signal"><div class="eyebrow">Kept</div>
   <div class="v">“The moment it turns is when he says my name.”</div>
   <div class="m">3 things you've chosen not to lose</div></div>
  <div class="signal"><div class="eyebrow">Recent</div>
   <div class="v" style="color:var(--ink-3)">Living Field · Relationships · Ideas</div></div>
 </div>
 <div class="spacer"></div>
 <div class="world">
  <div class="eyebrow">Your world</div>
  <div class="sph"><div class="nm"><b>My Life</b></div>
   <div class="line"><button data-go="livingField">Living Field</button><span>·</span><button>Journal</button><span>·</span><button data-go="relationships">Relationships</button><span>·</span><button>Anchor</button></div></div>
  <div class="sph"><div class="nm"><b>My Contribution</b></div>
   <div class="line"><button data-go="contribution">Ideas</button><span>·</span><button>Wisdom</button><span>·</span><button>Studios</button></div></div>
  <div class="sph p"><div class="nm"><b>My Practice</b></div>
   <div class="line"><button data-go="practice">People</button><span>·</span><button data-go="practice">Encounters</button><span>·</span><button data-go="practice">Preparation</button></div></div>
 </div>
 <div class="spacer"></div>
 <div class="quiet">
  <div class="eyebrow">Begin somewhere new</div>

/* Session-scoped door context (R3): frames MAIA's opening turn, dies with the
   session, persists nothing. Each door has its own opening; none characterizes
   the member, who has said nothing yet. */
const DOORS={
 'mind':      {e:'Something is on my mind',        o:"Start wherever it is. It doesn't have to be organized."},
 'change':    {e:"I'm going through a change",     o:"What's changing?"},
 'self':      {e:'I want to understand myself',    o:"What's the part you keep circling?"},
 'decision':  {e:'I need clarity about a decision',o:'What are you deciding between?'},
 'relation':  {e:'Something in a relationship',    o:"Who is it, and what's happening between you?"},
 'making':    {e:"I'm making something",           o:'What are you working on?'},
 'next':      {e:'Find my next step',              o:"What's the next thing you can't see past?"},
 'pattern':   {e:'Something keeps repeating',      o:"We can start with whatever keeps returning. It doesn't have to make sense yet — what have you been noticing?",
               reply:'The same argument with my brother, three times this month.', follow:"Three times. What's the moment it turns?"},
 'dunno':     {e:"I don't know where to begin",    o:"That's a fine place to start. What's been taking up room lately?"},
 'curious':   {e:"I'm just curious",               o:"Ask me anything you want. I'll tell you what I actually am."}
};
let door='pattern';
function renderMaia(){
 const d=DOORS[door]||DOORS.pattern;
 document.getElementById('s-maiaOpen').innerHTML=`<div class="maia">
  <div class="eyebrow">${d.e}</div>
  <p class="utter">${d.o}</p>
  ${d.reply?`<div class="said">${d.reply}</div><p class="utter" style="font-size:21px">${d.follow}</p>`:''}
  <div class="composer"><span class="mic"><i></i></span><span class="cfield">Speak, or type instead</span>
   <button class="home" data-go="${maiaHome}">The House &#8962;</button></div></div>`;
}
let maiaHome='houseNew';
if(new URLSearchParams(location.search).get('start')==='houseBack')maiaHome='houseBack';

const order=Object.keys(S), screens=document.getElementById('screens');
screens.innerHTML=order.map(k=>`<section class="screen" id="s-${k}">${S[k].h}</section>`).join('');
const mk=(id,j)=>{document.getElementById(id).innerHTML=order.filter(k=>S[k].j===j)
  .map((k,i)=>`<li><button data-go="${k}" id="b-${k}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${S[k].n}</span></button></li>`).join('');};
mk('jA','A'); mk('jB','B');

let cur=null;
function go(k){
  if(!S[k]||k===cur)return;
  const from=cur?S[cur].d:0, to=S[k].d;
  const dir = to>from ? 'in-deeper' : to<from ? 'in-return' : 'in-lateral';
  document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('on','in-deeper','in-return','in-lateral');});
  const el=document.getElementById('s-'+k);
  el.classList.add('on',dir);
  document.querySelectorAll('.steps button').forEach(b=>b.setAttribute('aria-current','false'));
  const b=document.getElementById('b-'+k); if(b)b.setAttribute('aria-current','true');
  document.getElementById('crumb').innerHTML=S[k].crumb;
  document.getElementById('anno').innerHTML=S[k].anno;
  document.getElementById('viewport').scrollTop=0;
  cur=k; air=S[k].air;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]'); if(!t)return;
  if(t.dataset.door){door=t.dataset.door; maiaHome = (cur==='houseBack'||cur==='relationships'||cur==='contribution'||cur==='practice')?'houseBack':'houseNew'; renderMaia();}
  go(t.dataset.go);
});
const dev=document.getElementById('device');
tD.onclick=()=>{dev.classList.remove('phone');tD.setAttribute('aria-pressed','true');tP.setAttribute('aria-pressed','false');size();};
tP.onclick=()=>{dev.classList.add('phone');tP.setAttribute('aria-pressed','true');tD.setAttribute('aria-pressed','false');size();};

/* ── atmosphere ──────────────────────────────────────────────────────
   NOT a colour taxonomy. Every place lives in one narrow navy family;
   what changes is luminance, temperature, drift speed and stillness —
   felt, not decoded. No place owns a hue.                            */
const cv=document.getElementById('field'), cx=cv.getContext('2d');
let W,H,t=0, air={lum:.32,cool:.32,drift:.5}, now={lum:.32,cool:.32,drift:.5};
function size(){const r=cv.getBoundingClientRect();W=cv.width=Math.max(1,r.width*devicePixelRatio);H=cv.height=Math.max(1,r.height*devicePixelRatio);}
addEventListener('resize',size);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const seeds=[[.20,.16,.66],[.80,.34,.54],[.48,.88,.60]];
function draw(){
  for(const k in air) now[k]+=(air[k]-now[k])*0.022;
  t+= reduce?0:0.0009*(0.4+now.drift);
  cx.clearRect(0,0,W,H);
  seeds.forEach((b,i)=>{
    const x=(b[0]+Math.sin(t*(0.8+i*0.27)+i)*0.055)*W;
    const y=(b[1]+Math.cos(t*(0.6+i*0.33)+i*2)*0.06)*H;
    const rad=b[2]*Math.max(W,H)*0.66;
    const g=cx.createRadialGradient(x,y,0,x,y,rad);
    // hue band 202–224: all navy. cool shifts within the band only.
    const hue=202+now.cool*22+i*3;
    const sat=16+(1-now.cool)*16;
    const light=(6.5+now.lum*7)*(1-i*0.10);
    g.addColorStop(0,`hsla(${hue},${sat}%,${light}%,${0.34+now.lum*0.30})`);
    g.addColorStop(1,'hsla(214,38%,5%,0)');
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
  });
  requestAnimationFrame(draw);
}
document.addEventListener('click',e=>{
  if(e.target.id!=='how')return;
  const ov=document.getElementById('overview'); if(!ov)return;
  ov.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
  ov.animate([{opacity:.35},{opacity:1}],{duration:700,easing:'ease-out'});
});
const params=new URLSearchParams(location.search);
if(params.get('bare')==='1'){
  document.body.classList.add('bare');
  document.getElementById('device').classList.remove('phone'); // viewport IS the device
}
size(); renderMaia();
const start=params.get('start');
go(S[start]?start:'landing');
draw();
</script>
