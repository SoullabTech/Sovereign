<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival D — Resolve · /signin first screen · Soullab exploration</title>
<!--
  TREATMENT D applied to the screen /signin ACTUALLY OPENS ON.

  UnifiedAuth.tsx:185 — phase = mode === 'signin' ? 'password' : 'email'
  (deliberate, commit 44b7a52, 2026-08-24: "/signin opens on username+password,
  /signup opens on email"). Every earlier treatment — A, B, C, D and the
  shipped reference — rendered the EMAIL phase, which on /signin is the second
  screen. This file is the first exploration of the first screen a returning
  member meets.

  Note also UnifiedAuth.tsx:539 vs :616 — the arrival remodel's typography
  (Spectral, "Welcome.", warmer subtitle) is applied ONLY in the email branch.
  The password branch gets the remodelled field, card and holoflower, but the
  original plain "Welcome". Reproduced faithfully below.

  TREATMENT D — founder ruling 2026-08-28.
  C-derived (near-stillness, quieter action, containment-first hierarchy)
  + restrained material light from A
  + desktop spatial integration (mark belongs to the encounter, not above it)
  + one non-load-bearing threshold resolve.
  No parallax. No drift. No delayed orientation.

  Carries the REAL action set from UnifiedAuth — Continue, biometric,
  username+password, or-divider, Google/Apple — because "restrained action"
  is only proven against the actions that actually exist.
-->
<style>
  :root{
    /* shipped values — tailwind.config.js:20-27, globals.css:41-43 */
    --navy-950:#060D18; --navy-900:#0A1628; --navy-850:#0F1D32;
    --navy-700:#1E3A5F; --navy-600:#2A4A73;
    --text:#F5F7FB; --text-2:#B7C0D1; --muted:#7F8AA3;
    --gold:#B8860B; --gold-soft:#D4AF37;

    /* MOTION GRAMMAR §5.1 — one switch, on the shared token. */
    --resolve:560ms;                 /* inside the 400-700ms allowance */
    --t-fast:200ms;
    --ease:cubic-bezier(.22,.61,.36,1);
    --blur-in:5px;                   /* the softness perception starts from */
    --soft-in:.84;                   /* and the contrast it starts at */
  }
  @media (prefers-reduced-motion: reduce){
    /* Start at the resolved state. Nothing essential is lost. */
    :root{ --resolve:1ms; --t-fast:1ms; --blur-in:0px; --soft-in:1 }
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(180deg,#071426 0%,#050F1F 52%,#030814 100%);
    display:flex;align-items:center;justify-content:center;
    padding:3rem 1.25rem;position:relative;overflow-x:hidden;
  }

  /* ── Material light, substantially reduced from A ──────────────────────
     Centred on the ENCOUNTER (~46% height), not up at the mark — so it
     gathers mark and form into one lit body against a darker surround.
     This is the desktop answer: relationship, not scale. Light confirms
     that there is depth here; it does not announce itself. */
  .ground{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(38% 42% at 50% 46%, rgba(124,94,170,.10), transparent 68%),
      radial-gradient(26% 30% at 50% 44%, rgba(184,134,11,.055), transparent 70%);
  }
  /* A vignette does the gathering work that scale cannot: the field falls
     away at the edges, so a 1728px viewport still reads as one place. */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(62% 58% at 50% 46%, transparent 42%, rgba(3,8,20,.55) 100%);
  }

  /* ── The one gesture: perception settling ─────────────────────────────
     Softness → clarity, then complete stillness. It means "attention
     becoming present". Nothing is revealed by it: every element is in the
     first painted frame at full position and full opacity of layout — only
     optical clarity changes, so with the animation off the surface is
     identical. (MOTION_GRAMMAR §3.2, §5.2) */
  .stage{
    position:relative;z-index:1;width:100%;max-width:24rem;
    filter:blur(var(--blur-in)); opacity:var(--soft-in);
    animation:resolve var(--resolve) var(--ease) 60ms forwards;
  }
  @keyframes resolve{ to{ filter:blur(0); opacity:1 } }

  /* ── The mark belongs to the encounter ────────────────────────────────
     Closer and lower than A/B/C: 72px, sitting directly on the heading with
     a shared optical baseline, inside the same column — not floating above
     a separate card. */
  .mark{width:72px;height:72px;margin:0 auto .9rem;display:block}
  .petal{fill:none;stroke:var(--gold);stroke-width:.65;opacity:.30;
         transition:opacity var(--t-fast) var(--ease)}
  .core{fill:var(--gold-soft);opacity:.45;
        transition:opacity var(--t-fast) var(--ease)}
  /* the place notices you — C's one retained micro-gesture */
  body:has(input:focus) .petal{opacity:.44}
  body:has(input:focus) .core{opacity:.66}

  h1{font-family:Spectral,Georgia,serif;font-weight:200;font-size:1.75rem;
     letter-spacing:.16em;text-align:center;color:rgba(255,255,255,.84);
     margin:0 0 .6rem}
  .sub{font-size:.875rem;font-weight:300;text-align:center;line-height:1.65;
       color:var(--text-2);margin:0 0 2rem}

  /* No card. C's containment-first hierarchy: the field is the surface, and
     the form is ruled rather than boxed — so nothing has to be lit to be
     legible. */
  label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
        color:var(--muted);margin:0 0 .55rem}
  input{
    width:100%;padding:.55rem 0 .75rem;font-size:1rem;color:var(--text);
    background:transparent;border:0;border-bottom:1px solid var(--navy-600);
    border-radius:0;outline:none;
    transition:border-color var(--t-fast) var(--ease);
  }
  input::placeholder{color:var(--muted)}
  input:focus{border-bottom-color:var(--gold)}

  /* Every action at the same restrained weight. The primary is distinguished
     by ORDER and by a single hairline of warmth — not by fill.
     (SOULLAB_THEME §1 containment; §3 accent is signal, spent once.) */
  .act{
    width:100%;margin-top:1rem;padding:.75rem 1rem;font-size:.9rem;
    letter-spacing:.03em;background:transparent;color:var(--text-2);
    border:1px solid rgba(30,58,95,.85);border-radius:8px;cursor:pointer;
    transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
  }
  .act:hover{border-color:var(--navy-600);color:var(--text)}
  .act.first{margin-top:1.6rem;color:var(--text);border-color:rgba(184,134,11,.42)}
  .act.first:hover{border-color:rgba(184,134,11,.72)}

  .div{margin-top:1.75rem;display:flex;align-items:center;gap:.75rem}
  .div i{flex:1;height:1px;background:rgba(30,58,95,.45)}
  .div span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .oauth{margin-top:1.1rem;display:flex;justify-content:center;gap:.75rem}
  .oauth button{width:42px;height:42px;border-radius:10px;background:transparent;
                border:1px solid rgba(30,58,95,.85);display:flex;align-items:center;
                justify-content:center;cursor:pointer;
                transition:border-color var(--t-fast) var(--ease)}
  .oauth button:hover{border-color:var(--navy-600)}

  .foot{margin-top:1.75rem;text-align:center;font-size:.78rem;color:var(--muted)}
  .foot a{color:var(--text-2);text-decoration:none;border-bottom:1px solid rgba(30,58,95,.9)}
  .foot a:hover{border-bottom-color:var(--navy-600)}

  .badge{position:fixed;left:1rem;bottom:1rem;z-index:2;font-size:.68rem;
         letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
         background:rgba(6,13,24,.7);border:1px solid #1E2F4D;border-radius:999px;
         padding:.4rem .75rem}
  .badge a{color:var(--text-2);text-decoration:none}

  @media (min-width:1440px){ .stage{max-width:25rem} }

  /* password-phase additions */
  h1.plain{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:200;
           font-size:1.6rem;letter-spacing:.2em}
  .pwwrap{position:relative}
  .pwwrap .reveal{position:absolute;right:0;bottom:.75rem;background:none;border:0;
                  color:var(--muted);font-size:.72rem;cursor:pointer;padding:0}
  .pwwrap .reveal:hover{color:var(--text-2)}
</style>
</head>
<body>
  <div class="ground"></div>
  <div class="vignette"></div>

  <main class="stage">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="petal" cx="50" cy="50" r="31"/>
      <g id="p"></g>
      <circle class="core" cx="50" cy="50" r="3"/>
    </svg>

    <!-- Faithful to the shipped password phase: plain "Welcome", no period,
         no Spectral — the remodel's typography does not reach this branch. -->
    <h1 class="plain">Welcome</h1>
    <p class="sub">Sign in with your username and password.</p>

    <label for="u">Username</label>
    <input id="u" type="text" placeholder="username" autocomplete="username">

    <label for="pw" style="margin-top:1.4rem">Password</label>
    <div class="pwwrap">
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="reveal" type="button" tabindex="-1">Show</button>
    </div>

    <button class="act first" type="button">Sign in</button>
    <button class="act" type="button">Sign in with Touch ID</button>
    <button class="act" type="button">Use a sign-in code instead</button>

    <div class="div"><i></i><span>or</span><i></i></div>
    <div class="oauth">
      <button title="Continue with Google"><svg width="19" height="19" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></button>
      <button title="Continue with Apple"><svg width="19" height="19" viewBox="0 0 24 24" fill="#E2E8F0">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg></button>
    </div>

    <p class="foot">Forgot your passkey? <a href="#">Recover it</a></p>
  </main>

  <div class="badge">Treatment D · /signin first screen — <a href="./index.html">exploration index</a></div>

<script>
  const g=document.getElementById('p');
  for(let i=0;i<12;i++){
    const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    e.setAttribute('cx','50');e.setAttribute('cy','33');
    e.setAttribute('rx','5.2');e.setAttribute('ry','15.5');
    e.setAttribute('class','petal');
    e.setAttribute('transform',`rotate(${i*30} 50 50)`);
    g.appendChild(e);
  }
  const s=document.querySelector('.stage');
  s.addEventListener('animationend',()=>{ s.style.animation='none'; s.style.filter='none'; s.style.opacity='1'; });
</script>
</body>
</html>
