<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Now What?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root,body[data-pal=navy]{--ink:#f4f2ec;--dim:#c3cadb;--faint:#8b97b0;--gold:#d3b264;
  --gold2:#b8963f;--bg1:#1b2547;--bg2:#141c38;--rule:rgba(244,242,236,.13);--soft:rgba(211,178,100,.09);}
body[data-pal=warm]{--ink:#e9e2d4;--dim:#b6ac9a;--faint:#857c6c;--gold:#c9a35e;
  --gold2:#a8823f;--bg1:#211d18;--bg2:#1b1815;--rule:rgba(233,226,212,.13);--soft:rgba(196,164,110,.08);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;color:var(--ink);font:400 16px/1.65 Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  background:radial-gradient(ellipse 90% 42% at 50% 0%,var(--soft,rgba(211,178,100,.09)),transparent 62%),
             linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;}
#pal{position:fixed;top:12px;left:12px;z-index:40;display:flex;gap:7px;}
#pal button{width:18px;height:18px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid rgba(255,255,255,.28);opacity:.5;transition:opacity .2s;}
#pal:hover button{opacity:1;}
#pal .n{background:linear-gradient(135deg,#1b2547 55%,#d3b264 55%);}
#pal .w{background:linear-gradient(135deg,#211d18 55%,#c9a35e 55%);}
#pal button[aria-pressed=true]{box-shadow:0 0 0 2px var(--gold);border-color:transparent;opacity:1;}
.flag{position:fixed;bottom:10px;right:12px;z-index:40;font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold2);opacity:.5;}
.screen{min-height:100dvh;display:none;flex-direction:column;}
.screen.on{display:flex;}

/* ── Landing ── */
#land{align-items:center;justify-content:center;text-align:center;padding:40px 26px;}
.mark{font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;font-weight:300;
  letter-spacing:.01em;}
.with{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-top:12px;}
.say{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:25px;
  line-height:1.5;color:var(--dim);margin:56px 0 0;max-width:16em;}
.begin{margin-top:56px;background:none;border:1px solid var(--gold2);border-radius:26px;
  color:var(--gold);font:inherit;font-size:14px;letter-spacing:.1em;padding:15px 34px;
  cursor:pointer;transition:background .2s,color .2s;}
.begin:hover{background:var(--gold);color:var(--bg2);}
.by{position:absolute;bottom:34px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--faint);opacity:.7;}

/* ── Conversation ── */
#talk{}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;
  border-bottom:1px solid var(--rule);}
.top .m{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;font-weight:300;}
.top button{background:none;border:0;color:var(--faint);font:inherit;font-size:12px;cursor:pointer;}
.top button:hover{color:var(--ink);}
.body{flex:1;overflow-y:auto;padding:0 22px;}
.inner{max-width:620px;margin:0 auto;padding:56px 0 20px;}
.hello{text-align:center;margin-bottom:44px;}
.n{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold2);color:var(--gold);
  display:flex;align-items:center;justify-content:center;margin:0 auto 26px;
  font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;}
.hello p{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:22px;
  color:var(--dim);margin:0;}
.hello p+p{font-size:27px;color:var(--ink);margin-top:8px;}
.msg{margin:0 0 22px;animation:in .3s ease both;}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.me{text-align:right;}
.me span{display:inline-block;background:var(--soft,rgba(211,178,100,.09));
  border:1px solid var(--rule);border-radius:15px 15px 3px 15px;padding:11px 16px;
  max-width:84%;text-align:left;font-size:15px;white-space:pre-wrap;}
.ai{color:var(--dim);font-size:15.5px;line-height:1.75;max-width:94%;white-space:pre-wrap;}
.dock{border-top:1px solid var(--rule);padding:14px 22px 22px;}
.field{max-width:620px;margin:0 auto;display:flex;align-items:flex-end;gap:12px;
  border:1px solid var(--rule);border-radius:24px;padding:11px 16px;background:rgba(255,255,255,.02);}
.field:focus-within{border-color:var(--gold2);}
#in{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;
  resize:none;outline:none;max-height:130px;line-height:1.5;}
#in::placeholder{color:var(--faint);}
.ic{background:none;border:0;color:var(--gold2);font-size:17px;cursor:pointer;padding:0 2px;}
.ic:hover{color:var(--gold);}
@media(min-width:640px){.mark{font-size:56px;}.say{font-size:28px;}.inner{padding-top:74px;}}
</style>
<div id="pal"><button class="n" data-p="navy" aria-pressed="true"></button>
<button class="w" data-p="warm" aria-pressed="false"></button></div>
<div class="flag">Not built · demo</div>

<section class="screen on" id="land">
  <div class="mark">Now What?</div>
  <div class="with">with Larry Closs</div>
  <p class="say">A place to talk through what&rsquo;s happening and what comes next.</p>
  <button class="begin" id="go">Start a conversation</button>
  <div class="by">Powered by MAIA</div>
</section>

<section class="screen" id="talk">
  <div class="top"><span class="m">Now What?</span>
    <button id="new">New conversation</button></div>
  <div class="body"><div class="inner">
    <div class="hello" id="hi">
      <div class="n">N</div>
      <p>Good to see you.</p>
      <p>What&rsquo;s going on?</p>
    </div>
    <div id="log"></div>
  </div></div>
  <div class="dock"><div class="field">
    <textarea id="in" rows="1" placeholder="Type what&rsquo;s on your mind…"></textarea>
    <button class="ic" title="Speak">&#127908;</button>
    <button class="ic" id="send" title="Send">&#8593;</button>
  </div></div>
</section>

<script>
(function(){
var b=document.body,land=document.getElementById('land'),talk=document.getElementById('talk'),
    log=document.getElementById('log'),inp=document.getElementById('in'),
    hi=document.getElementById('hi'),body=document.querySelector('.body');
[].forEach.call(document.querySelectorAll('#pal button'),function(x){
  x.onclick=function(e){e.stopPropagation();b.dataset.pal=x.dataset.p;
    [].forEach.call(document.querySelectorAll('#pal button'),function(y){
      y.setAttribute('aria-pressed',String(y===x));});};});
b.dataset.pal='navy';

document.getElementById('go').onclick=function(){
  land.classList.remove('on');talk.classList.add('on');setTimeout(function(){inp.focus();},60);};
document.getElementById('new').onclick=function(){
  log.innerHTML='';hi.style.display='';inp.value='';inp.focus();};

/* Invented demonstration content only. No coach's material is licensed
   for this use; this shows the shape a conversation takes, nothing more. */
function reply(t){
  t=t.toLowerCase();
  if(/team|colleague|staff|report/.test(t))
    return "Say more about the trouble. Is it that they're not doing what you need — or that something between you has gone quiet?\n\nYou've described this team before as the part of the work you were proudest of. What changed?";
  if(/exercise|assigned|gave me|worksheet|homework/.test(t))
    return "The one you started three weeks ago — you stopped after the second part. Do you want to pick it up where you left it, or talk about why you put it down?";
  if(/last week|told you|leaving|something changed|quit/.test(t))
    return "You said the decision felt like it was being made for you, and that you wanted to get in front of it.\n\nWhat changed?";
  if(/decision|choose|deciding/.test(t))
    return "Let's stay with it before trying to solve it. What are the possibilities you're actually choosing between?";
  if(/stuck|don't know|unsure|lost/.test(t))
    return "That's a fine place to start. What have you been noticing — in your attention, your energy, your work — that tells you something is off?";
  if(/tired|exhausted|burn/.test(t))
    return "How long has it been like this?";
  return "Tell me more. What feels most important about it right now?";
}
function add(c,txt){var d=document.createElement('div');d.className='msg '+c;
  if(c==='me'){var s=document.createElement('span');s.textContent=txt;d.appendChild(s);}
  else{d.textContent=txt;}
  log.appendChild(d);body.scrollTop=body.scrollHeight;}
function send(){var v=inp.value.trim();if(!v)return;
  hi.style.display='none';add('me',v);inp.value='';inp.style.height='auto';
  setTimeout(function(){add('ai',reply(v));},560);}
document.getElementById('send').onclick=send;
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',function(){inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,130)+'px';});
})();
</script>
