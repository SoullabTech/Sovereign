<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Now What? — One Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root,body[data-pal="navy"]{--ink:#f4f2ec;--dim:#c3cadb;--faint:#8b97b0;--gold:#d3b264;
  --gold2:#b8963f;--bg1:#1b2547;--bg2:#141c38;--rule:rgba(244,242,236,.14);--glow:rgba(211,178,100,.10);}
body[data-pal="warm"]{--ink:#e9e2d4;--dim:#b6ac9a;--faint:#857c6c;--gold:#c9a35e;
  --gold2:#a8823f;--bg1:#211d18;--bg2:#1b1815;--rule:rgba(233,226,212,.13);--glow:rgba(196,164,110,.08);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;min-height:100dvh;color:var(--ink);
  font:400 16px/1.6 Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  background:radial-gradient(ellipse 90% 40% at 50% 0%,var(--glow,rgba(211,178,100,.1)),transparent 62%),
             linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;
  display:flex;flex-direction:column;}
#pal{position:fixed;top:12px;left:12px;z-index:30;display:flex;gap:7px;}
#pal button{width:20px;height:20px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid rgba(255,255,255,.3);}
#pal .n{background:linear-gradient(135deg,#1b2547 55%,#d3b264 55%);}
#pal .w{background:linear-gradient(135deg,#211d18 55%,#c9a35e 55%);}
#pal button[aria-pressed=true]{box-shadow:0 0 0 2px var(--gold);border-color:transparent;}
.flag{position:fixed;top:12px;right:12px;z-index:30;font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold2);border:1px solid var(--gold2);border-radius:2px;
  padding:4px 9px;background:var(--bg2);}
header{text-align:center;padding:64px 22px 0;}
.brand{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:31px;
   margin:16px 0 0;line-height:1.25;}
.tag{color:var(--faint);font-size:13.5px;margin-top:9px;}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:0 22px;display:flex;
     flex-direction:column;justify-content:flex-end;}
#log{padding:38px 0 8px;}
.msg{margin:0 0 20px;animation:in .35s ease both;}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.me{text-align:right;}
.me span{display:inline-block;background:var(--glow,rgba(211,178,100,.1));border:1px solid var(--rule);
  border-radius:16px 16px 3px 16px;padding:11px 16px;max-width:84%;text-align:left;font-size:15px;}
.ai{color:var(--dim);font-size:15.5px;line-height:1.72;max-width:92%;}
.ai em{color:var(--ink);font-style:normal;}
.card{margin-top:14px;border:1px solid var(--rule);border-left:2px solid var(--gold2);
  border-radius:4px;padding:14px 16px;background:rgba(255,255,255,.025);}
.card .k{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
.card .t{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;margin-top:5px;color:var(--ink);}
.card .d{font-size:12.5px;color:var(--faint);margin-top:5px;}
.ask{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;text-align:center;
  margin:0 0 24px;color:var(--ink);font-weight:300;}
.bar{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--rule);
  padding:0 2px 12px;margin-bottom:14px;}
#in{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;
  resize:none;outline:none;max-height:120px;}
#in::placeholder{color:var(--faint);}
.mic{background:none;border:0;color:var(--gold2);font-size:19px;cursor:pointer;padding:0 2px;}
.starters{display:flex;flex-direction:column;gap:9px;padding-bottom:34px;}
.starters button{background:none;border:1px solid var(--rule);border-radius:20px;
  color:var(--dim);font:inherit;font-size:13.5px;padding:11px 17px;text-align:left;
  cursor:pointer;transition:border-color .18s,color .18s;}
.starters button:hover{border-color:var(--gold2);color:var(--ink);}
.starters.gone{display:none;}
footer{text-align:center;padding:26px 22px 34px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);opacity:.65;}
@media(min-width:640px){header{padding-top:84px;}h1{font-size:38px;}.ask{font-size:31px;}
  .starters{flex-direction:row;flex-wrap:wrap;justify-content:center;}}
</style>
<div id="pal"><button class="n" data-p="navy" aria-pressed="true"></button>
<button class="w" data-p="warm" aria-pressed="false"></button></div>
<div class="flag">Not built · demo</div>

<header>
  <div class="brand">Now What? &middot; with your coach</div>
  <h1>Your space to think things through.</h1>
  <p class="tag">Whatever&rsquo;s going on. Start anywhere.</p>
</header>

<main>
  <div id="log"></div>
  <p class="ask" id="ask">What&rsquo;s going on?</p>
  <div class="bar">
    <textarea id="in" rows="1" placeholder="Type or talk…"></textarea>
    <button class="mic" title="Speak">&#127908;</button>
  </div>
  <div class="starters" id="st">
    <button data-s="team">I need to think something through</button>
    <button data-s="exercise">I&rsquo;m stuck on something</button>
    <button data-s="memory">I want to continue my coaching work</button>
  </div>
</main>
<footer>Private by default &middot; Nothing is shared unless you choose</footer>

<script>
(function(){
var b=document.body,log=document.getElementById('log'),inp=document.getElementById('in'),
    st=document.getElementById('st'),ask=document.getElementById('ask');
[].forEach.call(document.querySelectorAll('#pal button'),function(x){
  x.onclick=function(){b.dataset.pal=x.dataset.p;
    [].forEach.call(document.querySelectorAll('#pal button'),function(y){
      y.setAttribute('aria-pressed',String(y===x));});};});
b.dataset.pal='navy';

/* Scripted for demonstration. Placeholder content only — no coach's material. */
var S={
 team:{u:"I'm having trouble with my team.",
   a:"Say more about the trouble. Is it that they're not doing what you need — or that something between you has gone quiet?<br><br>You've described this team before as the part of the business you were proudest of. <em>What changed?</em>"},
 exercise:{u:"What was that exercise you gave me?",
   a:"This one — you started it three weeks ago and stopped after the second column.",
   card:{k:"From your work together",t:"[ Placeholder exercise ]",d:"Assigned 12 Aug · you completed 2 of 4 parts"}},
 memory:{u:"Last week I told you I was considering leaving. I think something changed.",
   a:"You said the decision felt like it was being made for you, and that you wanted to get in front of it.<br><br><em>What changed?</em>"}
};
function add(cls,html){var d=document.createElement('div');d.className='msg '+cls;
  d.innerHTML=cls==='me'?'<span>'+html+'</span>':html;log.appendChild(d);
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function turn(u,a,card){
  st.classList.add('gone'); ask.style.display='none';
  add('me',u);
  setTimeout(function(){
    var h=a; if(card) h+='<div class="card"><div class="k">'+card.k+'</div>'+
      '<div class="t">'+card.t+'</div><div class="d">'+card.d+'</div></div>';
    add('ai',h);},620);
}
[].forEach.call(st.querySelectorAll('button'),function(x){
  x.onclick=function(){var s=S[x.dataset.s];turn(s.u,s.a,s.card);};});
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();
    var v=inp.value.trim(); if(!v)return; inp.value='';
    var t=v.toLowerCase(),k=null;
    if(/team|colleague|staff/.test(t))k='team';
    else if(/exercise|assign|gave me|worksheet/.test(t))k='exercise';
    else if(/last week|told you|leaving|changed|remember/.test(t))k='memory';
    if(k)turn(v,S[k].a,S[k].card);
    else turn(v,"Stay with that for a moment. <em>What part of it is most alive right now?</em>");
  }});
inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';});
})();
</script>
