<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writer Canvas — Room Map (design walkthrough)</title>
<style>
  :root{
    --navy-deep:#0a1220; --navy:#101c30; --navy-soft:#16253d; --navy-line:#22344f;
    --paper:#e9e2d4; --paper-dim:#b9b2a4; --paper-faint:#7d7f88;
    --amber:#d9a441; --amber-soft:#e8c07a; --amber-dim:rgba(217,164,65,.14);
    --green:#7fae8b; --offer:#3a4d6b;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy-deep);color:var(--paper);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- builder chrome (design tool, not member UI) ---------- */
  .chrome{background:#060b14;border-bottom:1px solid var(--navy-line);padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
  .chrome .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-faint);border:1px solid var(--navy-line);border-radius:3px;padding:3px 7px}
  .chrome .personas{display:flex;gap:6px;flex-wrap:wrap}
  .chrome button{background:transparent;border:1px solid var(--navy-line);color:var(--paper-dim);font-size:12px;padding:5px 11px;border-radius:14px;cursor:pointer;font-family:var(--sans)}
  .chrome button:hover{border-color:var(--amber);color:var(--paper)}
  .chrome button.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber-soft)}
  .chrome .notes-toggle{margin-left:auto}
  .chrome .notes-toggle.on{border-color:var(--green);color:var(--green)}

  .persona-line{background:#0b1526;border-bottom:1px solid var(--navy-line);padding:6px 16px;font-size:12px;color:var(--paper-dim);flex-shrink:0}
  .persona-line b{color:var(--amber-soft);font-weight:600}

  /* ---------- the room ---------- */
  .room{flex:1;display:flex;min-height:0}

  /* Study Wall (left) */
  .study{width:52px;background:var(--navy);border-right:1px solid var(--navy-line);display:flex;flex-direction:column;transition:width .25s ease;flex-shrink:0;position:relative}
  .study.open{width:280px}
  .study .spine{display:flex;flex-direction:column;gap:2px;padding-top:14px}
  .drawer-tab{background:none;border:none;color:var(--paper-faint);font-size:11px;letter-spacing:.06em;padding:10px 6px;cursor:pointer;writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--sans);border-left:2px solid transparent}
  .study.open .drawer-tab{writing-mode:horizontal-tb;text-align:left;padding:9px 16px;font-size:12px}
  .drawer-tab:hover{color:var(--paper)}
  .drawer-tab.current{color:var(--amber-soft);border-left-color:var(--amber)}
  .drawer-body{display:none;padding:10px 16px 16px;overflow-y:auto;font-size:12.5px;color:var(--paper-dim);line-height:1.55}
  .study.open .drawer-body.current{display:block}
  .drawer-body h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-faint);margin:14px 0 6px}
  .drawer-body .item{padding:7px 9px;border:1px solid var(--navy-line);border-radius:5px;margin-bottom:6px;background:var(--navy-soft)}
  .drawer-body .item small{display:block;color:var(--paper-faint);font-size:10.5px;margin-top:2px}
  .pinbar{margin-top:auto;padding:10px;display:none}
  .study.open .pinbar{display:block}
  .pinbar button{width:100%;background:none;border:1px dashed var(--navy-line);color:var(--paper-faint);font-size:11px;padding:6px;border-radius:5px;cursor:pointer}
  .pinbar button.pinned{border-style:solid;border-color:var(--amber);color:var(--amber-soft)}

  /* Structure rail (pinned state, A2) */
  .rail{width:0;overflow:hidden;background:var(--navy);border-right:1px solid var(--navy-line);transition:width .25s ease;flex-shrink:0}
  .rail.show{width:184px}
  .rail-inner{padding:16px 12px;font-size:12px}
  .rail-inner h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:10px}
  .rail-inner .ch{padding:6px 8px;border-radius:4px;color:var(--paper-dim);cursor:pointer;line-height:1.35}
  .rail-inner .ch:hover{background:var(--navy-soft)}
  .rail-inner .ch.here{background:var(--amber-dim);color:var(--amber-soft)}

  /* Worktable (center) */
  .worktable{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .work-head{padding:20px 44px 10px;flex-shrink:0}
  .work-head .becoming{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:4px}
  .work-head h1{font-family:var(--serif);font-size:23px;font-weight:500;color:var(--paper)}
  .work-head .orient{font-size:12px;color:var(--amber-soft);margin-top:5px;font-style:italic}
  .expr-switch{display:inline-flex;gap:6px;margin-top:8px}
  .expr-switch span{font-size:11px;padding:3px 10px;border:1px solid var(--navy-line);border-radius:12px;color:var(--paper-dim);cursor:pointer}
  .expr-switch span.on{border-color:var(--amber);color:var(--amber-soft);background:var(--amber-dim)}
  .field{flex:1;overflow-y:auto;padding:16px 44px 60px}

  /* writing surface */
  .prose{font-family:var(--serif);font-size:16.5px;line-height:1.75;max-width:640px;color:var(--paper)}
  .prose p{margin-bottom:1.1em}
  .prose .cursor{display:inline-block;width:1px;height:1.05em;background:var(--amber);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .cite{font-size:.75em;color:var(--amber-soft);background:var(--amber-dim);border-radius:3px;padding:0 4px;cursor:pointer}

  /* development surface */
  .frags{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:820px}
  .frag{background:var(--navy-soft);border:1px solid var(--navy-line);border-radius:7px;padding:13px 14px;font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--paper-dim)}
  .frag.seed{border-color:var(--amber);color:var(--paper);background:linear-gradient(180deg,var(--amber-dim),var(--navy-soft))}
  .frag small{display:block;font-family:var(--sans);font-size:10px;color:var(--paper-faint);margin-top:8px;letter-spacing:.05em}
  .thread-label{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-faint);margin-top:8px}

  /* renewal surface */
  .renewal{display:flex;gap:22px;max-width:900px}
  .renewal .pane{flex:1;border:1px solid var(--navy-line);border-radius:8px;padding:18px;font-family:var(--serif);font-size:14px;line-height:1.65}
  .renewal .original{background:#0d1626;color:var(--paper-faint)}
  .renewal .original .lock{font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:10px}
  .renewal .living{background:var(--navy-soft);color:var(--paper)}

  /* offering (A4) */
  .offering{max-width:640px;border:1px dashed var(--amber);border-radius:7px;background:var(--amber-dim);padding:14px 16px;margin:14px 0;font-family:var(--serif);font-size:15px;line-height:1.65}
  .offering .who{font-family:var(--sans);font-size:11px;color:var(--amber-soft);letter-spacing:.05em;margin-bottom:7px}
  .offering .acts{margin-top:10px;display:flex;gap:8px}
  .offering .acts button{font-size:11.5px;padding:4px 13px;border-radius:12px;cursor:pointer;font-family:var(--sans)}
  .adopt{background:var(--amber);border:1px solid var(--amber);color:#1a1408}
  .decline{background:none;border:1px solid var(--navy-line);color:var(--paper-dim)}
  .comment-offer{border-color:var(--navy-line);background:var(--navy-soft)}
  .comment-offer .who{color:var(--paper-dim)}
  .comment-note{font-size:10.5px;color:var(--paper-faint);font-family:var(--sans);margin-top:8px}

  .presence{position:absolute;top:20px;right:24px;display:flex;gap:6px}
  .presence .p{width:26px;height:26px;border-radius:50%;background:var(--navy-soft);border:1px solid var(--navy-line);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--paper-dim)}
  .presence .p.you{border-color:var(--amber);color:var(--amber-soft)}

  /* Window (right, MAIA) */
  .window{width:38px;background:var(--navy);border-left:1px solid var(--navy-line);display:flex;flex-direction:column;align-items:center;transition:width .25s ease;flex-shrink:0;cursor:pointer}
  .window .glyph{margin-top:18px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--paper-faint);transition:.2s}
  .window:hover .glyph{border-color:var(--amber)}
  .window.open{width:300px;cursor:default;align-items:stretch}
  .window .panel{display:none;flex-direction:column;padding:18px;font-size:12.5px;line-height:1.6;color:var(--paper-dim);overflow-y:auto}
  .window.open .panel{display:flex}
  .window.open .glyph{display:none}
  .panel h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:12px}
  .panel .you-said{background:var(--navy-soft);border-radius:7px;padding:10px 12px;margin-bottom:10px;color:var(--paper);font-style:italic}
  .panel .maia-says{border-left:2px solid var(--amber);padding:2px 0 2px 12px;margin-bottom:14px}
  .panel .vow{margin-top:auto;padding-top:14px;border-top:1px solid var(--navy-line);font-size:10.5px;color:var(--paper-faint);line-height:1.5}
  .panel .close{align-self:flex-end;background:none;border:none;color:var(--paper-faint);cursor:pointer;font-size:14px}
  .panel .invite{background:none;border:1px solid var(--navy-line);border-radius:14px;color:var(--paper-dim);font-size:12px;padding:6px 12px;cursor:pointer;margin-bottom:12px}
  .panel .invite:hover{border-color:var(--amber);color:var(--amber-soft)}

  /* design-notes overlay */
  .note{position:absolute;z-index:40;background:#0d2417;border:1px solid var(--green);color:var(--green);font-size:10.5px;letter-spacing:.04em;padding:4px 9px;border-radius:4px;display:none;pointer-events:none}
  body.notes .note{display:block}
  .note b{font-weight:700}
</style>
</head>
<body>

<div class="chrome">
  <span class="tag">Design walkthrough · builder chrome — not member UI</span>
  <div class="personas" id="personaBtns"></div>
  <button class="notes-toggle" id="notesBtn">design notes</button>
</div>
<div class="persona-line" id="personaLine"></div>

<div class="room">
  <div class="note" style="top:120px;left:60px"><b>STUDY WALL</b> — folded spine · drawers · pinnable (A2)</div>
  <div class="note" style="top:120px;left:44%"><b>WORKTABLE</b> — the work, mid-motion, one instrument in hand</div>
  <div class="note" style="top:120px;right:46px"><b>WINDOW</b> — MAIA · invited, never ambient</div>

  <aside class="study" id="study">
    <div class="spine" id="spine"></div>
    <div class="drawer-body" data-d="work" id="dWork"></div>
    <div class="drawer-body" data-d="materials" id="dMaterials"></div>
    <div class="drawer-body" data-d="structure" id="dStructure"></div>
    <div class="drawer-body" data-d="history" id="dHistory"></div>
    <div class="pinbar" id="pinbar"></div>
  </aside>

  <aside class="rail" id="rail"><div class="rail-inner" id="railInner"></div></aside>

  <main class="worktable">
    <div class="presence" id="presence"></div>
    <div class="work-head">
      <div class="becoming" id="becoming"></div>
      <h1 id="title"></h1>
      <div class="orient" id="orient"></div>
      <div class="expr-switch" id="exprs"></div>
    </div>
    <div class="field" id="field"></div>
  </main>

  <aside class="window" id="window" title="Invite reflection">
    <div class="glyph"></div>
    <div class="panel" id="panel"></div>
  </aside>
</div>

<script>
const PERSONAS = {
  arrival:{
    label:"Arrival — a new idea",
    line:"<b>Entry:</b> a new idea, typed at the doorway. The room opens with the idea already on the table. Both wings folded. Nothing else.",
    becoming:"AN IDEA, BECOMING AN ESSAY", title:"What the River Taught Me",
    orient:"gathering", exprs:null, drawers:["work","materials","history"], pinned:false,
    presence:null,
    field:`<div class="frags">
      <div class="frag seed">Rivers don't resist obstacles — they read them. The whole essay might be about reading instead of forcing.<small>CAPTURED AT THE DOORWAY · TODAY</small></div>
      <div class="frag">The eddy behind the boulder is still part of the river.<small>FRAGMENT</small></div>
      <div class="frag" style="border-style:dashed;color:var(--paper-faint)">+ a thought…</div>
    </div>`,
    dWork:`<h4>Becoming</h4><div class="item">An idea, becoming an essay<small>your words — change them anytime</small></div>`,
    dMaterials:`<h4>Materials</h4><div class="item" style="border-style:dashed;color:var(--paper-faint)">Nothing feeds this yet. Bring something in when the work asks for it.</div>`,
    dHistory:`<h4>History</h4><div class="item" style="border-style:dashed;color:var(--paper-faint)">This work is new. Its history starts with today.</div>`,
    window:"closed"
  },
  novelist:{
    label:"Novelist",
    line:"<b>Novelist — “I have a manuscript.”</b> Continuing, not renewing (A1). Writing surface at ch. 3; Structure pinned as a rail (A2); versions kept before cuts.",
    becoming:"BECOMING A NOVEL", title:"The Orchard Winter",
    orient:"drafting — chapter three", exprs:null, drawers:["work","materials","structure","history"], pinned:true,
    presence:null,
    rail:["1 · The Late Frost","2 · What Maren Kept","3 · The Orchard Winter","4 · Salt and Smoke","5 · The Auction","… 14 chapters"], railHere:2,
    field:`<div class="prose">
      <p>Maren counted the jars twice, the way her mother had, though counting changed nothing about what the winter would ask of them.</p>
      <p>Outside, the orchard stood in its black rows, patient as a debt.<span class="cursor"></span></p>
    </div>`,
    dWork:`<h4>Becoming</h4><div class="item">A novel<small>declared by you · March</small></div>`,
    dMaterials:`<h4>Materials</h4><div class="item">Orchard research notes<small>brought to the table twice</small></div><div class="item">Grandmother's letters (scans)<small>imported</small></div>`,
    dStructure:`<h4>Manuscript</h4><div class="item">14 chapters · carried in with your import<small>pin this drawer to keep it beside the field</small></div>`,
    dHistory:`<h4>Versions</h4><div class="item">Kept before cutting ch. 7<small>your gesture · last week</small></div><div class="item">Original import preserved<small>never overwritten</small></div>`,
    window:"closed"
  },
  scholar:{
    label:"Scholar",
    line:"<b>Scholar — “I have a dissertation.”</b> Cite gesture at the writing surface (A5); advisor comments are offerings that can never touch the text (A4).",
    becoming:"BECOMING A DISSERTATION", title:"Attention and Institutional Trust",
    orient:"drafting — chapter two", exprs:null, drawers:["work","materials","structure","history"], pinned:true,
    presence:[{i:"DR",you:false},{i:"you",you:true}],
    rail:["Introduction","1 · Literature Review","2 · Method","3 · Findings","4 · Discussion","Bibliography — generated"], railHere:2,
    field:`<div class="prose">
      <p>Institutional trust does not erode uniformly; it thins first where attention is most contested <span class="cite">(Marsh 2021)</span>, a pattern the survey data reproduces at every scale examined <span class="cite">(Ito &amp; Bell 2019)</span>.<span class="cursor"></span></p>
    </div>
    <div class="offering comment-offer"><div class="who">DR. HALVORSEN · ADVISOR · COMMENT</div>
      “Reproduces at every scale” is a strong claim — does Table 4 actually support the smallest cohort?
      <div class="comment-note">An advisor's comment is never adoptable into the text. It stays a comment, attributed, in History.</div>
    </div>`,
    dWork:`<h4>Becoming</h4><div class="item">A dissertation<small>declared by you</small></div>`,
    dMaterials:`<h4>Sources · 120</h4><div class="item">Marsh (2021) — Trust in Thin Places<small>citable · used 4×</small></div><div class="item">Ito &amp; Bell (2019)<small>citable · used 2×</small></div><div class="item">Interview transcripts<small>your material</small></div>`,
    dStructure:`<h4>Chapters</h4><div class="item">6 parts · your proposal structure<small>bibliography is generated from citations used — not managed</small></div>`,
    dHistory:`<h4>Revision cycles</h4><div class="item">Ch. 2 — round 3 after advisor feedback<small>each round kept</small></div>`,
    window:"closed"
  },
  blogger:{
    label:"Blogger / Creator",
    line:"<b>Blogger — “I have an idea for a series.”</b> One work, sibling expressions (A3). The room is nearly bare — and that bareness is correct.",
    becoming:"BECOMING AN EIGHT-PART SERIES", title:"Slow Tools",
    orient:"shaping — post one", exprs:["Post 1 · on the table","Post 2 · fragment","Series page"], drawers:["work","materials","history"], pinned:false,
    presence:null,
    field:`<div class="frags">
      <div class="frag seed">Post 1: Why the best tools make you slower first.<small>SHAPING</small></div>
      <div class="frag">A hammer never asks for your attention. Software always does.<small>FRAGMENT</small></div>
      <div class="frag">Post 2 seed — the apprenticeship curve.<small>FRAGMENT</small></div>
    </div>`,
    dWork:`<h4>Becoming</h4><div class="item">An eight-part series<small>a series is one work — the posts are its expressions</small></div>`,
    dMaterials:`<h4>Materials</h4><div class="item">Screenshot folder — tool interfaces<small>imported</small></div>`,
    dHistory:`<h4>History</h4><div class="item">Post 1 — first shape kept<small>yesterday</small></div>`,
    window:"closed"
  },
  collaborator:{
    label:"Collaborator",
    line:"<b>Collaborator — “We are creating this together.”</b> Contributions arrive as <b>offerings</b>; only the author <b>adopts</b> (A4). Presence at the edge, no management panel.",
    becoming:"BECOMING A FIELD GUIDE · WITH JUNE", title:"The Field Guide",
    orient:"drafting — together", exprs:null, drawers:["work","materials","history"], pinned:false,
    presence:[{i:"J",you:false},{i:"you",you:true}],
    field:`<div class="prose">
      <p>Begin at the tide line, where the two worlds trade their belongings twice a day.</p>
    </div>
    <div class="offering"><div class="who">JUNE · CO-AUTHOR · OFFERS A PARAGRAPH</div>
      What the sea leaves is not debris but correspondence — letters the land will spend all day answering.
      <div class="acts"><button class="adopt">Adopt into the work</button><button class="decline">Decline</button></div>
      <div class="comment-note">Adoption is your gesture alone. Who offered, who adopted, and when — recorded in History.</div>
    </div>
    <div class="prose"><p>By noon the gulls have read everything first.<span class="cursor"></span></p></div>`,
    dWork:`<h4>Becoming</h4><div class="item">A field guide<small>co-authored — every hand attributed</small></div>`,
    dMaterials:`<h4>Materials</h4><div class="item">Shore photographs — June<small>attributed</small></div><div class="item">Tide tables<small>yours</small></div>`,
    dHistory:`<h4>Contribution history</h4><div class="item">June offered ¶ · you adopted<small>Tuesday</small></div><div class="item">You offered title change · June adopted<small>Monday</small></div>`,
    window:"closed"
  },
  elder:{
    label:"Elder / Teacher",
    line:"<b>Elder — “I have decades of notes and teachings.”</b> Gathering is a first-class arrival (A6). Discovery help only through the Window, invited. Originals preserved; renewal beside them.",
    becoming:"A BODY OF TEACHING, GATHERING", title:"Forty Years of Teaching",
    orient:"gathering — your threads forming", exprs:["The gathering · on the table","A book — declared","A course — declared"], drawers:["work","materials","history"], pinned:false,
    presence:null,
    field:`<div class="frags">
      <div class="thread-label">Your thread — “on beginning again”</div>
      <div class="frag">Workshop notes, 1991 — the first-day silence exercise.<small>IMPORTED · TALKS</small></div>
      <div class="frag">Journal, 2004 — “every cohort teaches me the same thing differently.”<small>IMPORTED · JOURNALS</small></div>
      <div class="thread-label">Your thread — “the craft of attention”</div>
      <div class="frag">Handout: Listening Before Method.<small>IMPORTED · HANDOUTS</small></div>
      <div class="frag" style="border-style:dashed;color:var(--paper-faint)">214 more materials in the drawer — spread out what the work asks for.</div>
    </div>`,
    dWork:`<h4>Becoming</h4><div class="item">A body of teaching — gathering<small>loosely named is a real state, not a missing field</small></div>`,
    dMaterials:`<h4>Materials · 218</h4><div class="item">Journals 1984–2024 · 41 items<small>bulk import</small></div><div class="item">Recorded talks · 96 items<small>bulk import</small></div><div class="item">Handouts &amp; letters · 81 items<small>bulk import</small></div>`,
    dHistory:`<h4>Originals</h4><div class="item">Every import preserved as received<small>renewal never overwrites — new expressions grow beside the originals</small></div>`,
    window:"open",
    windowBody:`<h3>Reflection — you invited this</h3>
      <div class="you-said">“What themes run through these journals?”</div>
      <div class="maia-says">Across the journals you brought in, three phrases recur in your own words: <i>beginning again</i> (1991, 2004, 2017), <i>the room teaches</i> (1996, 2012), and <i>listening before method</i> (throughout the handouts). Would you like these gathered as threads on your table?</div>
      <div class="maia-says" style="border-left-color:var(--navy-line);color:var(--paper-faint)">MAIA connects only what you brought here, in your words. It will not organize your archive unasked, and it will not write your teaching.</div>`
  }
};

const DRAWER_LABELS={work:"Work",materials:"Materials",structure:"Structure",history:"History"};
let current="arrival", openDrawer=null, studyOpen=false;

const $=id=>document.getElementById(id);

function render(){
  const p=PERSONAS[current];
  // chrome
  $("personaLine").innerHTML=p.line;
  document.querySelectorAll("#personaBtns button").forEach(b=>b.classList.toggle("active",b.dataset.p===current));
  // header
  $("becoming").textContent=p.becoming; $("title").textContent=p.title;
  $("orient").textContent=p.orient;
  $("exprs").innerHTML=p.exprs?p.exprs.map((e,i)=>`<span class="${i===0?'on':''}">${e}</span>`).join(""):"";
  // presence
  $("presence").innerHTML=p.presence?p.presence.map(x=>`<div class="p ${x.you?'you':''}">${x.i}</div>`).join(""):"";
  // field
  $("field").innerHTML=p.field;
  // drawers
  const spine=$("spine"); spine.innerHTML="";
  p.drawers.forEach(d=>{
    const b=document.createElement("button");
    b.className="drawer-tab"+(openDrawer===d?" current":"");
    b.textContent=DRAWER_LABELS[d]; b.onclick=()=>toggleDrawer(d);
    spine.appendChild(b);
  });
  ["work","materials","structure","history"].forEach(d=>{
    const el=$("d"+DRAWER_LABELS[d]);
    el.innerHTML=p["d"+DRAWER_LABELS[d]]||"";
    el.classList.toggle("current",openDrawer===d);
  });
  $("study").classList.toggle("open",studyOpen&&!!openDrawer);
  // pinbar (only meaningful for structure here)
  $("pinbar").innerHTML = openDrawer==="structure"
    ? `<button class="${p.pinned?'pinned':''}" onclick="togglePin()">${p.pinned?'Pinned beside the field — unpin':'Pin beside the field'}</button>`:"";
  // structure rail
  $("rail").classList.toggle("show",!!p.pinned&&!!p.rail);
  $("railInner").innerHTML=p.rail?`<h4>Manuscript</h4>`+p.rail.map((c,i)=>`<div class="ch ${i===p.railHere?'here':''}">${c}</div>`).join(""):"";
  // window
  renderWindow(p.window==="open");
}

function renderWindow(open){
  const w=$("window"); w.classList.toggle("open",open);
  const p=PERSONAS[current];
  $("panel").innerHTML = open ? (
    (p.windowBody||`<h3>Reflection</h3>
      <button class="invite">“What connects the materials I brought?”</button>
      <button class="invite">“Read this passage back to me as a question.”</button>
      <button class="invite">“Hold a question for tomorrow.”</button>
      <div class="maia-says" style="border-left-color:var(--navy-line);color:var(--paper-faint)">MAIA opens only when you invite it. It reflects on what you show it — it does not watch, suggest unasked, score, or write your work.</div>`)
    + `<div class="vow">Invited, never ambient · reflects, never authors · your words stay yours.</div>
       <button class="close" onclick="event.stopPropagation();renderWindow(false)">— fold away</button>`
  ):"";
}

function toggleDrawer(d){
  if(openDrawer===d&&studyOpen){openDrawer=null;studyOpen=false;}
  else{openDrawer=d;studyOpen=true;}
  render();
}
function togglePin(){PERSONAS[current].pinned=!PERSONAS[current].pinned;render();}

$("window").addEventListener("click",()=>{if(!$("window").classList.contains("open"))renderWindow(true);});
$("notesBtn").addEventListener("click",()=>{document.body.classList.toggle("notes");$("notesBtn").classList.toggle("on");});

const btns=$("personaBtns");
Object.entries(PERSONAS).forEach(([k,v])=>{
  const b=document.createElement("button"); b.dataset.p=k; b.textContent=v.label;
  b.onclick=()=>{current=k;openDrawer=null;studyOpen=false;render();};
  btns.appendChild(b);
});
render();
</script>
</body>
</html>
