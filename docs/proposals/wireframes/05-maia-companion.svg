<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow5" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </radialGradient>

    <!-- MAIA presence glow -->
    <radialGradient id="maiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:0.2"/>
      <stop offset="60%" style="stop-color:#d4a574;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGlow5)"/>

  <!-- Central MAIA presence (not a chat bubble) -->
  <ellipse cx="600" cy="400" rx="300" ry="250" fill="url(#maiaGlow)"/>

  <!-- Soft circle suggesting presence -->
  <circle cx="600" cy="350" r="80"
          fill="none"
          stroke="#d4a574"
          stroke-width="1"
          opacity="0.3"
          filter="url(#softGlow)"/>

  <!-- MAIA name/presence indicator -->
  <text x="600" y="280"
        font-family="Georgia, serif"
        font-size="14"
        fill="#d4a574"
        text-anchor="middle"
        opacity="0.8">
    MAIA
  </text>

  <!-- Conversation space (minimal) -->

  <!-- User message (right aligned, subtle) -->
  <g transform="translate(650, 420)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#1e1e2a"/>
    <text x="150" y="30"
          font-family="Georgia, serif"
          font-size="14"
          fill="#a89f8f"
          text-anchor="middle">
      [User reflection appears here]
    </text>
  </g>

  <!-- MAIA response (left aligned, warm) -->
  <g transform="translate(250, 500)">
    <rect x="0" y="0" width="350" height="70" rx="8" fill="#1a1a24"/>
    <text x="175" y="25"
          font-family="Georgia, serif"
          font-size="14"
          fill="#e8dcc8"
          text-anchor="middle">
      [MAIA responds with presence,
    </text>
    <text x="175" y="50"
          font-family="Georgia, serif"
          font-size="14"
          fill="#e8dcc8"
          text-anchor="middle">
      not answers]
    </text>
  </g>

  <!-- Input area (voice-first suggested) -->
  <g transform="translate(350, 700)">
    <rect x="0" y="0" width="500" height="60" rx="30"
          fill="none"
          stroke="#333"
          stroke-width="1"/>

    <!-- Voice icon suggestion -->
    <circle cx="60" cy="30" r="20"
            fill="none"
            stroke="#d4a574"
            stroke-width="1"
            opacity="0.5"/>
    <text x="60" y="35"
          font-family="Arial, sans-serif"
          font-size="18"
          fill="#d4a574"
          text-anchor="middle"
          opacity="0.5">
      mic
    </text>

    <text x="250" y="35"
          font-family="Arial, sans-serif"
          font-size="14"
          fill="#555"
          text-anchor="middle">
      Speak or type what's present...
    </text>
  </g>

  <!-- Side panel: Lab Notes -->
  <g transform="translate(50, 150)">
    <text x="0" y="0"
          font-family="Georgia, serif"
          font-size="16"
          fill="#d4a574">
      Lab Notes
    </text>

    <rect x="0" y="20" width="150" height="8" fill="#222" rx="2"/>
    <rect x="0" y="35" width="120" height="8" fill="#222" rx="2"/>
    <rect x="0" y="50" width="140" height="8" fill="#222" rx="2"/>

    <text x="0" y="90"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#444">
      Your reflections, remembered
    </text>
    <text x="0" y="105"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#444">
      only as you choose.
    </text>
  </g>

  <!-- Side: Sanctuary toggle -->
  <g transform="translate(50, 600)">
    <!-- Toggle representation -->
    <rect x="0" y="0" width="40" height="20" rx="10" fill="#222" stroke="#444" stroke-width="1"/>
    <circle cx="12" cy="10" r="6" fill="#555"/>

    <text x="50" y="15"
          font-family="Arial, sans-serif"
          font-size="12"
          fill="#666">
      Sanctuary Mode
    </text>
    <text x="0" y="40"
          font-family="Arial, sans-serif"
          font-size="10"
          fill="#444">
      This session won't be remembered.
    </text>
  </g>

  <!-- Top right: Return to main site -->
  <text x="1100" y="50"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#555"
        text-anchor="end">
    Return to site
  </text>

  <!-- User indicator -->
  <text x="1100" y="80"
        font-family="Arial, sans-serif"
        font-size="11"
        fill="#444"
        text-anchor="end">
    [Client name]
  </text>

  <!-- Wireframe label -->
  <text x="600" y="850"
        font-family="Arial, sans-serif"
        font-size="11"
        fill="#555"
        text-anchor="middle">
    MAIA COMPANION - Presence, not chat widget. Voice-first option. Lab Notes sidebar. Sanctuary toggle.
  </text>

  <!-- Design note -->
  <text x="600" y="875"
        font-family="Arial, sans-serif"
        font-size="10"
        fill="#444"
        text-anchor="middle">
    This is a field to be with, not a tool to use.
  </text>
</svg>
