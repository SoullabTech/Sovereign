<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow3" cx="70%" cy="40%" r="80%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </radialGradient>

    <linearGradient id="imageOverlay3" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d14;stop-opacity:0"/>
      <stop offset="70%" style="stop-color:#0d0d14;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0d0d14;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGlow3)"/>

  <!-- Right side: Immersive image area (mirrored layout) -->
  <rect x="600" y="0" width="600" height="900" fill="#16161f"/>

  <!-- Image placeholder indicator -->
  <text x="900" y="450"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#444"
        text-anchor="middle">
    [Full-height atmospheric image]
  </text>
  <text x="900" y="475"
        font-family="Arial, sans-serif"
        font-size="11"
        fill="#333"
        text-anchor="middle">
    Depth, craftsmanship, slowness
  </text>

  <!-- Gradient overlay on image -->
  <rect x="600" y="0" width="600" height="900" fill="url(#imageOverlay3)"/>

  <!-- Left side: Content -->

  <!-- Back to threshold (subtle) -->
  <text x="80" y="60"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#666">
    &lt; Return
  </text>

  <!-- Page title -->
  <text x="80" y="180"
        font-family="Georgia, serif"
        font-size="42"
        fill="#e8dcc8">
    Walk With Others
  </text>

  <!-- Tagline -->
  <text x="80" y="240"
        font-family="Georgia, serif"
        font-size="18"
        font-style="italic"
        fill="#a89f8f">
    The technique is not the thing.
  </text>
  <text x="80" y="270"
        font-family="Georgia, serif"
        font-size="18"
        font-style="italic"
        fill="#a89f8f">
    Presence is the thing.
  </text>

  <!-- Body text placeholder -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="460" height="12" fill="#333" rx="2"/>
    <rect x="0" y="25" width="400" height="12" fill="#333" rx="2"/>
    <rect x="0" y="50" width="440" height="12" fill="#333" rx="2"/>
    <rect x="0" y="75" width="360" height="12" fill="#333" rx="2"/>
  </g>

  <!-- Offerings (minimal) -->
  <text x="80" y="460"
        font-family="Georgia, serif"
        font-size="20"
        fill="#d4a574">
    Pathways
  </text>

  <!-- Offering blocks (very minimal) -->
  <g transform="translate(80, 490)">
    <text x="0" y="20" font-family="Georgia, serif" font-size="15" fill="#e8dcc8">Mentoring</text>
    <rect x="0" y="35" width="200" height="8" fill="#2a2a3a" rx="2"/>

    <text x="0" y="80" font-family="Georgia, serif" font-size="15" fill="#e8dcc8">Trainings</text>
    <rect x="0" y="95" width="200" height="8" fill="#2a2a3a" rx="2"/>

    <text x="0" y="140" font-family="Georgia, serif" font-size="15" fill="#e8dcc8">Practitioner Field</text>
    <rect x="0" y="155" width="200" height="8" fill="#2a2a3a" rx="2"/>
  </g>

  <!-- CTA -->
  <g transform="translate(80, 700)">
    <rect x="0" y="0" width="200" height="56" rx="4"
          fill="none"
          stroke="#d4a574"
          stroke-width="1"/>
    <text x="100" y="35"
          font-family="Georgia, serif"
          font-size="16"
          fill="#e8dcc8"
          text-anchor="middle">
      Explore
    </text>
  </g>

  <!-- Secondary link -->
  <text x="80" y="800"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#666">
    Current practitioners: Access your field
  </text>

  <!-- Wireframe label -->
  <text x="600" y="870"
        font-family="Arial, sans-serif"
        font-size="11"
        fill="#555"
        text-anchor="middle">
    WALK WITH OTHERS - Mirrored split. Minimal offering list. Field access for practitioners.
  </text>
</svg>
