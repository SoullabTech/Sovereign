<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="800" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowMobile" cx="50%" cy="40%" r="80%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </radialGradient>

    <radialGradient id="hearthGlowMobile" cx="50%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:0.15"/>
      <stop offset="70%" style="stop-color:#d4a574;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="0" y="0" width="400" height="800" rx="40" fill="#0a0a0f" stroke="#333" stroke-width="2"/>

  <!-- Screen area -->
  <rect x="10" y="10" width="380" height="780" rx="35" fill="url(#bgGlowMobile)"/>

  <!-- Notch suggestion -->
  <rect x="140" y="15" width="120" height="25" rx="12" fill="#0a0a0f"/>

  <!-- Warm hearth glow from bottom -->
  <ellipse cx="200" cy="750" rx="180" ry="150" fill="url(#hearthGlowMobile)"/>

  <!-- Subtle particles -->
  <g opacity="0.3">
    <circle cx="80" cy="150" r="1" fill="#d4a574"/>
    <circle cx="320" cy="180" r="1.5" fill="#d4a574"/>
    <circle cx="200" cy="120" r="1" fill="#d4a574"/>
    <circle cx="60" cy="250" r="1" fill="#d4a574"/>
    <circle cx="340" cy="280" r="1.5" fill="#d4a574"/>
  </g>

  <!-- Tagline (higher on mobile) -->
  <text x="200" y="200"
        font-family="Georgia, serif"
        font-size="18"
        font-style="italic"
        fill="#e8dcc8"
        text-anchor="middle"
        opacity="0.9">
    A place to walk with
  </text>
  <text x="200" y="230"
        font-family="Georgia, serif"
        font-size="18"
        font-style="italic"
        fill="#e8dcc8"
        text-anchor="middle"
        opacity="0.9">
    what is already alive in you.
  </text>

  <!-- Three Portals (stacked on mobile) -->

  <!-- Portal 1 -->
  <g transform="translate(40, 320)">
    <rect x="0" y="0" width="320" height="100" rx="4"
          fill="none"
          stroke="#d4a574"
          stroke-width="1"
          opacity="0.4"/>
    <text x="160" y="50"
          font-family="Georgia, serif"
          font-size="20"
          fill="#e8dcc8"
          text-anchor="middle">
      Walk With Me
    </text>
    <text x="160" y="75"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#a89f8f"
          text-anchor="middle"
          opacity="0.7">
      Individual Work
    </text>
  </g>

  <!-- Portal 2 -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="320" height="100" rx="4"
          fill="none"
          stroke="#d4a574"
          stroke-width="1"
          opacity="0.4"/>
    <text x="160" y="50"
          font-family="Georgia, serif"
          font-size="20"
          fill="#e8dcc8"
          text-anchor="middle">
      Walk With Others
    </text>
    <text x="160" y="75"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#a89f8f"
          text-anchor="middle"
          opacity="0.7">
      Practitioners &amp; Mentoring
    </text>
  </g>

  <!-- Portal 3 -->
  <g transform="translate(40, 560)">
    <rect x="0" y="0" width="320" height="100" rx="4"
          fill="none"
          stroke="#d4a574"
          stroke-width="1"
          opacity="0.4"/>
    <text x="160" y="50"
          font-family="Georgia, serif"
          font-size="20"
          fill="#e8dcc8"
          text-anchor="middle">
      Hold the Field
    </text>
    <text x="160" y="75"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#a89f8f"
          text-anchor="middle"
          opacity="0.7">
      SEE &amp; Collective
    </text>
  </g>

  <!-- Home indicator -->
  <rect x="150" y="760" width="100" height="5" rx="2" fill="#444"/>
</svg>
