# MAIA Mentor Covenant — Constitutional Gate
# See docs/GOVERNANCE_MENTOR_COVENANT.md and docs/architecture/COVENANT_GATES_REDESIGN_2026-07-03.md
#
# Design stance (Phase 2 redesign, 2026-07-03):
#   • GitHub owns MERGE AUTHORITY — approvals, required reviewers (CODEOWNERS +
#     branch protection), branch protection, and merge eligibility.
#   • Covenant Gates owns CONSTITUTIONAL VALIDATION + DIAGNOSTICS ONLY —
#     classification, rollback/migration coupling, sacred-path discipline, and
#     an explanatory PR comment. It does NOT count approvals or gate on human
#     review; that authority lives in GitHub, not in this workflow.
#
# Removed in this redesign: the FOUNDERS/MENTORS/GUARDIAN_CIRCLE approval engine,
# per-class approval counting, and the `covenant-signoff` bootstrap bridge — all
# of which reimplemented (and diverged from) GitHub's own review model.
#
# Until a second human GitHub collaborator exists, this repo is single-owner +
# admin-merge, NOT independent two-person review. That is a property of GitHub
# access, enforced by branch protection — this workflow does not pretend otherwise.

name: Covenant Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  covenant-gates:
    runs-on: ubuntu-latest
    # Least-privilege: read PR files + write the diagnostic sticky comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Enforce covenant gates
        uses: actions/github-script@v7
        with:
          script: |
            // ═══════════════════════════════════════════════════════════════
            // CONSTITUTIONAL VALIDATION (no approval authority — GitHub owns that)
            // ═══════════════════════════════════════════════════════════════

            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const labels = pr.labels.map(l => l.name);

            // Per-class constitutional obligations. Note: NO approval fields.
            // "Who must approve" is GitHub's job (branch protection + CODEOWNERS).
            const REQUIREMENTS = {
              'class-a': { description: 'Sacred Boundaries (privacy/consent/safety/sovereignty)' },
              'class-b': { rollbackRequired: true, description: 'Structural Risk (migrations/auth/routing/infra)' },
              'class-c': { description: 'Routine Improvement (refactor/copy/UX/prompt tuning)' },
              'frontier-dependent': { verificationRequired: true, description: 'Frontier-Dependent (models/providers/pricing)' }
            };

            // ── CLASSIFICATION ──────────────────────────────────────────────
            // From PR-body checkbox OR label. Path-based safety rails below act as
            // a backstop so a mislabeled PR that touches sacred/migration paths
            // cannot slip through under a lower class.
            const classAChecked = body.includes('[x] **Class A');
            const classBChecked = body.includes('[x] **Class B');
            const classCChecked = body.includes('[x] **Class C');
            const frontierChecked = body.includes('[x] **Frontier-Dependent');

            const hasClassA = classAChecked || labels.includes('class-a');
            const hasClassB = classBChecked || labels.includes('class-b');
            const hasClassC = classCChecked || labels.includes('class-c');
            const hasFrontier = frontierChecked || labels.includes('frontier-dependent');

            let effectiveClass = null;
            if (hasClassA) effectiveClass = 'class-a';
            else if (hasFrontier) effectiveClass = 'frontier-dependent';
            else if (hasClassB) effectiveClass = 'class-b';
            else if (hasClassC) effectiveClass = 'class-c';

            const reqs = effectiveClass ? REQUIREMENTS[effectiveClass] : null;
            const failures = [];

            if (!effectiveClass) {
              failures.push('No change classification found — check a Class box in the PR body, or apply a `class-a` / `class-b` / `class-c` / `frontier-dependent` label.');
            } else {
              console.log(`📋 Classification: ${effectiveClass}`);
              console.log(`📜 ${reqs.description}`);
            }

            // ── ROLLBACK DISCIPLINE (Class B) ───────────────────────────────
            if (reqs && reqs.rollbackRequired) {
              const hasRollbackPlan =
                body.includes('[x] Revert commit is sufficient') ||
                body.includes('[x] Migration rollback script provided') ||
                body.includes('[x] Feature flag can disable') ||
                body.includes('[x] **No rollback possible**');
              if (!hasRollbackPlan) {
                failures.push('Rollback plan required — check one rollback option in the PR body (revert / migration rollback / feature flag / no rollback possible).');
              }
            }

            // ── FRONTIER VERIFICATION ───────────────────────────────────────
            if (reqs && reqs.verificationRequired) {
              if (!body.includes('[x] Verified by Mentor:')) {
                failures.push('Frontier verification required — add a `Verified by Mentor:` line to the PR body for external-dependency (model/provider/pricing) changes.');
              }
            }

            // ── FILE-PATH CONSTITUTIONAL RAILS ──────────────────────────────
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            const changedPaths = files.map(f => f.filename);

            // Sacred paths require Class A — safety/consent/sovereignty ENFORCEMENT
            // CODE only. Governance *documentation* is classified by real risk, not
            // force-elevated (see COVENANT_GATES_REDESIGN + #556).
            const sacredPaths = [
              'lib/safety/',
              'lib/memory/',
              'lib/consciousness/',
              'lib/session/',
              'app/api/session/'
            ];
            const touchesSacred = changedPaths.some(p => sacredPaths.some(s => p.startsWith(s)));
            if (touchesSacred && effectiveClass !== 'class-a') {
              failures.push('Modifies Sacred Boundary code but is not classified Class A — update classification to Class A for files in: ' + sacredPaths.join(', '));
            }

            // Migrations require at least Class B.
            const touchesMigrations = changedPaths.some(p => p.startsWith('database/migrations/'));
            if (touchesMigrations && effectiveClass === 'class-c') {
              failures.push('Modifies database migrations but is classified Class C — update classification to at least Class B.');
            }

            // ═══════════════════════════════════════════════════════════════
            // DIAGNOSTICS + RESULT  (sticky, actionable PR comment)
            // ═══════════════════════════════════════════════════════════════

            const COMMENT_MARKER = '<!-- covenant-gates-bot -->';

            function guidanceFor(fails) {
              const tips = [];
              if (fails.some(f => /No change classification/i.test(f))) {
                tips.push('- **Classification** — check a Class box in the PR body or apply a `class-*` label so the change is classified by its actual risk.');
              }
              if (fails.some(f => /Rollback plan required/i.test(f))) {
                tips.push('- **Rollback** — check one rollback option in the PR body (revert / migration rollback / feature flag / no rollback possible).');
              }
              if (fails.some(f => /Sacred Boundary code|update classification to Class A/i.test(f))) {
                tips.push('- **Sacred path** — this touches enforcement code; set classification to **Class A** (and expect CODEOWNERS review on merge).');
              }
              if (fails.some(f => /at least Class B/i.test(f))) {
                tips.push('- **Migration** — set classification to at least **Class B** and provide a rollback plan.');
              }
              if (fails.some(f => /Frontier verification/i.test(f))) {
                tips.push('- **Frontier** — add a `Verified by Mentor:` line for external-dependency changes.');
              }
              return tips;
            }

            async function upsertGateComment(bodyText, createIfMissing) {
              try {
                const commentBody = COMMENT_MARKER + '\n' + bodyText;
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100
                });
                const existing = comments.find(c => (c.body || '').includes(COMMENT_MARKER));
                if (existing) {
                  await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: commentBody });
                } else if (createIfMissing) {
                  await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: commentBody });
                }
              } catch (e) {
                console.log(`⚠️ Could not upsert covenant-gates comment (non-fatal): ${e.message}`);
              }
            }

            if (failures.length > 0) {
              const tips = guidanceFor(failures);
              const commentBody =
                `### ❌ Covenant Gates — constitutional check failed${effectiveClass ? ` (\`${effectiveClass}\`)` : ''}\n\n` +
                (reqs ? `**${reqs.description}**\n\n` : '') +
                `**Unmet:**\n` +
                failures.map(f => `- ${f}`).join('\n') + `\n\n` +
                (tips.length ? `**How to clear this gate:**\n${tips.join('\n')}\n\n` : '') +
                `> This gate validates *constitutional* obligations only. **Merge authority — approvals, required reviewers, branch protection — belongs to GitHub**, not this workflow.\n\n` +
                `_Re-runs automatically on label change or new commit._ · [Covenant](../docs/GOVERNANCE_MENTOR_COVENANT.md)`;
              await upsertGateComment(commentBody, true);

              core.setFailed(
                `❌ Covenant Gates failed${effectiveClass ? ` for ${effectiveClass}` : ''}\n\n` +
                `Unmet constitutional requirements:\n` +
                failures.map(f => `- ${f}`).join('\n') + `\n\n` +
                `Merge authority is GitHub's (branch protection + CODEOWNERS). This gate enforces constitutional obligations only.\n` +
                `See docs/GOVERNANCE_MENTOR_COVENANT.md.`
              );
            } else {
              console.log(`✅ Covenant Gates passed for ${effectiveClass} — constitutional obligations satisfied.`);
              // Clear a prior red comment if present; don't spam green on clean PRs.
              await upsertGateComment(`### ✅ Covenant Gates passed (\`${effectiveClass}\`)\n\nConstitutional obligations satisfied. Merge eligibility is determined by GitHub branch protection.`, false);
            }
