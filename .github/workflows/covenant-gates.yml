# MAIA Mentor Covenant — Constitutional Gate
# See docs/GOVERNANCE_MENTOR_COVENANT.md and docs/architecture/COVENANT_GATES_REDESIGN_2026-07-03.md
#
# Design stance (Phase 2 redesign, 2026-07-03):
#   • GitHub owns MERGE AUTHORITY — approvals, required reviewers (CODEOWNERS +
#     branch protection), branch protection, and merge eligibility.
#   • Covenant Gates owns CONSTITUTIONAL VALIDATION + DIAGNOSTICS ONLY —
#     classification, rollback/migration coupling, sacred-path discipline, and
#     an explanatory PR comment. It does NOT count approvals or gate on human
#     review; that authority lives in GitHub, not in this workflow.
#
# Removed in that redesign: the FOUNDERS/MENTORS/GUARDIAN_CIRCLE approval engine,
# per-class approval counting, and the `covenant-signoff` bootstrap bridge — all
# of which reimplemented (and diverged from) GitHub's own review model.
#
# AMENDMENT (RGE-001, ruling B', 2026-08-12):
#   #561's objection stands and is preserved: this workflow does NOT count
#   GitHub review objects and does NOT recreate GitHub's approval engine.
#   What is added is different in kind — a CONSTITUTIONAL DISPOSITION engine
#   that asks "what disposition exists for this exact head SHA?" GitHub keeps
#   merge authority; this becomes the admissibility check GitHub is configured
#   to require before exercising it.
#
#   Measured 2026-08-12: the repository requires ZERO approving reviews for any
#   change of any class. The covenant's Class A gate was therefore enforced by
#   nothing. That — not a review deadlock — is the defect B' addresses.
#
#   The purpose of B' is NOT to manufacture independence that does not exist.
#   It is to make the repository's actual governance state mechanically
#   enforceable, SHA-bound, and impossible to confuse with independent
#   multi-person review.
#
# Until a second human GitHub collaborator exists, this repo is single-owner,
# NOT independent two-person review. This workflow does not pretend otherwise —
# it prints the absence into the ledger on every Class A run.

name: Covenant Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  covenant-gates:
    runs-on: ubuntu-latest
    # Least-privilege: read PR files + write the diagnostic sticky comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Enforce covenant gates
        uses: actions/github-script@v7
        with:
          script: |
            // ═══════════════════════════════════════════════════════════════
            // CONSTITUTIONAL VALIDATION (no approval authority — GitHub owns that)
            // ═══════════════════════════════════════════════════════════════

            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const labels = pr.labels.map(l => l.name);

            // Per-class constitutional obligations. Note: NO approval fields.
            // "Who must approve" is GitHub's job (branch protection + CODEOWNERS).
            const REQUIREMENTS = {
              'class-a': { description: 'Sacred Boundaries (privacy/consent/safety/sovereignty)' },
              'class-b': { rollbackRequired: true, description: 'Structural Risk (migrations/auth/routing/infra)' },
              'class-c': { description: 'Routine Improvement (refactor/copy/UX/prompt tuning)' },
              'frontier-dependent': { verificationRequired: true, description: 'Frontier-Dependent (models/providers/pricing)' }
            };

            // ── CLASSIFICATION ──────────────────────────────────────────────
            // From PR-body checkbox OR label. Path-based safety rails below act as
            // a backstop so a mislabeled PR that touches sacred/migration paths
            // cannot slip through under a lower class.
            const classAChecked = body.includes('[x] **Class A');
            const classBChecked = body.includes('[x] **Class B');
            const classCChecked = body.includes('[x] **Class C');
            const frontierChecked = body.includes('[x] **Frontier-Dependent');

            const hasClassA = classAChecked || labels.includes('class-a');
            const hasClassB = classBChecked || labels.includes('class-b');
            const hasClassC = classCChecked || labels.includes('class-c');
            const hasFrontier = frontierChecked || labels.includes('frontier-dependent');

            let effectiveClass = null;
            if (hasClassA) effectiveClass = 'class-a';
            else if (hasFrontier) effectiveClass = 'frontier-dependent';
            else if (hasClassB) effectiveClass = 'class-b';
            else if (hasClassC) effectiveClass = 'class-c';

            const reqs = effectiveClass ? REQUIREMENTS[effectiveClass] : null;
            const failures = [];

            if (!effectiveClass) {
              failures.push('No change classification found — check a Class box in the PR body, or apply a `class-a` / `class-b` / `class-c` / `frontier-dependent` label.');
            } else {
              console.log(`📋 Classification: ${effectiveClass}`);
              console.log(`📜 ${reqs.description}`);
            }

            // ── ROLLBACK DISCIPLINE (Class B) ───────────────────────────────
            if (reqs && reqs.rollbackRequired) {
              const hasRollbackPlan =
                body.includes('[x] Revert commit is sufficient') ||
                body.includes('[x] Migration rollback script provided') ||
                body.includes('[x] Feature flag can disable') ||
                body.includes('[x] **No rollback possible**');
              if (!hasRollbackPlan) {
                failures.push('Rollback plan required — check one rollback option in the PR body (revert / migration rollback / feature flag / no rollback possible).');
              }
            }

            // ── FRONTIER VERIFICATION ───────────────────────────────────────
            if (reqs && reqs.verificationRequired) {
              if (!body.includes('[x] Verified by Mentor:')) {
                failures.push('Frontier verification required — add a `Verified by Mentor:` line to the PR body for external-dependency (model/provider/pricing) changes.');
              }
            }

            // ── FILE-PATH CONSTITUTIONAL RAILS ──────────────────────────────
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            const changedPaths = files.map(f => f.filename);

            // Sacred paths require Class A — safety/consent/sovereignty ENFORCEMENT
            // CODE only. Governance *documentation* is classified by real risk, not
            // force-elevated (see COVENANT_GATES_REDESIGN + #556).
            const sacredPaths = [
              'lib/safety/',
              'lib/memory/',
              'lib/consciousness/',
              'lib/session/',
              'app/api/session/'
            ];
            const touchesSacred = changedPaths.some(p => sacredPaths.some(s => p.startsWith(s)));
            if (touchesSacred && effectiveClass !== 'class-a') {
              failures.push('Modifies Sacred Boundary code but is not classified Class A — update classification to Class A for files in: ' + sacredPaths.join(', '));
            }

            // Migrations require at least Class B.
            const touchesMigrations = changedPaths.some(p => p.startsWith('database/migrations/'));
            if (touchesMigrations && effectiveClass === 'class-c') {
              failures.push('Modifies database migrations but is classified Class C — update classification to at least Class B.');
            }

            // ═══════════════════════════════════════════════════════════════
            // CONSTITUTIONAL DISPOSITION ENGINE  (RGE-001 ruling B′)
            //
            // This does NOT count GitHub review objects and does NOT recreate
            // GitHub's approval engine — that was #561's correct objection.
            // It asks one question: "What constitutional disposition exists
            // for THIS EXACT head SHA?"  GitHub remains the merge execution
            // mechanism; this is the constitutional admissibility mechanism.
            //
            // Ruled in RGE-001 §12/§15/§16 (D1–D4).
            // ═══════════════════════════════════════════════════════════════

            const FOUNDERS        = ['Soullab'];           // Founder-Steward (human)
            const SERVICE_IDS     = ['SoullabCovenant'];   // Mentor/service identity — NOT a constitutional vote
            const GUARDIAN_CIRCLE = [];                    // Council. Empty = unappointed. Add usernames when appointed.

            const headSha = pr.head.sha;                   // full 40-char
            const lc = s => String(s || '').toLowerCase();
            const inList = (login, list) => list.some(u => lc(u) === lc(login));

            // ── D1 · governance-bootstrap scope is DERIVED, never self-declared ──
            // A label or checkbox would be asserted by the same operator this
            // gate constrains. Path membership is objective and diffable.
            // The MIR path is an EXACT exception, not the audits tree.
            const BOOTSTRAP_ALLOWLIST = [
              { kind: 'prefix', v: 'docs/architecture/governance/' },
              { kind: 'exact',  v: 'docs/GOVERNANCE_MENTOR_COVENANT.md' },
              { kind: 'exact',  v: '.github/workflows/covenant-gates.yml' },
              { kind: 'exact',  v: '.github/pull_request_template.md' },
              { kind: 'exact',  v: 'docs/architecture/audits/MIR-001_MAIA_HEALTH_MAP_2026-08-12.md' },
              // D5: the gate's own proof substrate. Exact file only — not scripts/**,
              // not a generic tests directory. A suite that gates enforcement cannot
              // live off-repo; that would recreate the custody defect being fixed.
              { kind: 'exact',  v: 'scripts/governance/covenant-gates-conformance.mjs' }
            ];
            const pathAdmissible = p =>
              BOOTSTRAP_ALLOWLIST.some(r => r.kind === 'prefix' ? p.startsWith(r.v) : p === r.v);
            const inadmissiblePaths = changedPaths.filter(p => !pathAdmissible(p));
            const governanceBootstrapScope = changedPaths.length > 0 && inadmissiblePaths.length === 0;

            // ── D2 · SHA-bound signoff acts, parsed from PR comments ─────────
            // Identity = GitHub-authenticated comment author (not self-asserted).
            // Freshness = declared SHA must equal the CURRENT head, so any new
            // push invalidates every prior signoff automatically.
            // Deliberately NOT a GitHub Review object: requiring one recreates
            // the self-approval deadlock #561 was fixing.
            const SIGNOFF_RE = /^\s*\/covenant-signoff\s+role=([a-z-]+)\s+sha=([0-9a-f]{7,40})\s*$/im;
            let signoffActs = [];
            try {
              const { data: cmts } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100
              });
              for (const c of cmts) {
                for (const line of String(c.body || '').split('\n')) {
                  const m = line.match(SIGNOFF_RE);
                  if (!m) continue;
                  signoffActs.push({
                    role: lc(m[1]), sha: lc(m[2]), author: c.user && c.user.login,
                    commentId: c.id, at: c.created_at,
                    fresh: lc(m[2]) === lc(headSha)   // full-SHA match required
                  });
                }
              }
            } catch (e) {
              console.log(`⚠️ Could not read signoff comments: ${e.message}`);
            }

            const staleActs = signoffActs.filter(a => !a.fresh);
            const freshActs = signoffActs.filter(a => a.fresh);

            const founderSignoff = freshActs.find(a =>
              a.role === 'founder-steward' && inList(a.author, FOUNDERS));

            // ── D3 · a service identity may attest, never vote ───────────────
            const serviceAttestation = freshActs.find(a =>
              a.role === 'service-attestation' && inList(a.author, SERVICE_IDS));

            // Any attempt to dress a service identity (or anyone) as an
            // independent Mentor/Council vote is a hard failure, not a warning.
            const impersonation = freshActs.filter(a =>
              (a.role === 'council' || a.role === 'mentor') &&
              !inList(a.author, GUARDIAN_CIRCLE));

            // Real Council acts, only meaningful once a Circle is appointed.
            const councilActs = freshActs.filter(a =>
              a.role === 'council' && inList(a.author, GUARDIAN_CIRCLE));

            let disposition = null;
            const ledger = [];

            if (effectiveClass === 'class-a') {
              for (const bad of impersonation) {
                failures.push(
                  `Identity violation: @${bad.author} claimed role=\`${bad.role}\` but is not an appointed Guardian Circle member. ` +
                  `Service identities and non-Council accounts may not stand in for constitutional Council/Mentor votes (RGE-001 D3).`
                );
              }

              const councilAppointed = GUARDIAN_CIRCLE.length > 0;

              if (councilAppointed) {
                // Normal Class A path. BOOTSTRAP_NO_COUNCIL is automatically
                // unavailable the moment a Circle exists — no lingering fallback.
                if (!founderSignoff) failures.push('Class A: Founder-Steward signoff required for the current head SHA.');
                if (councilActs.length < 2) failures.push(`Class A: 2 Council signoffs required for the current head SHA (have ${councilActs.length}).`);
                if (failures.length === 0) disposition = 'CLASS_A_SATISFIED';
              } else {
                // ── E2 · BOOTSTRAP_NO_COUNCIL, narrowly ────────────────────
                // Admissible ONLY to establish/repair/canonicalize the
                // governance mechanism itself. Not equivalent to Class A
                // approval; does not authorize ordinary Class A product change.
                const declaresNotSatisfied = /independent_council_review:\s*NOT SATISFIED/i.test(body);

                if (!governanceBootstrapScope) {
                  failures.push(
                    'Class A cannot be satisfied: Guardian Circle is unappointed, and this PR is outside governance-bootstrap scope. ' +
                    (inadmissiblePaths.length
                      ? `Out-of-scope paths: ${inadmissiblePaths.slice(0, 8).join(', ')}${inadmissiblePaths.length > 8 ? ` (+${inadmissiblePaths.length - 8} more)` : ''}. `
                      : 'No files changed. ') +
                    'Ordinary Class A changes remain blocked until a Guardian Circle exists (RGE-001 E1) or a separate founder amendment is made.'
                  );
                }
                if (!founderSignoff) {
                  failures.push(
                    'BOOTSTRAP_NO_COUNCIL requires a Founder-Steward signoff bound to the current head SHA. ' +
                    `Comment: \`/covenant-signoff role=founder-steward sha=${headSha}\`` +
                    (staleActs.length ? ` (${staleActs.length} stale signoff(s) found for an earlier SHA — superseded by a newer push.)` : '')
                  );
                }
                if (!declaresNotSatisfied) {
                  failures.push('BOOTSTRAP_NO_COUNCIL requires the PR body to state, verbatim: `independent_council_review: NOT SATISFIED`');
                }
                if (failures.length === 0) disposition = 'BOOTSTRAP_NO_COUNCIL';
              }

              // Truthful ledger — absence is displayed, never quietly skipped.
              ledger.push('```text');
              ledger.push('CLASS A');
              ledger.push(`head_sha            ${headSha}`);
              ledger.push(`Founder-Steward     ${founderSignoff ? `SATISFIED — @${founderSignoff.author} (comment ${founderSignoff.commentId}, ${founderSignoff.at})` : 'NOT SATISFIED'}`);
              if (GUARDIAN_CIRCLE.length > 0) {
                ledger.push(`Council             ${councilActs.length}/2 SATISFIED`);
                ledger.push('mentor_status       per appointed roster');
              } else {
                ledger.push('mentor_status       NOT_INDEPENDENTLY_SATISFIED — no independent Mentor; service identity does not vote');
                ledger.push('Council #1          NOT AVAILABLE — Guardian Circle unappointed');
                ledger.push('Council #2          NOT AVAILABLE — Guardian Circle unappointed');
              }
              if (serviceAttestation) {
                ledger.push('service_attestation:');
                ledger.push(`  identity          ${serviceAttestation.author}`);
                ledger.push('  identity_class    service');
                ledger.push('  constitutional_mentor_vote  NO');
              }
              ledger.push(`governance_scope    ${governanceBootstrapScope ? 'governance_bootstrap' : 'OUT OF SCOPE'}`);
              ledger.push(`disposition         ${disposition || 'NONE — BLOCKED'}`);
              ledger.push(`independent review  NOT SATISFIED`);
              ledger.push('```');

              if (labels.includes('covenant-signoff')) {
                console.log('ℹ️ `covenant-signoff` label present. It carries NO authority under B′ — ' +
                            'a label is not an identity-bound, SHA-bound act. It is ignored.');
              }
            }

            // ═══════════════════════════════════════════════════════════════
            // DIAGNOSTICS + RESULT  (sticky, actionable PR comment)
            // ═══════════════════════════════════════════════════════════════

            const COMMENT_MARKER = '<!-- covenant-gates-bot -->';

            function guidanceFor(fails) {
              const tips = [];
              if (fails.some(f => /No change classification/i.test(f))) {
                tips.push('- **Classification** — check a Class box in the PR body or apply a `class-*` label so the change is classified by its actual risk.');
              }
              if (fails.some(f => /Rollback plan required/i.test(f))) {
                tips.push('- **Rollback** — check one rollback option in the PR body (revert / migration rollback / feature flag / no rollback possible).');
              }
              if (fails.some(f => /Sacred Boundary code|update classification to Class A/i.test(f))) {
                tips.push('- **Sacred path** — this touches enforcement code; set classification to **Class A** (and expect CODEOWNERS review on merge).');
              }
              if (fails.some(f => /at least Class B/i.test(f))) {
                tips.push('- **Migration** — set classification to at least **Class B** and provide a rollback plan.');
              }
              if (fails.some(f => /Frontier verification/i.test(f))) {
                tips.push('- **Frontier** — add a `Verified by Mentor:` line for external-dependency changes.');
              }
              if (fails.some(f => /Founder-Steward signoff|BOOTSTRAP_NO_COUNCIL requires a Founder/i.test(f))) {
                tips.push('- **Signoff** — comment `/covenant-signoff role=founder-steward sha=<full head SHA>`. It must name the CURRENT head; any new push invalidates it.');
              }
              if (fails.some(f => /independent_council_review/i.test(f))) {
                tips.push('- **Disposition declaration** — add `independent_council_review: NOT SATISFIED` to the PR body. The weaker disposition must be stated, not implied.');
              }
              if (fails.some(f => /outside governance-bootstrap scope/i.test(f))) {
                tips.push('- **Scope** — `BOOTSTRAP_NO_COUNCIL` covers governance-substrate work only. Split product changes into their own PR; they stay blocked until a Guardian Circle exists.');
              }
              if (fails.some(f => /Identity violation/i.test(f))) {
                tips.push('- **Identity** — service and non-Council accounts cannot stand in for Council/Mentor votes. Use `role=service-attestation`, which is recorded as `constitutional_mentor_vote: NO`.');
              }
              return tips;
            }

            async function upsertGateComment(bodyText, createIfMissing) {
              try {
                const commentBody = COMMENT_MARKER + '\n' + bodyText;
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100
                });
                const existing = comments.find(c => (c.body || '').includes(COMMENT_MARKER));
                if (existing) {
                  await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: commentBody });
                } else if (createIfMissing) {
                  await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: commentBody });
                }
              } catch (e) {
                console.log(`⚠️ Could not upsert covenant-gates comment (non-fatal): ${e.message}`);
              }
            }

            if (failures.length > 0) {
              const tips = guidanceFor(failures);
              const commentBody =
                `### ❌ Covenant Gates — constitutional check failed${effectiveClass ? ` (\`${effectiveClass}\`)` : ''}\n\n` +
                (reqs ? `**${reqs.description}**\n\n` : '') +
                `**Unmet:**\n` +
                failures.map(f => `- ${f}`).join('\n') + `\n\n` +
                (tips.length ? `**How to clear this gate:**\n${tips.join('\n')}\n\n` : '') +
                (ledger.length ? `**Constitutional ledger:**\n${ledger.join('\n')}\n\n` : '') +
                `> This gate validates *constitutional* obligations and disposition. **Merge execution — branch protection and merge authority — belongs to GitHub**, not this workflow.\n\n` +
                `_Re-runs automatically on label change or new commit._ · [Covenant](../docs/GOVERNANCE_MENTOR_COVENANT.md)`;
              await upsertGateComment(commentBody, true);

              core.setFailed(
                `❌ Covenant Gates failed${effectiveClass ? ` for ${effectiveClass}` : ''}\n\n` +
                `Unmet constitutional requirements:\n` +
                failures.map(f => `- ${f}`).join('\n') + `\n\n` +
                `Merge authority is GitHub's (branch protection + CODEOWNERS). This gate enforces constitutional obligations only.\n` +
                `See docs/GOVERNANCE_MENTOR_COVENANT.md.`
              );
            } else {
              console.log(`✅ Covenant Gates passed for ${effectiveClass} — constitutional obligations satisfied.`);
              // Clear a prior red comment if present; don't spam green on clean PRs.
              const okBody =
                `### ✅ Covenant Gates passed (\`${effectiveClass}\`)\n\n` +
                (disposition ? `**Disposition: \`${disposition}\`**\n\n` : '') +
                (ledger.length ? `${ledger.join('\n')}\n\n` : '') +
                (disposition === 'BOOTSTRAP_NO_COUNCIL'
                  ? `> \`BOOTSTRAP_NO_COUNCIL\` is **weaker than Class A on purpose and visibly**. It records one Founder authorizing a narrowly bounded governance-bootstrap act, with the absence of independent Mentor/Council governance made mechanically visible. It is **not** Class A approval and does **not** authorize ordinary Class A product changes. It disappears automatically once a Guardian Circle is appointed.\n\n`
                  : '') +
                `Merge eligibility is determined by GitHub branch protection.`;
              await upsertGateComment(okBody, disposition === 'BOOTSTRAP_NO_COUNCIL');
            }
