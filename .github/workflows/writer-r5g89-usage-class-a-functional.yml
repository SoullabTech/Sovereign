name: Writer R5G89 Usage Truth Functional — CLASS A DRAFT HOLD

# Read-only, fictional SDK fixtures, localhost-only real-SDK tests.
# This green review suite NEVER authorizes changing a governed source pin.
on:
  push:
    branches:
      - review/ws-r5g89-usage-failclosed-candidate-20261022
  pull_request:
    paths:
      - 'lib/ai/structured/**'
      - '.github/workflows/writer-r5g89-usage-class-a-functional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-truth-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact repository lockfile dependencies
        run: npm ci
      - name: Verify no genuine provider key or editorial-model authorization
        run: |
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${MAIA_EDITORIAL_MODEL:-}"
      - name: Run real SDK localhost + exact regression suites
        run: |
          npx jest --config jest.config.js --runInBand --no-cache --runTestsByPath \
            lib/ai/structured/__tests__/r5g88UsageProvenanceNegative.test.ts \
            lib/ai/structured/__tests__/r5g89UsageValidationEdges.test.ts \
            lib/ai/structured/__tests__/r5g87FullRouterPostSendReset.test.ts \
            lib/ai/structured/__tests__/r5g85PostSendResetDisclosureNegative.test.ts \
            lib/ai/structured/__tests__/r5g84ActualSdkLoopbackOneAttempt.test.ts \
            lib/ai/structured/__tests__/r5g84FullRouterActualSdkLoopback.test.ts \
            lib/ai/structured/__tests__/adapterErrorEdge.test.ts \
            lib/ai/structured/__tests__/providerErrorRedaction.test.ts \
            lib/ai/structured/__tests__/unwrappedRouterPrivacyHold.test.ts \
            lib/ai/structured/__tests__/nonFallbackable.test.ts \
            lib/ai/structured/__tests__/requestEquivalence.test.ts \
            lib/ai/structured/__tests__/modePolicy.test.ts \
            lib/disclosure/__tests__/editorialDisclosureFalsifiers.test.ts
