# JARVIS EPISTEMIC GUARD — authoritative CI admission gate.
#
# Founder ruling 2026-08-16:
#   CI blocks on `adjudicate`, never on `scan`.
#   `scan` remains local/advisory because this project's own measured evidence
#   (128 findings across 58 of 298 files) shows it is unsuitable as a
#   repository-wide blocking surface. It is deliberately absent from this file.
#
# SCOPE of what a green run establishes, exactly and no further:
#   Axis 1 enforced in authoritative CI against submitted, well-formed claim
#   records, with canonical ledger history available to G5.
#
#   A green run does NOT establish that claims are true, that fabricated
#   evidence was detected, or that inadmissible claims cannot enter by any
#   other route.

name: JARVIS Epistemic Guard

on:
  pull_request:
    branches: [clean-main-no-secrets, main]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed, edited]
  # Canonical push: `Axis 1` is branch-protection-required, and a commit that is
  # already canonical is never the head of an open PR. Adding the trigger alone
  # would have been wrong — this gate adjudicates against a BASE commit, and the
  # PR-only base expression has no meaning on a push. The base is resolved
  # per-event below. Added 2026-09-05 (CI-EXACT-SHA-CHECKS-01).
  push:
    branches: [clean-main-no-secrets, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  epistemic-admission:
    name: Axis 1 — authoritative adjudication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head with full history
        uses: actions/checkout@v4
        with:
          # full history: the gate reads canonical ledger state from the BASE
          # commit, never from the PR checkout
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Canonical custody self-proof
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node --test scripts/governance/__tests__/canonical-custody-floor-proof.mjs

      # The guard must prove itself before it is allowed to judge anything.
      - name: Guard self-proof
        run: node scripts/builder/__tests__/epistemic-guard-proof.mjs

      # The gate must prove it fails closed before it is allowed to gate.
      - name: CI gate fail-closed proof
        run: node scripts/builder/__tests__/epistemic-ci-proof.mjs

      # The adjudication base differs by event, and naming it wrongly would
      # change what this gate means rather than merely where it runs:
      #   pull_request → the PR's base commit (canonical before the PR)
      #   push         → the branch tip before this push (canonical before the merge)
      # Fail-closed: if neither resolves to a real commit, refuse rather than
      # adjudicate against nothing.
      - name: Resolve adjudication base
        id: adjbase
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_review" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
            # A new branch or a force-push reports an all-zero `before`; for a
            # merge commit the honest base is then its first parent.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::no adjudication base resolves for event '$EVENT_NAME'; refusing to adjudicate" >&2
            exit 1
          fi
          echo "Adjudication base for $EVENT_NAME: $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Enforce Class A canonical custody floor
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/governance/canonical-custody-floor.mjs --base "${{ steps.adjbase.outputs.base }}"

      - name: Adjudicate submitted claim records against canonical history
        env:
          JARVIS_BASE_SHA: ${{ steps.adjbase.outputs.base }}
        run: node scripts/builder/epistemic-ci.mjs --base "$JARVIS_BASE_SHA"

      # Runs only when a prior step failed. `if: failure()` is the fail-closed
      # posture: a crashed or cancelled job never reports success.
      - name: Explain refusal
        if: failure()
        run: |
          echo "::error title=Axis 1 admission refused::Required epistemic or canonical-custody evidence was insufficient, stale, malformed, or unavailable."
          echo "This is a fail-closed admission verdict. See docs/ops/JARVIS_EPISTEMIC_GUARDRAILS_2026-08-11.md and CANONICAL-ADMISSION-ENFORCEMENT-01."
