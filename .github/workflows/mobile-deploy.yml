name: MAIA Mobile Build & Deploy

on:
  push:
    branches: [main, staging, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_testflight:
        description: 'Deploy to TestFlight'
        required: false
        type: boolean
        default: false
      deploy_playstore:
        description: 'Deploy to Play Store'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  XCODE_VERSION: '15.0'

jobs:
  # Lint and test before building
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linting warnings ignored"

      # ENFORCEMENT DEBT: the `|| echo` makes this step non-blocking by construction,
      # so a TypeScript regression cannot fail the mobile pipeline. Retained
      # deliberately — removing the bypass was NOT authorized as part of the
      # typecheck gate-contract change (2026-07-30). Tracked in
      # docs/ops/TYPECHECK_GATE_COVERAGE_AUDIT_2026-07-30.md.
      - name: Type check (non-blocking — see enforcement debt above)
        run: npm run typecheck || echo "Type check warnings ignored"

      - name: Run tests
        run: npm test || echo "Tests passed with warnings"

  # Build Android APK
  build-android:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor (server mode)
        run: |
          # For Android, we use server mode - app loads from production URL
          # No static export needed (avoids API route conflicts)
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://soullab.life"></head></html>' > out/index.html
          # Create assets directory for capacitor config
          mkdir -p android/app/src/main/assets/public

      - name: Sync Capacitor
        run: CAPACITOR_MODE=beta npx cap sync android

      - name: Build Android Debug APK
        run: bash scripts/build-android.sh debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: maia-android-debug.apk
          retention-days: 30

      # Build release APK only on main branch/tags AND when signing secrets are configured
      - name: Check if Android signing is configured
        id: check-signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Android signing not configured - skipping release build"
          fi

      - name: Decode Android Keystore
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.check-signing.outputs.configured == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.keystore

      - name: Build Android Release APK
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.check-signing.outputs.configured == 'true'
        run: bash scripts/build-android.sh release
        env:
          ANDROID_KEYSTORE_PATH: ./android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Release APK
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.check-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: maia-android-release.apk
          retention-days: 90

  # Build iOS IPA
  build-ios:
    runs-on: macos-14
    needs: quality-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Prepare Capacitor (server mode)
        run: |
          # For iOS, we use server mode - app loads from production URL
          # No static export needed (avoids API route conflicts)
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=https://soullab.life"></head></html>' > out/index.html

      - name: Sync Capacitor
        run: CAPACITOR_MODE=beta npx cap sync ios

      # Build release IPA only on main branch or tags (when signing secrets are configured)
      - name: Import Code Signing Certificates
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        id: import-certs
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Download Provisioning Profiles
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.import-certs.outcome == 'success'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS IPA
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.import-certs.outcome == 'success'
        run: bash scripts/build-ios.sh release

      - name: Upload iOS IPA
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.import-certs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: maia-ios-release.ipa
          retention-days: 90

      - name: iOS Build Summary
        run: |
          echo "✅ iOS Capacitor sync completed successfully"
          echo "📱 Mobile app will load from https://soullab.life"
          if [[ "${{ steps.import-certs.outcome }}" != "success" ]]; then
            echo "⚠️ IPA not built - code signing secrets not configured"
          fi

  # Build PWA
  build-pwa:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run pwa:build
        env:
          NEXT_PUBLIC_CONSCIOUSNESS_PWA: true
          NODE_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAIA_AUDIT_FINGERPRINT_SECRET: ${{ secrets.MAIA_AUDIT_FINGERPRINT_SECRET }}

      - name: Generate PWA Icons
        run: npm run pwa:generate-icons || echo "Icon generation skipped"

      - name: Upload PWA Build
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: out/
          retention-days: 30

  # Deploy to TestFlight (manual trigger or on tags)
  deploy-testflight:
    runs-on: macos-14
    needs: build-ios
    if: |
      (github.event.inputs.deploy_testflight == 'true' || startsWith(github.ref, 'refs/tags/v'))
      && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Install Fastlane
        run: |
          gem install fastlane
          fastlane --version

      - name: Deploy to TestFlight
        run: |
          fastlane pilot upload \
            --ipa maia-ios-release.ipa \
            --api_key_path ${{ secrets.APP_STORE_CONNECT_API_KEY }} \
            --skip_waiting_for_build_processing true

  # Deploy to Google Play (manual trigger or on tags)
  deploy-playstore:
    runs-on: ubuntu-latest
    needs: build-android
    if: |
      (github.event.inputs.deploy_playstore == 'true' || startsWith(github.ref, 'refs/tags/v'))
      && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: life.soullab.maia
          releaseFiles: maia-android-release.apk
          track: internal
          status: draft

  # Notify on completion
  notify:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-pwa]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "Build Status:"
          echo "Android: ${{ needs.build-android.result }}"
          echo "iOS: ${{ needs.build-ios.result }}"
          echo "PWA: ${{ needs.build-pwa.result }}"
