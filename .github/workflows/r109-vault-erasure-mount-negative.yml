name: R109 Vault Mount Identity — Class A Expected RED Review

# Test-only: source-exact missing vault-mount negative, NEVER release authority.
# Genuine disposable GitHub runner Docker volumes; no production or real bytes.
on:
  push:
    branches:
      - review/r109-media-vault-mount-erasure-negative-20261023
  pull_request:
    paths:
      - 'lib/manuscript/source/__tests__/r109MountErasureHold.review.test.ts'
      - 'lib/manuscript/source/__tests__/r110RealPgQueueHold.pg16.review.test.ts'
      - 'scripts/qualification/r109-vault-mount-physical.review.sh'
      - '.github/workflows/r109-vault-erasure-mount-negative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run actual erasure queue with fictional physical vault directories
        run: |
          npx jest --config jest.config.js --runInBand --no-cache --runTestsByPath \
            lib/manuscript/source/__tests__/r109MountErasureHold.review.test.ts

  disposable-two-container-mount-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run original fileVault.ts inside isolated containers and one disposable Docker volume
        run: bash scripts/qualification/r109-vault-mount-physical.review.sh

  disposable-postgres16-queue-expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fictional_writer_qa
          POSTGRES_PASSWORD: fictional_only
          POSTGRES_DB: fictional_r110_vault_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fictional_writer_qa -d fictional_r110_vault_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      GITHUB_ACTIONS: 'true'
      TZ: UTC
      R110_REAL_PG16_QA: 'TRUE_EPHEMERAL_ONLY'
      DATABASE_URL: 'postgresql://fictional_writer_qa:fictional_only@127.0.0.1:5432/fictional_r110_vault_qa'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Real PostgreSQL queue plus original eraser, fictional wrong-root negative
        run: |
          npx jest --config jest.config.js --runInBand --no-cache --runTestsByPath \
            lib/manuscript/source/__tests__/r110RealPgQueueHold.pg16.review.test.ts
