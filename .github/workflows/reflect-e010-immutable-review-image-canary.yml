name: Reflect E010 immutable review image and fictional canary (NO DEPLOY)

on:
  pull_request:
    paths:
      - .github/workflows/reflect-e010-immutable-review-image-canary.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: reflect-e010-review-image
  cancel-in-progress: true

jobs:
  archive-exact-source:
    name: Build and archive exact Linux amd64 candidate — review only
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_SHA: e010c0977320ea3cceb7424e84a5cf5c58770cc2
      IMAGE: maia-sovereign:reflect-e010-review-only
    steps:
      - name: Checkout the exact frozen application SHA, never the PR merge ref
        uses: actions/checkout@v4
        with:
          ref: e010c0977320ea3cceb7424e84a5cf5c58770cc2
          persist-credentials: false

      - name: Verify source identity and adequate ephemeral runner space
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          df -h /
          if [ "${available_kb}" -lt 15000000 ]; then
            echo 'Not enough free space for safe review artifact export on this ephemeral runner.' >&2
            exit 1
          fi
          echo 'Exact source identity and build disk budget confirmed.'

      - name: Set up isolated Linux BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build exact image without pushing to a registry or deploying
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --progress=plain --pull \
            --cache-from type=gha \
            --build-arg DEPLOY_LANE_TOKEN=ci-review-image-only \
            --build-arg GIT_COMMIT="$SOURCE_SHA" \
            --build-arg APP_VERSION=1.2.0 \
            --load --tag "$IMAGE" .

      - name: Prove image runtime stamp, architecture and portable archive integrity
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          architecture="$(docker image inspect "$IMAGE" --format '{{.Architecture}}')"
          stamp="$(docker image inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^GIT_COMMIT=//p' | head -n 1)"
          test "$architecture" = amd64
          test "$stamp" = "$SOURCE_SHA"
          test "${image_id#sha256:}" != "$image_id"
          out="$RUNNER_TEMP/reflect-e010-linux-amd64.docker.tar.gz"
          docker save "$IMAGE" | gzip -1 > "$out"
          gzip -t "$out"
          (cd "$RUNNER_TEMP" && sha256sum reflect-e010-linux-amd64.docker.tar.gz > reflect-e010-linux-amd64.docker.tar.gz.sha256)
          (cd "$RUNNER_TEMP" && sha256sum -c reflect-e010-linux-amd64.docker.tar.gz.sha256)
          printf 'SOURCE_SHA=%s\nIMAGE_ID=%s\nARCHITECTURE=%s\nBUILD_LANE=%s\nPRODUCTION_DEPLOYED=%s\n' \
            "$SOURCE_SHA" "$image_id" "$architecture" ci-review-image-only false \
            > "$RUNNER_TEMP/reflect-e010-image-identity.txt"
          echo 'Portable image archived with checked SHA-256. This is not a production release.'

      - name: Retain access-controlled review artifact briefly (never publish or deploy)
        uses: actions/upload-artifact@v4
        with:
          name: reflect-e010-linux-amd64-review-only
          path: |
            ${{ runner.temp }}/reflect-e010-linux-amd64.docker.tar.gz
            ${{ runner.temp }}/reflect-e010-linux-amd64.docker.tar.gz.sha256
            ${{ runner.temp }}/reflect-e010-image-identity.txt
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  synthetic-reader:
    name: Reopen exact archived Linux amd64 image with fictional auth
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: archive-exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      SOURCE_SHA: e010c0977320ea3cceb7424e84a5cf5c58770cc2
      IMAGE: maia-sovereign:reflect-e010-review-only
      ARTIFACT_DIR: /tmp/reflect-e010-image
    steps:
      - name: Download same-run, ephemeral review artifact (no application checkout)
        uses: actions/download-artifact@v4
        with:
          name: reflect-e010-linux-amd64-review-only
          path: /tmp/reflect-e010-image

      - name: Verify archive, exact stamp, Linux architecture and isolated lane
        shell: bash
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIR"
          test -f reflect-e010-linux-amd64.docker.tar.gz
          test -f reflect-e010-linux-amd64.docker.tar.gz.sha256
          test -f reflect-e010-image-identity.txt
          sha256sum -c reflect-e010-linux-amd64.docker.tar.gz.sha256
          grep -Fx "SOURCE_SHA=$SOURCE_SHA" reflect-e010-image-identity.txt
          expected_id="$(sed -n 's/^IMAGE_ID=//p' reflect-e010-image-identity.txt)"
          test "${expected_id#sha256:}" != "$expected_id"
          grep -Fx "IMAGE_ID=$expected_id" reflect-e010-image-identity.txt
          grep -Fx 'ARCHITECTURE=amd64' reflect-e010-image-identity.txt
          grep -Fx 'BUILD_LANE=ci-review-image-only' reflect-e010-image-identity.txt
          grep -Fx 'PRODUCTION_DEPLOYED=false' reflect-e010-image-identity.txt
          echo 'Source and archive identity verified; loading image only in isolated GitHub runner.'
          gzip -dc reflect-e010-linux-amd64.docker.tar.gz | docker load
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$expected_id"
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
          docker image inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "GIT_COMMIT=$SOURCE_SHA"
          docker image inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'DEPLOY_LANE=ci-review-image-only'

      - name: Launch fictional PostgreSQL and compiled reader on ephemeral Docker network
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f reflect873app reflect873pg >/dev/null 2>&1 || true
            docker network rm reflect873fiction >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create reflect873fiction >/dev/null
          docker run --pull=always --rm -d --name reflect873pg --network reflect873fiction \
            -e POSTGRES_USER=fiction -e POSTGRES_PASSWORD=fiction-only -e POSTGRES_DB=fiction \
            postgres:16-alpine >/dev/null
          ready=false
          for n in $(seq 1 55); do
            if docker exec reflect873pg pg_isready -U fiction -d fiction >/dev/null 2>&1; then
              sleep 2
              if docker exec reflect873pg pg_isready -U fiction -d fiction >/dev/null 2>&1; then ready=true; break; fi
            fi
            sleep 1
          done
          test "$ready" = true
          cat > "$RUNNER_TEMP/reflect-fictional.sql" <<'SQL'
          CREATE TABLE members(id uuid PRIMARY KEY, tier text NOT NULL, roles text[] NOT NULL);
          INSERT INTO members(id,tier,roles) VALUES
            ('11111111-1111-4111-8111-111111111111','free',ARRAY['member']),
            ('22222222-2222-4222-8222-222222222222','free',ARRAY['member']);
          CREATE TABLE auth_sessions(
            id uuid PRIMARY KEY, member_id uuid NOT NULL, session_token text UNIQUE NOT NULL,
            device_id text, ip_address inet, user_agent text, expires_at timestamptz NOT NULL,
            last_active_at timestamptz NOT NULL DEFAULT now(), revoked boolean NOT NULL DEFAULT false);
          INSERT INTO auth_sessions(id,member_id,session_token,expires_at,revoked) VALUES
            ('aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaa1','11111111-1111-4111-8111-111111111111','fiction-A',now()+interval '1 day',false),
            ('aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaa2','22222222-2222-4222-8222-222222222222','fiction-B',now()+interval '1 day',false),
            ('aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaa3','11111111-1111-4111-8111-111111111111','fiction-A2',now()+interval '1 day',false),
            ('aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaa4','11111111-1111-4111-8111-111111111111','fiction-revoked',now()+interval '1 day',true),
            ('aaaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaa5','11111111-1111-4111-8111-111111111111','fiction-expired',now()-interval '1 day',false);
          SQL
          docker exec -i reflect873pg psql -X -q -v ON_ERROR_STOP=1 -U fiction -d fiction < "$RUNNER_TEMP/reflect-fictional.sql"
          start_reader() {
            local enabled="$1"
            docker run --rm -d --name reflect873app --network reflect873fiction \
              -p 127.0.0.1:38051:3000 \
              -e DATABASE_URL=postgresql://fiction:fiction-only@reflect873pg:5432/fiction \
              -e PRO_STUDIO_REFLECT_BETA_ENABLED="$enabled" \
              -e PRO_STUDIO_REFLECT_BETA_MEMBER_IDS=11111111-1111-4111-8111-111111111111 \
              "$IMAGE" >/dev/null
            local ready=false
            for n in $(seq 1 65); do
              if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:38051/signin; then ready=true; break; fi
              if ! docker inspect reflect873app --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
                docker logs --tail 45 reflect873app | sed -E 's/[a-f0-9]{64}/[token-redacted]/g' >&2
                return 1
              fi
              sleep 1
            done
            test "$ready" = true
          }
          call() {
            local name="$1" cookie="$2" rsc="$3"
            local headers="$RUNNER_TEMP/${name}.headers" body="$RUNNER_TEMP/${name}.body"
            local -a args=()
            if [ -n "$cookie" ]; then args+=(-H "Cookie: $cookie"); fi
            if [ "$rsc" = yes ]; then
              args+=(-H 'RSC: 1' -H 'Accept: text/x-component' -H 'Next-Url: /home')
            fi
            curl -sS -L --max-redirs 4 --max-time 12 -D "$headers" -o "$body" "${args[@]}" \
              'http://127.0.0.1:38051/pro-studio/reflect' >/dev/null
            test -s "$headers"
          }
          contains() { grep -q 'Your work begins with you.' "$RUNNER_TEMP/$1.body"; }
          refuses() {
            if contains "$1" || grep -q 'Begin reflecting with MAIA' "$RUNNER_TEMP/$1.body"; then
              echo "Protected Reflect content reached denied case $1" >&2
              return 1
            fi
          }
          cA='maia_session=fiction-A; maia_member_id=11111111-1111-4111-8111-111111111111; maia_tier=free; maia_roles=%5B%22member%22%5D'
          cA2='maia_session=fiction-A2; maia_member_id=11111111-1111-4111-8111-111111111111; maia_tier=free; maia_roles=%5B%22member%22%5D'
          cB='maia_session=fiction-B; maia_member_id=22222222-2222-4222-8222-222222222222; maia_tier=free; maia_roles=%5B%22member%22%5D'
          start_reader true
          call invited "$cA" no
          contains invited
          grep -q 'Begin reflecting with MAIA' "$RUNNER_TEMP/invited.body"
          grep -iq '^cache-control: private,.*no-store' "$RUNNER_TEMP/invited.headers"
          call uninvited "$cB" no
          refuses uninvited
          call guest '' no
          refuses guest
          call revoked 'maia_session=fiction-revoked; maia_member_id=11111111-1111-4111-8111-111111111111' no
          refuses revoked
          call expired 'maia_session=fiction-expired; maia_member_id=11111111-1111-4111-8111-111111111111' no
          refuses expired
          call forged 'maia_member_id=11111111-1111-4111-8111-111111111111; maia_tier=pro' no
          refuses forged
          call invited_rsc "$cA" yes
          contains invited_rsc
          grep -iq '^content-type: text/x-component' "$RUNNER_TEMP/invited_rsc.headers"
          grep -iq '^cache-control: private,.*no-store' "$RUNNER_TEMP/invited_rsc.headers"
          call uninvited_rsc "$cB" yes
          refuses uninvited_rsc
          grep -iq '^cache-control: private,.*no-store' "$RUNNER_TEMP/uninvited_rsc.headers"
          call invited_valid_before_off "$cA2" no
          contains invited_valid_before_off
          docker stop reflect873app >/dev/null
          start_reader false
          call still_valid_after_off "$cA2" no
          refuses still_valid_after_off
          echo 'COMPILED_ARCHIVED_IMAGE_FICTIONAL_MEMBER_AUTH_PASS'
          echo 'NO_REAL_USERS_OR_PRODUCTION_NETWORKS_ACCESSED'

      - name: Verify ephemeral cleanup and record nonrelease status
        if: always()
        shell: bash
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Eq '^reflect873(app|pg)$'; then
            echo 'Temporary fixture containers survived cleanup.' >&2
            exit 1
          fi
          echo 'NO_DEPLOYMENT=TRUE: synthetic-only runner and image validation.'
