# Class A Member Access regression check: independent of production recovery.
# NO real members, passwords, email deliveries, API access or database mutation.
name: Member Access Recovery Regression

on:
  pull_request:
    branches: [clean-main-no-secrets]
    paths:
      - 'lib/admin/memberRecovery.ts'
      - 'app/api/admin/members/recovery/**'
      - 'app/api/members/admin-recovery/**'
      - 'app/labtools/admin/command-center/member-access/**'
      - 'app/member-recovery/**'
      - 'database/migrations/20261018000001_admin_member_recovery_tokens.sql'
      - '.github/workflows/member-access-recovery-regression.yml'

permissions:
  contents: read

jobs:
  fictional-member-access:
    name: One-use reset and founder-authority falsifiers
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DATABASE_URL: 'postgresql://invalid:invalid@127.0.0.1:1/fixture_denied'
      LABTOOLS_ADMIN_PASSWORD: ''
      ADMIN_RESET_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check fictional-account security regressions
        run: >-
          npx --no-install jest --config jest.config.js --runInBand --runTestsByPath
          app/api/admin/members/recovery/__tests__/memberAccessRecovery.test.ts
