# MAIA Sovereign - Production CI/CD Pipeline
name: 🚀 Deploy MAIA Sovereign

on:
  push:
    branches: [main, production]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Quality Checks
  security:
    name: 🔒 Security & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run leak guardrail
        run: bash scripts/ci/leak-guard.sh || true

      - name: Run security audit
        run: npm audit --audit-level=high || true

      - name: Run TypeScript no-regression gate
        run: npm run typecheck

      - name: Run linting
        run: npm run lint || true

      - name: Run tests
        run: npm run test:ci || true

  # Build and Test
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: security
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          MAIA_AUDIT_FINGERPRINT_SECRET: build-placeholder
          OPENAI_API_KEY: sk-placeholder
          ANTHROPIC_API_KEY: sk-placeholder

      - name: Test build artifacts
        run: |
          ls -la .next/ || true
          test -f .next/BUILD_ID || true

      - name: Run integration tests
        run: npm run test:integration || true

  # Browser Testing
  browser-tests:
    name: 🌐 Browser Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install puppeteer --no-save

      - name: Start application
        run: |
          npm run build
          npm run start &
          sleep 15
        env:
          NODE_ENV: production
          PORT: 3002
          MAIA_AUDIT_FINGERPRINT_SECRET: build-placeholder
          OPENAI_API_KEY: sk-placeholder
          ANTHROPIC_API_KEY: sk-placeholder

      - name: Run browser tests
        run: |
          node test-voice-features.js || true
          node simple-browser-test.js || true

      - name: Test PWA features
        run: node test-pwa-features.js || true

  # Docker Build
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [security, build]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # CI is its own declared deploy lane — the Dockerfile's deploy-lane
          # tripwire refuses token-less builds (docs/ops/DEPLOY_LANE_TOKEN.md).
          build-args: |
            DEPLOY_LANE_TOKEN=ci-deploy

  # Deploy to Staging
  # DISABLED: Waiting for self-hosted runner on Mac Studio
  # Re-enable by setting ENABLE_STAGING_DEPLOY secret to 'true'
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [browser-tests, docker]
    if: false  # Temporarily disabled - server unreachable
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/maia-sovereign
            git pull origin main
            cp .env.staging .env.production
            ./deploy.sh staging

      - name: Health check staging
        run: |
          sleep 30
          curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        continue-on-error: true
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: "MAIA Sovereign staging deployment: ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/maia-sovereign
            git pull origin production
            cp .env.production .env.production
            ./deploy.sh production

      - name: Health check production
        run: |
          sleep 60
          curl -f ${{ secrets.PRODUCTION_URL }}/api/health || exit 1

      - name: Update monitoring
        continue-on-error: true
        run: |
          if [ -n "$MONITORING_WEBHOOK" ]; then
            curl -X POST "$MONITORING_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"text": "✅ MAIA Sovereign production deployment successful", "version": "${{ github.sha }}"}'
          fi
        env:
          MONITORING_WEBHOOK: ${{ secrets.MONITORING_WEBHOOK }}

      - name: Notify successful deployment
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        with:
          status: success
          channel: '#general'
          text: "🎉 MAIA Sovereign production deployment successful!"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Performance Testing
  performance:
    name: ⚡ Performance Testing
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ secrets.STAGING_URL }}
            ${{ secrets.STAGING_URL }}/maia
          configPath: './lighthouse.config.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Performance budget check
        run: |
          echo "Performance metrics captured"
          # Add custom performance checks here

  # Security Scanning
  security-scan:
    name: 🔍 Security Scan
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image ref
        id: img
        shell: bash
        run: |
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ steps.img.outputs.repo_lc }}:sha-${{ steps.img.outputs.short_sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'