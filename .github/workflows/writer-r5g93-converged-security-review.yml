name: Writer R5G93 Source Convergence — CLASS A DRAFT HOLD

# TEST-ONLY INTEGRATION. Reviewed source bytes in a disposable Git branch,
# not the JARVIS owner's protected working tree or production. Provider SDK
# calls use 127.0.0.1 injected fake transport, never a real model/credential.
# Historic source pins and known unsafe HTTP route remain unwaived RED gates.
on:
  push:
    branches:
      - review/ws-r5g93-combined-exact-source-qa-20261023
  pull_request:
    paths:
      - 'lib/ai/structured/**'
      - 'lib/db/**'
      - 'lib/disclosure/**'
      - 'lib/manuscript/editorialRuntime/**'
      - '.github/workflows/writer-r5g93-converged-security-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-source-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact repository lockfile dependencies
        run: npm ci
      - name: Confirm no real provider model key or production database identity
        run: |
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${MAIA_EDITORIAL_MODEL:-}"
          test -z "${DATABASE_URL:-}"
      - name: Source-exact combined privacy and original unchanged RED-to-GREEN falsifiers
        run: |
          npx jest --config jest.config.js --runInBand --no-cache --runTestsByPath \
            lib/ai/structured/__tests__/unwrappedRouterPrivacyHold.test.ts \
            lib/ai/structured/__tests__/providerErrorRedaction.test.ts \
            lib/ai/structured/__tests__/adapterErrorEdge.test.ts \
            lib/ai/structured/__tests__/nonFallbackable.test.ts \
            lib/ai/structured/__tests__/requestEquivalence.test.ts \
            lib/ai/structured/__tests__/modePolicy.test.ts \
            lib/ai/structured/__tests__/invalidModeDetailPrivacyHold.test.ts \
            lib/ai/structured/__tests__/r5g84ActualSdkLoopbackOneAttempt.test.ts \
            lib/ai/structured/__tests__/r5g84FullRouterActualSdkLoopback.test.ts \
            lib/ai/structured/__tests__/r5g85PostSendResetDisclosureNegative.test.ts \
            lib/ai/structured/__tests__/r5g87FullRouterPostSendReset.test.ts \
            lib/ai/structured/__tests__/r5g88UsageProvenanceNegative.test.ts \
            lib/ai/structured/__tests__/r5g89UsageValidationEdges.test.ts \
            lib/disclosure/__tests__/editorialDisclosureFalsifiers.test.ts \
            lib/disclosure/__tests__/contextDisclosureReceipt.test.ts \
            lib/disclosure/__tests__/disclosureExceptionPrivacyHold.test.ts \
            lib/disclosure/__tests__/adjacentErrorPrivacyHardening.test.ts \
            lib/db/__tests__/errorMetadataPrivacyHold.test.ts \
            lib/db/__tests__/errorMetadataPrivacyHardening.test.ts \
            lib/db/__tests__/paramRedaction.test.ts \
            lib/db/__tests__/postgres.missingTable.test.ts \
            lib/db/__tests__/r5g90ExpectedRefusalGetterHold.test.ts \
            lib/db/__tests__/r5g91ExpectedRefusalDescriptorEdges.test.ts \
            lib/manuscript/editorialRuntime/__tests__/modelAttributionRuntimePrivacyHold.test.ts

  unfixed-http-route-security-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prove untouched model-attribution HTTP refusal remains unsafe (EXPECTED RED)
        run: |
          npx jest --config jest.config.js --runInBand --no-cache --runTestsByPath \
            app/api/writers-studio/editorial/turn/__tests__/modelAttributionDetailPrivacyHold.test.ts \
            app/api/writers-studio/editorial/turn/__tests__/a2CarryRoute.test.ts
