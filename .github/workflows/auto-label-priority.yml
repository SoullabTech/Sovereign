name: Auto-label priority from issue form

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply P0/P1/P2 based on Severity field
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            // Try to find the Severity answer from GitHub Issue Form output
            // It usually renders like:
            // ### Severity
            // P1 - Voice flaky but usable
            const match = body.match(/###\s*Severity\s*\n+([^\n]+)/i);

            if (!match) {
              core.info("No Severity field found — skipping.");
              return;
            }

            const severityLine = match[1].trim();
            const priority = severityLine.startsWith("P0") ? "P0"
                           : severityLine.startsWith("P1") ? "P1"
                           : severityLine.startsWith("P2") ? "P2"
                           : null;

            if (!priority) {
              core.info(`Severity line didn't start with P0/P1/P2: ${severityLine}`);
              return;
            }

            // Remove other priority labels first, then add the one we want
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;

            const desired = priority;
            const all = ["P0", "P1", "P2"];
            const toRemove = all.filter(l => l !== desired);

            // Remove the others (ignore failures)
            for (const label of toRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (e) {}
            }

            // Add desired label (idempotent)
            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: [desired]
            });

            core.info(`Applied priority label: ${desired}`);
