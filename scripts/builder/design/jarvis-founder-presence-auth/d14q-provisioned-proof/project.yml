# JARVIS Desktop D-14Q — throwaway provisioning vehicle, generated by xcodegen
# (https://github.com/yonaskolb/XcodeGen), not hand-authored. Purpose: cause
# Apple's provisioning infrastructure to authorize the keychain-access-groups
# capability for a test App ID, via `xcodebuild -allowProvisioningUpdates`,
# so an actual provisioning profile exists to test the D-14P substrate
# against. This project is scaffolding only — no application logic lives
# here; the D-14P Security-framework substrate (presence-proof-v2.swift)
# remains unchanged and is what actually gets tested once a profile exists.

name: D14QPresenceProof
options:
  bundleIdPrefix: com.soullab.jarvis
  developmentLanguage: en
targets:
  D14QPresenceProof:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soullab.jarvis.d14q.presenceproof
        DEVELOPMENT_TEAM: ZVK2X646Z2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
    entitlements:
      path: D14QPresenceProof.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.soullab.jarvis.d14q.presenceproof
