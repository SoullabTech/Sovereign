# STATIC PREFLIGHT ONLY. No PostgreSQL service, network, application, or SQL.
# Prepared for review; Docker execution requires separate authorization.
name: ubuntu-r1f-stageb-static-preflight
services:
  static-preflight:
    profiles: [stageb-preflight]
    image: "${R1F_NODE_IMAGE_DIGEST:?must supply independently verified preloaded immutable Node image digest}"
    pull_policy: never
    restart: "no"
    init: true
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: []
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - type: bind
        source: ./preflight.mjs
        target: /workspace/preflight.mjs
        read_only: true
    working_dir: /workspace
    environment:
      NODE_ENV: test
      R1F_STAGE_B_SCOPE: FICTIONAL_DISPOSABLE_ONLY
      R1F_STAGE_B_MODE: PREFLIGHT_ONLY
      R1F_SOURCE_SHA: 81ae1edfe592fedac43e458245944e4dd33e9a41
      R1F_EGRESS: INTERNAL_ONLY
      R1F_DATABASE_ATTESTATION: NOT_YET_VERIFIED
      DATABASE_URL: postgresql://ubuntu_fixture_test:fictional_fixture_only@pg-fixture:5432/ubuntu_r1f_ephemeral
    command: ["node", "/workspace/preflight.mjs", "--preflight"]
    mem_limit: 256m
    pids_limit: 40
