<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- No static <title>. The window title carries the ARTIFACT IDENTITY (F5) and is
     set by the main process; a hard-coded title here would silently override it
     after load, which is how the identity vanished during the 2026-08-11 walk. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; background: #0a0b0d; color: #e8e8ea;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #1c1d20; display: flex;
    align-items: center; gap: 16px; -webkit-app-region: drag;
  }
  header .brand { font-weight: 600; letter-spacing: 0.04em; color: #d8d8dc; }
  nav { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  nav button {
    background: none; border: none; color: #8a8a92; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav button.active { background: #1c1d20; color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #16171a; }
  .row:last-child { border-bottom: none; }
  .label { color: #9a9aa2; }
  .state { padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; }
  .state.AVAILABLE { background: #10321f; color: #4ade80; }
  .state.DEGRADED { background: #3a2a10; color: #fbbf24; }
  .state.UNAVAILABLE { background: #3a1414; color: #f87171; }
  .state.UNKNOWN { background: #1e1e22; color: #8a8a92; }
  .state.HELD { background: #241a3a; color: #c4b5fd; }
  /* JOP-01 founder vocabulary. UNVERIFIED is deliberately NOT red: "we did not
     look" must not read as "it is broken". NEEDS_AUTHORITY is deliberately not
     red either — absent-by-design is not a fault. */
  .state.READY { background: #10321f; color: #4ade80; }
  .state.WORKING { background: #0f2a33; color: #5ec8e0; }
  .state.NEEDS_SETUP { background: #3a2a10; color: #fbbf24; }
  .state.NEEDS_AUTHORITY { background: #241a3a; color: #c4b5fd; }
  .state.BLOCKED { background: #3a1414; color: #f87171; }
  .state.FAILED { background: #3a1414; color: #f87171; }
  .state.UNVERIFIED { background: #1e1e22; color: #8a8a92; border: 1px dashed #3a3a42; }
  /* A precedence fact is not an error. Two valid answers exist and one governs
     by design — that must be visible without being alarming, or the founder
     learns to distrust every coloured panel on the screen. */
  .precedence { background: #16202e; border: 1px solid #24344a; border-left: 2px solid #5ec8e0;
                color: #9fb6c8; font-size: 12.5px; line-height: 1.6; padding: 10px 12px;
                border-radius: 4px; margin-top: 10px; }
  .precedence b { color: #cfe3ef; display: block; margin-bottom: 4px; }
  .headline { font-size: 19px; font-weight: 600; margin: 0 0 6px; }
  .sentence { color: #9a9aa2; font-size: 13.5px; line-height: 1.55; margin: 0; }
  .why { color: #8a8a92; font-size: 12px; margin-top: 4px; }
  .fix { color: #7fb2e0; font-size: 12px; margin-top: 3px; }
  .src { color: #4a4a52; font-size: 11px; margin-top: 3px; font-family: ui-monospace, Menlo, monospace; }
  .detail { color: #6a6a72; font-size: 12px; margin-top: 4px; max-width: 460px; text-align: right; }
  .card { background: #111214; border: 1px solid #1c1d20; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #7a7a82; font-weight: 600; }
  textarea, input[type=text] {
    width: 100%; background: #16171a; border: 1px solid #26272b; color: #eee;
    border-radius: 8px; padding: 10px 12px; font: inherit; resize: vertical;
  }
  select { background: #16171a; border: 1px solid #26272b; color: #eee; border-radius: 6px; padding: 6px 10px; }
  button.primary {
    background: #2563eb; color: white; border: none; padding: 9px 18px;
    border-radius: 7px; cursor: pointer; font-weight: 600; margin-top: 10px;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  .lane-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
  .lane-badge.C0 { background: #10321f; color: #4ade80; }
  .lane-badge.C1 { background: #10283a; color: #60a5fa; }
  .lane-badge.C3 { background: #3a1032; color: #f0abfc; }
  pre { background: #0e0f11; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; color: #b8b8c0; white-space: pre-wrap; word-break: break-word; }
  .convo-input { display: flex; gap: 8px; margin-bottom: 16px; }
  .convo-input input { flex: 1; }
  .hint { font-size: 11px; color: #55555c; margin-top: 6px; }
  .lane-help { font-size: 12px; color: #7a7a82; margin: 2px 0 12px; line-height: 1.45; }
  .lane-help strong { color: #b8b8c0; font-weight: 600; }
  .arg-field { margin-bottom: 10px; }
  .arg-field label { display: block; font-size: 12px; color: #9a9aa2; margin-bottom: 4px; }
  .arg-field .req { color: #f87171; margin-left: 3px; }
  .arg-field .constraint { font-size: 11px; color: #55555c; margin-top: 3px; }
  .cap-meta { font-size: 11px; color: #55555c; margin: -2px 0 12px; }
  .errors { background: #2a1214; border: 1px solid #4a1c20; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .errors div { color: #f87171; font-size: 12px; }
  .toggle-adv { background: none; border: none; color: #60a5fa; font-size: 12px; padding: 0; cursor: pointer; margin: 4px 0 8px; }
  .kv { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #b8b8c0; }
  .claim { border-bottom: 1px solid #16171a; padding-bottom: 8px; margin-bottom: 8px; }
  .claim:last-child { border-bottom: none; }
  .acts { display: flex; gap: 6px; margin-top: 6px; }
  button.act { background: #1c1d20; border: 1px solid #26272b; color: #c8c8d0; padding: 4px 12px;
               border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.act:hover { background: #26272b; color: #fff; }
  .act-box { background: #0e0f11; border: 1px solid #26272b; border-radius: 8px; padding: 12px; margin-top: 8px; }
  .act-box input, .act-box select { margin-bottom: 8px; }
</style>
</head>
<body>
  <header>
    <span class="brand">JARVIS</span>
    <nav>
      <button data-view="home" class="active">Home</button>
      <button data-view="work">Work</button>
      <button data-view="system">System</button>
    </nav>
  </header>
  <main id="main"></main>
  <script src="legibility.js"></script>
  <script src="capability-form.js"></script>
  <script src="governance.js"></script>
  <script src="provenance.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
