<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- No static <title>. The window title carries the ARTIFACT IDENTITY (F5) and is
     set by the main process; a hard-coded title here would silently override it
     after load, which is how the identity vanished during the 2026-08-11 walk. -->
<style>
  /* ── JARVIS DESKTOP — VISUAL CANON (founder ruling 2026-08-17) ──────────────
     Deep navy field, not black. Slate panels with visible boundaries. Editorial
     serif headline against restrained mono metadata. Four views of ONE
     instrument — cockpit/field, not dashboard/dev console.

     Colour carries governed meaning and nothing else:
       cyan/teal  observed operational state          — never "healthy"
       amber      typed operator attention            — never decoration
       crimson    impeded / failed                     — a real fault
       slate      not authorized (absent by design)    — not a fault
       hollow     observer aperture                    — we did not look
     Changing any of these changes an epistemic claim, not a mood. */
  :root {
    color-scheme: dark;
    --ground:#0A1220; --panel:#0F1A2B; --panel-2:#132339; --hair:#1F3049;
    --ink:#DDE6F2;   --ink-2:#93A7C2; --ink-3:#63799A;  --ink-4:#3E5372;
    --act:#5B93C9;   --teal:#5EC8E0;  --warn:#E0A93A;   --crit:#D6544A;
    --slate:#7E93B8;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Source Serif 4",Georgia,serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  body {
    margin:0; height:100vh; background:var(--ground); color:var(--ink);
    font:14.5px/1.6 var(--serif); display:flex; flex-direction:column;
  }
  header {
    padding:16px 26px; border-bottom:1px solid var(--hair); display:flex;
    align-items:center; gap:22px; -webkit-app-region:drag;
    background:linear-gradient(180deg,#0C1626 0%,var(--ground) 100%);
  }
  header .brand {
    font-family:var(--mono); font-size:12px; font-weight:600;
    letter-spacing:.22em; color:var(--ink-2); text-transform:uppercase;
  }
  nav { display:flex; gap:2px; -webkit-app-region:no-drag; }
  nav button {
    background:none; border:none; color:var(--ink-3); padding:7px 14px;
    border-radius:3px; cursor:pointer; font-family:var(--mono);
    font-size:11px; letter-spacing:.13em; text-transform:uppercase; transition:.15s;
  }
  nav button:hover { color:var(--ink-2); }
  nav button.active { background:var(--panel-2); color:var(--ink); box-shadow:inset 0 -2px 0 var(--act); }
  main { flex:1; overflow-y:auto; padding:26px 30px 60px; }

  /* ── panels ─────────────────────────────────────────────────────────────── */
  .card {
    background:var(--panel); border:1px solid var(--hair); border-radius:4px;
    padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card h3 {
    margin:0 0 12px; font-family:var(--mono); font-size:10.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:.17em; color:var(--ink-3);
  }
  .row {
    display:flex; align-items:flex-start; justify-content:space-between; gap:18px;
    padding:12px 0; border-bottom:1px solid var(--hair);
  }
  .row:last-child { border-bottom:none; }
  .label { color:var(--ink); font-size:15px; }
  .why  { color:var(--ink-2); font-size:13px; margin-top:5px; line-height:1.6; max-width:66ch; }
  .fix  { color:var(--act);   font-size:13px; margin-top:5px; }
  .src  { color:var(--ink-4); font-family:var(--mono); font-size:10.5px; margin-top:5px; letter-spacing:.02em; }
  .path { color:var(--ink-2); font-family:var(--mono); font-size:11.5px; margin-top:4px; }
  .ws-git { color:var(--ink-2); font-size:12.5px; margin-top:5px; }
  .detail { color:var(--ink-3); font-size:12.5px; margin-top:4px; max-width:52ch; }
  .hint { font-size:12.5px; color:var(--ink-3); margin-top:8px; line-height:1.6; }
  .kv { font-family:var(--mono); font-size:11.5px; color:var(--ink-2); }

  /* ── the editorial headline ─────────────────────────────────────────────── */
  .headline { font-family:var(--serif); font-size:23px; font-weight:600; line-height:1.25;
              margin:0 0 8px; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }
  .sentence { color:var(--ink-2); font-size:14.5px; line-height:1.65; margin:0; max-width:74ch; }

  /* ── state badges: meaning, not mood ────────────────────────────────────── */
  .state {
    padding:3px 10px; border-radius:2px; font-family:var(--mono); font-size:10px;
    font-weight:600; letter-spacing:.11em; text-transform:uppercase;
    white-space:nowrap; border:1px solid transparent;
  }
  .state.READY, .state.AVAILABLE     { background:#0E2C36; color:var(--teal);  border-color:#1C4A58; }
  .state.WORKING                     { background:#0E2C36; color:var(--teal);  border-color:#2A6E82; }
  .state.NEEDS_SETUP, .state.DEGRADED{ background:#2E2411; color:var(--warn);  border-color:#4C3C16; }
  .state.NEEDS_AUTHORITY             { background:#1A2334; color:var(--slate); border-color:#2C3A52; }
  .state.BLOCKED, .state.FAILED,
  .state.UNAVAILABLE                 { background:#31161A; color:var(--crit);  border-color:#4E2228; }
  .state.UNVERIFIED, .state.UNKNOWN  { background:transparent; color:var(--ink-3); border:1px dashed var(--ink-4); }
  .state.HELD                        { background:#2E2411; color:var(--warn);  border-color:#4C3C16; }

  /* ── precedence: an informational fact, never an error ──────────────────── */
  .precedence { background:#12243A; border:1px solid #23405F; border-left:2px solid var(--teal);
                color:var(--ink-2); font-size:13px; line-height:1.65; padding:12px 14px;
                border-radius:3px; margin-top:12px; }
  .precedence b { color:var(--ink); display:block; margin-bottom:5px; }
  .errors { background:#2A1418; border:1px solid #4A2028; border-radius:3px; padding:11px 13px; margin-top:10px; }
  .errors div { color:var(--crit); font-size:12.5px; }

  /* ── controls: instrument, not developer console ────────────────────────── */
  textarea, input[type=text] {
    width:100%; background:var(--panel-2); border:1px solid var(--hair); color:var(--ink);
    border-radius:3px; padding:11px 13px; font:inherit; resize:vertical;
  }
  textarea:focus, input[type=text]:focus { outline:none; border-color:var(--act); }
  select { background:var(--panel-2); border:1px solid var(--hair); color:var(--ink);
           border-radius:3px; padding:7px 11px; font-family:var(--mono); font-size:12px; }
  button.primary { background:var(--act); color:#06101C; border:none; padding:10px 20px;
                   border-radius:3px; cursor:pointer; font-family:var(--mono); font-size:11px;
                   font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-top:12px; }
  button.primary:disabled { opacity:.4; cursor:default; }
  button.act, .ws-actions button {
    background:transparent; border:1px solid var(--hair); color:var(--ink-2); padding:6px 13px;
    border-radius:2px; cursor:pointer; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; transition:.15s;
  }
  button.act:hover, .ws-actions button:hover { border-color:var(--act); color:var(--ink); }
  .ws-actions { display:flex; gap:7px; margin-top:14px; }
  .toggle-adv { background:none; border:none; color:var(--act); font-size:12px; padding:0;
                cursor:pointer; margin:6px 0 10px; font-family:var(--mono); }
  .lane-badge { display:inline-block; padding:3px 9px; border-radius:2px; font-family:var(--mono);
                font-size:10px; font-weight:700; letter-spacing:.1em; }
  .lane-badge.C0 { background:#0E2C36; color:var(--teal); }
  .lane-badge.C1 { background:#12243A; color:var(--act); }
  .lane-badge.C3 { background:#1A2334; color:var(--slate); }
  pre { background:#08111C; border:1px solid var(--hair); padding:14px; border-radius:3px;
        overflow-x:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
        white-space:pre-wrap; word-break:break-word; }
  .convo-input { display:flex; gap:9px; margin-bottom:20px; }
  .convo-input input { flex:1; font-family:var(--serif); font-size:15px; }
  .lane-help { font-size:12.5px; color:var(--ink-3); margin:2px 0 14px; line-height:1.6; }
  .lane-help strong { color:var(--ink-2); font-weight:600; }
  .arg-field { margin-bottom:12px; }
  .arg-field label { display:block; font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
                     margin-bottom:5px; letter-spacing:.08em; text-transform:uppercase; }
  .arg-field .req { color:var(--crit); margin-left:3px; }
  .arg-field .constraint { font-size:11px; color:var(--ink-4); margin-top:3px; }
  .cap-meta { font-family:var(--mono); font-size:10.5px; color:var(--ink-4); margin:-2px 0 14px; }
  .claim { border-bottom:1px solid var(--hair); padding-bottom:10px; margin-bottom:10px; }
  .claim:last-child { border-bottom:none; }
  .acts { display:flex; gap:7px; margin-top:8px; }
  .act-box { background:var(--panel-2); border:1px solid var(--hair); border-radius:3px;
             padding:14px; margin-top:10px; }
  .act-box input, .act-box select { margin-bottom:9px; }

  /* ── the Living Spiral field ────────────────────────────────────────────── */
  .spiral-wrap { display:grid; grid-template-columns:minmax(0,1.28fr) minmax(300px,.72fr); gap:20px; }
  @media (max-width:980px) { .spiral-wrap { grid-template-columns:1fr; } }
  .spiral-plate { background:radial-gradient(ellipse at center,#0E1A2C 0%,#0A1220 72%);
                  border:1px solid var(--hair); border-radius:4px; padding:10px; box-shadow:var(--shadow); }
  .sp-ring { fill:none; stroke:#182640; stroke-width:1; }
  .sp-ring-lab { font-family:var(--mono); font-size:7.2px; fill:var(--ink-4);
                 letter-spacing:.16em; text-transform:uppercase; }
  .sp-spoke { stroke:#141F33; stroke-width:1; stroke-dasharray:2 6; }
  .sp-phen { font-family:var(--mono); font-size:8px; fill:var(--ink-3);
             letter-spacing:.24em; text-transform:uppercase; }
  .sp-node { cursor:pointer; }
  .sp-node text { font-family:var(--mono); font-size:8px; fill:var(--ink-2); letter-spacing:.02em; }
  .sp-node:hover text { fill:var(--ink); }
  .sp-dot { stroke:var(--ground); stroke-width:1.5; }
  .sp-observed  { fill:var(--teal); }
  .sp-attention { fill:var(--warn); }
  .sp-conflict  { fill:#E879F9; }
  .sp-aperture  { fill:none; stroke:var(--ink-4); stroke-dasharray:3 2.5; stroke-width:1.5; }
  .sp-edge { stroke:#2A3E5C; stroke-width:1.2; stroke-dasharray:4 3; }
  .sp-axis-note { font-size:12.5px; color:var(--ink-3); margin:10px 4px 0; line-height:1.65; max-width:70ch; }
  .sp-axis-note b { color:var(--ink-2); }
  .sp-aperture-card { background:var(--panel-2); border:1px solid var(--hair);
                      border-left:2px solid var(--ink-4); border-radius:3px;
                      padding:11px 13px; margin-bottom:9px; }
  .sp-aperture-card .s { color:var(--ink); font-size:13.5px; }
  .sp-aperture-card .l { color:var(--ink-2); font-size:12.5px; margin-top:4px; line-height:1.6; }
  .sp-aperture-card .c { color:var(--ink-4); font-size:11.5px; margin-top:4px; font-style:italic; }
  .sp-legend { font-size:12.5px; color:var(--ink-3); line-height:1.85; }
  .sp-legend b { color:var(--ink-2); font-weight:600; }
</style>
</head>
<body>
  <header>
    <span class="brand">JARVIS</span>
    <nav>
      <button data-view="home" class="active">Home</button>
      <button data-view="work">Work</button>
      <button data-view="system">System</button>
      <button data-view="spiral">Living Spiral</button>
    </nav>
  </header>
  <main id="main"></main>
  <script src="legibility.js"></script>
  <script src="spiral.js"></script>
  <script src="capability-form.js"></script>
  <script src="governance.js"></script>
  <script src="provenance.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
