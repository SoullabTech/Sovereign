<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<!-- Window title is owned by main.js because it carries artifact identity. -->
<style>
:root{
  color-scheme:light dark;
  --ground:#f1f3f1;--surface:#fff;--surface2:#e8ece9;--line:#d2d8d4;--line2:#b8c0bb;
  --ink:#18211d;--ink2:#46524c;--muted:#74817a;--accent:#8a5a14;--accentInk:#5d3c0a;--accentSoft:#f5ead5;
  --good:#2c6848;--goodSoft:#dfeee5;--warn:#96670d;--warnSoft:#f5ead0;--bad:#9f392e;--badSoft:#f4dfdc;
  --unob:#5d6d7d;--unobSoft:#e2e7ec;--auth:#594985;--authSoft:#e7e1f0;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 26px -18px rgba(20,30,26,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rail:228px;
}
@media(prefers-color-scheme:dark){:root{
  --ground:#111714;--surface:#19201c;--surface2:#222b26;--line:#2c3731;--line2:#3c4943;
  --ink:#e8eeea;--ink2:#b9c4bd;--muted:#8d9a93;--accent:#d5a04b;--accentInk:#f0c57d;--accentSoft:#382c15;
  --good:#7cc098;--goodSoft:#1d3227;--warn:#deb157;--warnSoft:#392f15;--bad:#e6897a;--badSoft:#3d211d;
  --unob:#9dafbe;--unobSoft:#222c33;--auth:#b4a4e2;--authSoft:#2b243e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -20px rgba(0,0,0,.65);
}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0;-webkit-app-region:drag}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;padding:3px 10px 17px;letter-spacing:.01em}.brand small{display:block;font:600 10px/1.5 var(--sans);color:var(--muted);letter-spacing:.11em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px;-webkit-app-region:no-drag}.nav button{border:1px solid transparent;border-radius:9px;background:none;text-align:left;padding:9px 10px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}.nav button:hover{background:var(--surface2)}.nav button.active{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.nav .n{display:block;font-weight:650}.nav .q{display:block;font-size:11px;color:var(--muted);margin-top:1px}.badge{font:600 10px/1 var(--mono);padding:4px 6px;border-radius:99px;background:var(--accentSoft);color:var(--accentInk);align-self:center;min-width:20px;text-align:center}
.railFoot{margin-top:auto;padding:10px;color:var(--muted);font-size:11px;line-height:1.55;-webkit-app-region:no-drag}.railFoot .mono{font-family:var(--mono)}
.stage{height:100%;display:flex;flex-direction:column;min-width:0;min-height:0}.contextbar{min-height:49px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);display:flex;align-items:center;gap:9px;padding:8px 20px;-webkit-app-region:drag}.contextbar .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.contextbar .ctx{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55ch}.contextbar .origin{font-size:11px;color:var(--muted);white-space:nowrap}.contextbar .spacer{flex:1}.contextbar button{-webkit-app-region:no-drag}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:30px 34px 70px;scrollbar-gutter:stable;overscroll-behavior:contain}.wrap{max-width:1040px;margin:0 auto}.eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}h1{font-family:var(--serif);font-weight:500;font-size:clamp(27px,3vw,38px);line-height:1.18;max-width:30ch;margin:7px 0 7px}h2{font-size:14px;margin:0 0 10px;letter-spacing:.02em}.lede{font-size:15px;color:var(--ink2);max-width:72ch;margin:0 0 24px}.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12px}
.section{margin-top:28px}.list{display:flex;flex-direction:column;gap:8px}.row,.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.row{padding:13px 14px}.rowTop{display:flex;gap:14px;align-items:flex-start}.rowBody{min-width:0;flex:1}.rowTitle{font-weight:650;font-size:15px}.rowPlain{color:var(--ink2);margin-top:2px}.rowMeta{color:var(--muted);font-size:11px;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:650;font-size:12px}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}.btn.subtle{background:none;color:var(--muted);border-color:var(--line)}.btn:disabled{opacity:.48;cursor:default}
.pill{font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:4px 8px;white-space:nowrap}.pill.good{background:var(--goodSoft);color:var(--good)}.pill.warn{background:var(--warnSoft);color:var(--warn)}.pill.failed{background:var(--badSoft);color:var(--bad)}.pill.unobserved{background:var(--unobSoft);color:var(--unob)}.pill.unauthorized{background:var(--authSoft);color:var(--auth)}.pill.neutral{background:var(--surface2);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:15px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 7px}.card p{margin:0;color:var(--ink2)}
.callout{border-left:3px solid var(--accent);background:var(--accentSoft);color:var(--accentInk);padding:11px 14px;border-radius:0 8px 8px 0}.callout.slate{border-color:var(--unob);background:var(--unobSoft);color:var(--unob)}.callout.bad{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}
.timeline{display:grid;grid-template-columns:max-content 1fr;gap:7px 16px}.timeline .date{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}.contextCard{border:1px solid var(--accent);background:var(--accentSoft);border-radius:10px;padding:14px 15px}.contextCard .why{font-size:12px;color:var(--accentInk);opacity:.9;margin-top:3px}
.empty{padding:24px;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 45%,transparent)}.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px}.side{position:sticky;top:0;align-self:start}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}tr:last-child td{border-bottom:0}
.evidencePane{position:fixed;inset:0 0 0 auto;width:min(660px,72vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 42px rgba(0,0,0,.22);z-index:20;display:flex;flex-direction:column}.evidenceHead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.evidenceHead .spacer{flex:1}.evidenceBody{padding:18px;overflow:auto}.evidenceBody pre{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:9px;padding:14px;font:12px/1.55 var(--mono);color:var(--ink2);margin:10px 0 0}.evidencePath{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)}.errorBox{max-width:760px;margin:80px auto;padding:20px;border:1px solid var(--bad);background:var(--badSoft);border-radius:10px;color:var(--bad)}
.focusList{display:flex;gap:6px;flex-wrap:wrap}.focusChip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 9px;font-size:11px}.focusChip.active{border-color:var(--accent);background:var(--accentSoft);color:var(--accentInk)}
.attentionLaw{margin-top:18px}.attentionLaw b{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.attentionLaw p{margin-top:6px;line-height:1.5}.attentionGate{margin-top:10px;padding:10px 12px;border-left:2px solid var(--line2);background:var(--surface2);border-radius:0 8px 8px 0;color:var(--ink2);font-size:12px;line-height:1.55}.attentionGate b{color:var(--ink);font-weight:650}.attentionDomainGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.attentionDomain{min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.attentionDomainTop{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}.attentionDomainTop>b{font-size:13px}.attentionDomain .rowPlain{font-size:12px;line-height:1.45}
.technicalDetails{margin-top:8px;color:var(--muted);font-size:11px}.technicalDetails summary{cursor:pointer;font-weight:650;color:var(--muted)}.technicalDetails>div{margin-top:6px;padding:8px 10px;border-left:2px solid var(--line2);font-family:var(--mono);line-height:1.55;word-break:break-word}
.secondaryDetails{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}.secondaryDetails>summary{cursor:pointer;font-weight:650;color:var(--ink2)}.secondaryDetails .detailsBody{padding-top:8px}
.graphCenter{max-width:650px;margin:0 auto;padding:20px 22px;border:1px solid var(--accent);background:var(--accentSoft);border-radius:14px;box-shadow:var(--shadow);text-align:left}.graphCenter h2{font-family:var(--serif);font-size:27px;font-weight:500;margin:4px 0}.graphCenter p{color:var(--accentInk);margin:7px 0 0}.graphNodeSub{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-word}.graphScope{display:flex;gap:5px;align-items:baseline;color:var(--ink2);margin-bottom:14px}.graphScope span{color:var(--muted);font-size:12px}.graphGroup{margin:18px 0}.graphGroup h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.graphGroupGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.graphRelation{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px;box-shadow:var(--shadow)}.graphRelationTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.graphRel{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--accentInk);margin-bottom:3px}.graphNodeLabel{font-weight:650;font-size:14px;color:var(--ink)}
.workField{display:grid;grid-template-columns:max-content minmax(160px,1fr);gap:2px 12px;align-items:baseline;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--surface) 70%,transparent)}.workField .label{grid-row:1/3;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.workField span:last-child{color:var(--muted);font-size:12px}.workComposer{margin-top:10px}.workComposer textarea{width:100%;resize:vertical;min-height:90px;margin-top:8px;padding:11px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--ground);color:var(--ink);outline:none}.workComposer textarea:focus{border-color:var(--accent)}.workTurns{display:flex;flex-direction:column;gap:9px;margin:10px 0}.turn{max-width:92%;padding:11px 13px;border-radius:10px;border:1px solid var(--line)}.turn.kelly{align-self:flex-end;background:var(--accentSoft);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.turn.jarvis{align-self:flex-start;background:var(--surface)}.turnWho{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}.turnText{color:var(--ink2)}.turnContext{margin-top:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ground);font-size:11px;color:var(--muted);line-height:1.55}.turnVerification{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.planCard{margin-top:10px;padding:14px 15px;border:1px solid var(--accent);background:var(--accentSoft);border-radius:10px}.planHead{display:flex;gap:10px;align-items:center;justify-content:space-between}.planObjective{margin-top:7px;color:var(--accentInk)}.planCard ol{margin:10px 0 0 20px;padding:0}.planCard li{margin:5px 0;color:var(--ink2)}
@media(max-width:1100px){.attentionDomainGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){:root{--rail:192px}.grid3{grid-template-columns:1fr}.split{grid-template-columns:1fr}.side{position:static}}
@media(max-width:700px){.attentionDomainGrid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.rail{position:fixed;z-index:12;left:0;right:0;bottom:0;height:auto;display:block;padding:6px;border-right:0;border-top:1px solid var(--line)}.brand,.railFoot{display:none}.nav{display:grid;grid-template-columns:repeat(5,1fr)}.nav button{padding:7px 4px;text-align:center;display:block}.nav .q,.badge{display:none}.stage{padding-bottom:64px}.contextbar{padding-inline:12px}main{padding:22px 15px 48px}.grid2{grid-template-columns:1fr}.evidencePane{width:100vw}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">JARVIS<small>Kelly's World</small></div>
    <nav class="nav" aria-label="Founder Workspace">
      <button data-view="today"><span><span class="n">Today</span><span class="q">Active fields · what is alive now?</span></span><span class="badge" data-badge="today"></span></button>
      <button data-view="work"><span><span class="n">Work</span><span class="q">Work with JARVIS + your partners</span></span><span class="badge" data-badge="work"></span></button>
      <button data-view="graph"><span><span class="n">Graph</span><span class="q">How your world connects</span></span></button>
      <button data-view="monitor"><span><span class="n">Monitor</span><span class="q">What needs watching?</span></span><span class="badge" data-badge="monitor"></span></button>
      <button data-view="system"><span><span class="n">System</span><span class="q">Machinery + evidence underneath</span></span></button>
    </nav>
    <div class="railFoot" id="railFoot">Loading live workspace…</div>
  </aside>
  <section class="stage">
    <div class="contextbar" id="contextBar"></div>
    <main id="main"><div class="loading">Reading the governed Founder Workspace…</div></main>
  </section>
</div>
<div id="evidenceRoot"></div>
<script src="operator-intent-contract.js"></script>
<script src="operator-work-graph.js"></script>
<script src="founder-workspace-renderer.js"></script>
</body>
</html>
