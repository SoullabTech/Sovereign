<!doctype html>
<meta charset="utf-8">
<title>MAIA</title>
<style>
  /* ══════════════════════════════════════════════════════════════════════
     SOULLAB CORE tokens — values copied verbatim from app/globals.css
     (:root, "SOULLAB CORE — Canonical design tokens"). Desktop loads over
     file:// with no network, so the canonical stylesheet cannot be imported;
     the tokens are restated rather than re-invented.

     ⛔ These are a COPY, and a copy can drift. Desktop must not hold a second
     palette — if app/globals.css changes, this block is downstream of it, not
     a peer. See docs/canon/SOULLAB_THEME.md for usage rules.
     ══════════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: dark;
    --sl-bg-canvas: #0A1628;
    --sl-bg-canvas-deep: #060D18;
    --sl-bg-surface: #121A2B;
    --sl-bg-elevated: #1A2235;
    --sl-border-subtle: #1E2F4D;
    --sl-border-strong: #2A3F63;
    --sl-text-primary: #F5F7FB;
    --sl-text-secondary: #B7C0D1;
    --sl-text-muted: #7F8AA3;
    /* data-domain="maia" */
    --sl-accent-primary: #B8860B;
    --sl-accent-soft: #D4AF37;
    --sl-state-error: #A65A5A;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; height:100vh; display:flex; flex-direction:column;
    background:var(--sl-bg-canvas); color:var(--sl-text-primary);
    font:15px/1.65 ui-sans-serif,-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header { padding:18px 28px 0; -webkit-app-region:drag; }
  .mark { font-size:13px; letter-spacing:.22em; color:var(--sl-accent-soft); font-weight:500; }
  main { flex:1; overflow-y:auto; padding:28px; display:flex; flex-direction:column; gap:22px; }
  main.center { justify-content:center; align-items:center; }

  .turn { max-width:640px; }
  .turn .who { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
               color:var(--sl-text-muted); margin-bottom:5px; }
  .turn.member { align-self:flex-end; text-align:right; }
  .turn.member .body { color:var(--sl-text-secondary); }
  .turn.maia .body { color:var(--sl-text-primary); font-size:16.5px; }
  .body { white-space:pre-wrap; }

  .state { font-size:13px; color:var(--sl-text-muted); min-height:20px; }
  .state.err { color:var(--sl-state-error); }

  footer { padding:16px 28px 22px; border-top:1px solid var(--sl-border-subtle);
           display:flex; align-items:center; gap:14px; }
  button { background:var(--sl-bg-elevated); color:var(--sl-text-primary);
           border:1px solid var(--sl-border-strong);
           border-radius:7px; padding:9px 18px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--sl-bg-surface); border-color:var(--sl-accent-primary); }
  button:disabled { opacity:.35; cursor:default; }
  button.primary { background:var(--sl-accent-primary); border-color:var(--sl-accent-primary);
                   color:var(--sl-bg-canvas-deep); font-weight:600; }
  button.primary:hover:not(:disabled) { background:var(--sl-accent-soft); border-color:var(--sl-accent-soft); }
  .spacer { flex:1; }

  .dot { width:9px; height:9px; border-radius:50%; background:var(--sl-border-strong); flex:none; }
  .dot.live { background:var(--sl-accent-soft); animation:pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  form { display:flex; flex-direction:column; gap:11px; width:290px; }
  input { background:var(--sl-bg-surface); border:1px solid var(--sl-border-strong); border-radius:7px;
          padding:10px 12px; color:var(--sl-text-primary); font:inherit; }
  input:focus { outline:none; border-color:var(--sl-accent-primary); }
  .hint { font-size:12.5px; color:var(--sl-text-muted); text-align:center; max-width:300px; }

  #log { display:none; border-top:1px solid var(--sl-border-subtle); max-height:180px; overflow-y:auto;
         padding:10px 28px; font-family:ui-monospace,Menlo,monospace;
         font-size:10.5px; color:var(--sl-text-muted); }
  #log.on { display:block; }
  .link { background:none; border:none; color:var(--sl-text-muted); font-size:12px;
          padding:4px 6px; cursor:pointer; }

  /* DESKTOP-TEXT-01 — the composer. Sits above the voice bar because writing
     and speaking are peers: neither is the "real" way to reach her. */
  #composer { display:none; gap:10px; padding:14px 28px 0; align-items:center; }
  #composer input {
    flex:1; margin:0; padding:13px 16px; border-radius:11px; font-size:15px;
    background:var(--sl-bg-surface); border:1px solid var(--sl-border-subtle);
    color:var(--sl-text-primary);
  }
  #composer input::placeholder { color:var(--sl-text-muted); }
  #composer input:focus { border-color:var(--sl-accent-primary); }
  #composer button { padding:12px 20px; }
  .link:hover { color:var(--sl-accent-soft); }
</style>

<header><div class="mark">MAIA</div></header>

<main id="main" class="center">
  <form id="signin">
    <input id="u" placeholder="username" autocomplete="username" autofocus>
    <input id="p" type="password" placeholder="password" autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <div class="hint" id="autherr"></div>
  </form>
</main>

<form id="composer">
  <input id="msg" placeholder="Message MAIA…" autocomplete="off" spellcheck="true">
  <button class="primary" id="send" type="submit">Send</button>
</form>

<footer id="bar" style="display:none">
  <div class="dot" id="dot"></div>
  <div class="state" id="state">Ready when you are.</div>
  <div class="spacer"></div>
  <button class="link" id="toggle">diagnostics</button>
  <button class="link" id="out">sign out</button>
  <button class="primary" id="talk">Start listening</button>
</footer>

<div id="log"></div>
<script src="renderer.js"></script>
