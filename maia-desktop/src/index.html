<!doctype html>
<meta charset="utf-8">
<title>MAIA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; height:100vh; display:flex; flex-direction:column;
    background:#14100E; color:#EDE4DA;
    font:15px/1.65 ui-sans-serif,-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header { padding:18px 28px 0; -webkit-app-region:drag; }
  .mark { font-size:13px; letter-spacing:.22em; color:#B08D57; font-weight:500; }
  main { flex:1; overflow-y:auto; padding:28px; display:flex; flex-direction:column; gap:22px; }
  main.center { justify-content:center; align-items:center; }

  .turn { max-width:640px; }
  .turn .who { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
               color:#7C7168; margin-bottom:5px; }
  .turn.member { align-self:flex-end; text-align:right; }
  .turn.member .body { color:#C7BCB1; }
  .turn.maia .body { color:#EDE4DA; font-size:16.5px; }
  .body { white-space:pre-wrap; }

  .state { font-size:13px; color:#8A7E74; min-height:20px; }
  .state.err { color:#D08A6E; }

  footer { padding:16px 28px 22px; border-top:1px solid #241E1A;
           display:flex; align-items:center; gap:14px; }
  button { background:#241E1A; color:#EDE4DA; border:1px solid #382F29;
           border-radius:7px; padding:9px 18px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:#2E2621; }
  button:disabled { opacity:.35; cursor:default; }
  button.primary { background:#B08D57; border-color:#B08D57; color:#1A1410; font-weight:500; }
  .spacer { flex:1; }

  .dot { width:9px; height:9px; border-radius:50%; background:#4A423C; flex:none; }
  .dot.live { background:#B08D57; animation:pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  form { display:flex; flex-direction:column; gap:11px; width:290px; }
  input { background:#1C1714; border:1px solid #382F29; border-radius:7px;
          padding:10px 12px; color:#EDE4DA; font:inherit; }
  input:focus { outline:none; border-color:#B08D57; }
  .hint { font-size:12.5px; color:#7C7168; text-align:center; max-width:300px; }

  #log { display:none; border-top:1px solid #241E1A; max-height:180px; overflow-y:auto;
         padding:10px 28px; font-family:ui-monospace,Menlo,monospace;
         font-size:10.5px; color:#6E645C; }
  #log.on { display:block; }
  .link { background:none; border:none; color:#7C7168; font-size:12px;
          padding:4px 6px; cursor:pointer; }
  .link:hover { color:#B08D57; }
</style>

<header><div class="mark">MAIA</div></header>

<main id="main" class="center">
  <form id="signin">
    <input id="u" placeholder="username" autocomplete="username" autofocus>
    <input id="p" type="password" placeholder="password" autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <div class="hint" id="autherr"></div>
  </form>
</main>

<footer id="bar" style="display:none">
  <div class="dot" id="dot"></div>
  <div class="state" id="state">Ready when you are.</div>
  <div class="spacer"></div>
  <button class="link" id="toggle">diagnostics</button>
  <button class="link" id="out">sign out</button>
  <button class="primary" id="talk">Start listening</button>
</footer>

<div id="log"></div>
<script src="renderer.js"></script>
